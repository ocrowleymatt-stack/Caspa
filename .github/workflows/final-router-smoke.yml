name: Final Router Smoke

on:
  push:
    paths:
      - '.github/workflows/final-router-smoke.yml'
      - 'scripts/final-router-smoke.mjs'

# Validates production routing, Venice-first failover, Grok multi-agent research and Gemini Council retry.
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Exercise final production router
        run: node scripts/final-router-smoke.mjs
