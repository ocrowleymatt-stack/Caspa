name: Probe Atlas Mountain access from Caspa

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/probe-atlas-mountain-access.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ATLAS_HOST: 116.202.24.63
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
    steps:
      - name: Select live server identity
        shell: bash
        run: |
          set -euo pipefail
          key=''
          selected=''
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY DEPLOY_SSH_KEY SERVER_SSH_KEY; do
            if [ -n "${!name:-}" ]; then key="${!name}"; selected="$name"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
          echo "hetzner_identity_name=$selected"

      - name: Probe Mountain receiver read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 root@"$ATLAS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "host=$(hostname)"
          echo "nginx=$(nginx -t >/dev/null 2>&1 && echo valid || echo invalid)"
          echo "openwebui=$(curl -fsS --max-time 3 http://127.0.0.1:3002/health >/dev/null 2>&1 && echo healthy || echo unavailable)"
          echo "receiver_service=$(systemctl is-active atlas-mountain-deploy-receiver.service 2>/dev/null || true)"
          echo "receiver_local=$(curl -fsS --max-time 3 http://127.0.0.1:3016/health >/dev/null 2>&1 && echo healthy || echo unavailable)"
          echo "receiver_include=$(nginx -T 2>&1 | grep -q 'atlas-mountain-deploy-receiver.conf' && echo present || echo absent)"
          status=$(curl -ksS -o /dev/null -w '%{http_code}' --max-time 8 -X POST -H 'Content-Type: application/json' --data '{}' https://atlas.ocrowley.com/__atlas_mountain_deploy/v1 || true)
          echo "receiver_public_unauthenticated=${status:-000}"
          echo "existing_atlas_public=$(curl -ksS -o /dev/null -w '%{http_code}' --max-time 8 https://atlas.ocrowley.com/health || true)"
          echo '--- receiver unit status ---'
          systemctl status atlas-mountain-deploy-receiver.service --no-pager -l 2>&1 | tail -n 30 || true
          echo '--- receiver journal ---'
          journalctl -u atlas-mountain-deploy-receiver.service -n 40 --no-pager -o cat 2>&1 || true
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
