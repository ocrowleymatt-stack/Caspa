name: Remove Misplaced Caspa Fast Upload

on:
  push:
    branches: [main]
    paths:
      - scripts/remove-misplaced-fast-upload.py
      - .github/workflows/remove-misplaced-fast-upload.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/remove-misplaced-fast-upload.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Remove misplaced Caspa fast upload button'
          git push origin HEAD:main
