name: Smoke Atlas Auto Direct v1.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-atlas-auto-direct-v14.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: Select SSH key
        shell: bash
        run: |
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
      - name: Execute live Atlas Auto function with OSINT prompt
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'docker exec -i atlas-openwebui python3 -' <<'PY'
          import asyncio, sqlite3, sys, types

          # Stub only OpenWebUI imports that are irrelevant to the direct web branch.
          # This avoids bootstrapping the whole authenticated app in a standalone test.
          users_mod=types.ModuleType('open_webui.models.users')
          class DummyUsers:
              @staticmethod
              async def get_user_by_id(_):
                  return object()
          users_mod.Users=DummyUsers
          chat_mod=types.ModuleType('open_webui.utils.chat')
          async def unused_generate_chat_completion(*args,**kwargs):
              raise AssertionError('direct web smoke unexpectedly recursed into generate_chat_completion')
          chat_mod.generate_chat_completion=unused_generate_chat_completion
          sys.modules['open_webui.models.users']=users_mod
          sys.modules['open_webui.utils.chat']=chat_mod

          con=sqlite3.connect('/app/backend/data/webui.db')
          code=con.execute("select content from function where id='atlas-auto'").fetchone()[0]
          assert 'ATLAS AUTO DIRECT WEB ROUTING v1.4' in code
          ns={}
          exec(compile(code,'<live-atlas-auto>','exec'),ns)
          Pipe=ns['Pipe']
          statuses=[]
          async def emitter(evt):
              statuses.append(evt)
          body={
              'model':'atlas-auto',
              'messages':[{'role':'user','content':'osint search and create a background story with current info for stuart a Hardman previously of Nottingham, previous partner of Scott millard and now living in walsall with Adam Walsh'}],
          }
          async def main():
              p=Pipe()
              result=await p.pipe(body,{'id':'smoke-user'},None,emitter)
              text=str(result or '')
              print('result_chars=',len(text))
              print('status_count=',len(statuses))
              for s in statuses: print('STATUS',s)
              print('RESULT_PREVIEW',text[:7000].replace('\n',' '))
              low=text.lower()
              assert len(text)>800, text
              assert ('http://' in text or 'https://' in text or 'source' in low or '[[' in text), text[:2000]
              assert 'i should use tools like google' not in low
              assert 'cannot access the internet' not in low
              print('atlas_auto_v14_substantive_live_search=true')
          asyncio.run(main())
          PY
