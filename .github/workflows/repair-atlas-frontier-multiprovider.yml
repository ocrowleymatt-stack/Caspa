name: Repair Atlas Frontier Multi-Provider

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-atlas-frontier-multiprovider.yml'
      - 'scripts/repair-atlas-frontier-multiprovider.py'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - uses: actions/checkout@v4
      - name: Select SSH key
        shell: bash
        run: |
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
      - name: Install live multi-provider pipe
        shell: bash
        run: |
          scp -i ~/.ssh/id_ed25519 scripts/repair-atlas-frontier-multiprovider.py "${ATLAS_USER}@${ATLAS_HOST}:/tmp/repair-atlas-frontier-multiprovider.py"
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          docker cp /tmp/repair-atlas-frontier-multiprovider.py atlas-openwebui:/tmp/repair-atlas-frontier-multiprovider.py
          docker exec atlas-openwebui python3 /tmp/repair-atlas-frontier-multiprovider.py
          docker restart atlas-openwebui >/dev/null
          for i in $(seq 1 40); do
            if curl -fsS --max-time 3 http://127.0.0.1:3002/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS --max-time 5 http://127.0.0.1:3002/health
          docker exec atlas-openwebui python3 - <<'PY'
          import sqlite3
          con=sqlite3.connect('/app/backend/data/webui.db')
          row=con.execute("SELECT content,is_active FROM function WHERE id='atlas-frontier-failover'").fetchone()
          assert row and int(row[1]) == 1
          code=str(row[0] or '')
          assert 'ATLAS MULTI-PROVIDER FRONTIER v2.2' in code
          assert 'ATLAS RESEARCH WEB EXECUTION v1' in code
          assert 'PRIMARY_PROVIDER: str = Field(default="venice")' in code
          assert 'ROUTER_URL: str = Field(default="http://172.19.0.1:3014/api/ai/call")' in code
          assert 'caspa.ocrowley.com/api/ai/call' not in code
          assert 'provider_web = bool(use_web)' in code
          assert 'provider_web = bool(use_web and selected.endswith("sol"))' not in code
          print('frontier_multi_provider_live=v2.2_atlas_router_web_all_tiers')
          PY
          rm -f /tmp/repair-atlas-frontier-multiprovider.py
          REMOTE
