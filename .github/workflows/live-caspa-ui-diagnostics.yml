name: Live Caspa UI Diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-caspa-ui-diagnostics.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HOST: 116.202.24.63
      USER: root
    steps:
      - name: Select SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$PRIVATEKEY2" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Verify repaired live paths
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          BASE='http://127.0.0.1:3000'
          echo '=== HEALTH ==='
          curl -fsS "$BASE/health"; echo
          echo '=== PUBLICATION STATUS ==='
          curl -fsS "$BASE/api/caspa/gold/publication-studio/status"; echo
          echo '=== RECOVERED JOB SUMMARY ==='
          curl -fsS "$BASE/api/caspa/gold/jobs/5afbd817-fee6-46cd-aa26-2274bee58052" > /tmp/recovered.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/recovered.json'))['data']
          print(json.dumps({k:j.get(k) for k in ['id','status','stage','progress','error','updatedAt']}, ensure_ascii=False))
          print('words=', (j.get('result') or {}).get('words'))
          PY
          echo '=== ACTIVE JOBS ==='
          curl -fsS "$BASE/api/caspa/gold/jobs" > /tmp/jobs.json
          python3 - <<'PY'
          import json
          jobs=(json.load(open('/tmp/jobs.json')).get('data') or {}).get('jobs',[])
          for j in jobs:
              if j.get('status') in ('queued','running'):
                  print(json.dumps({k:j.get(k) for k in ['id','type','status','stage','progress','error','updatedAt']},ensure_ascii=False))
          PY
          echo '=== ASSISTANT SMOKE ==='
          code=$(curl -sS -o /tmp/assist.json -w '%{http_code}' -X POST "$BASE/api/assist/assist" -H 'Content-Type: application/json' --data '{"action":"summarize","content":"Caspa smoke test. Reply briefly."}')
          echo "HTTP $code"; cat /tmp/assist.json; echo
          test "$code" = '200'
          echo '=== ROUTER SMOKE ==='
          code=$(curl -sS -o /tmp/router.json -w '%{http_code}' -X POST "$BASE/api/ai/call" -H 'Content-Type: application/json' --data '{"prompt":"Reply exactly OK","maxTokens":32,"intelligenceMode":"speed"}')
          echo "HTTP $code"; cat /tmp/router.json; echo
          test "$code" = '200'
          echo '=== PUBLIC/LOCAL ASSET ==='
          PUBLIC=$(curl -fsS https://caspa.ocrowley.com/ | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -n1)
          LOCAL=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' /root/Caspa/dist/index.html | head -n1)
          echo "public=$PUBLIC"
          echo "local=$LOCAL"
          test "$PUBLIC" = "$LOCAL"
          echo '=== BUNDLE ENDPOINT ==='
          if grep -Raq 'publication-studio/progress' /root/Caspa/dist/assets/*.js; then echo 'STALE_PROGRESS_ENDPOINT_PRESENT'; exit 1; fi
          grep -Raq 'publication-studio/status' /root/Caspa/dist/assets/*.js
          echo 'status endpoint present; stale progress endpoint absent'
          echo '=== CURRENT QUOTA FAILURES SINCE RESTART ==='
          pm2 logs caspa-server --lines 450 --nostream 2>&1 | grep -Ei 'resource-exhausted|quota exceeded|credit_balance_exhausted|credit balance is too low|no credits remaining' | tail -n 60 || true
          REMOTE