name: Deploy Atlas Router

on:
  push:
    branches: [main]
    paths:
      - 'atlas-router/**'
      - '.github/workflows/deploy-atlas-router.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-atlas-router
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: atlas-router/package-lock.json
      - name: Build standalone Atlas router from Atlas-only source
        shell: bash
        run: |
          set -euo pipefail
          cd atlas-router
          npm ci --ignore-scripts
          npm run check
          test -s dist/atlas-router.cjs
          if grep -RInE "from ['\"]\.\./|/root/Caspa|caspa\.ocrowley\.com" server.ts src --include='*.ts' --include='*.js'; then
            echo 'Executable Atlas Router source has escaped the Atlas boundary.' >&2
            exit 1
          fi
      - name: Select SSH key
        shell: bash
        run: |
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
      - name: Install Atlas-owned router service
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'install -d -m 755 /root/AtlasRouter'
          scp -i ~/.ssh/id_ed25519 atlas-router/dist/atlas-router.cjs "${ATLAS_USER}@${ATLAS_HOST}:/root/AtlasRouter/atlas-router.cjs"
          scp -i ~/.ssh/id_ed25519 atlas-router/rewire-openwebui.py "${ATLAS_USER}@${ATLAS_HOST}:/root/AtlasRouter/rewire-openwebui.py"
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          install -d -m 755 /root/AtlasRouter
          install -d -m 700 /root/.atlas-secrets
          chmod 644 /root/AtlasRouter/atlas-router.cjs /root/AtlasRouter/rewire-openwebui.py

          if [ ! -s /root/.atlas-secrets/atlas-router.env ]; then
            echo 'Atlas Router credential file missing: /root/.atlas-secrets/atlas-router.env' >&2
            exit 2
          fi
          chmod 600 /root/.atlas-secrets/atlas-router.env
          set -a
          . /root/.atlas-secrets/atlas-router.env
          set +a

          ATLAS_NETWORK='atlas_atlas-core-net'
          ATLAS_NETWORK_ID="$(docker network inspect -f '{{.Id}}' "$ATLAS_NETWORK")"
          ATLAS_GATEWAY="$(docker network inspect -f '{{(index .IPAM.Config 0).Gateway}}' "$ATLAS_NETWORK")"
          ATLAS_SUBNET="$(docker network inspect -f '{{(index .IPAM.Config 0).Subnet}}' "$ATLAS_NETWORK")"
          ATLAS_BRIDGE="br-${ATLAS_NETWORK_ID:0:12}"
          test "$ATLAS_GATEWAY" = '172.19.0.1'
          ip link show "$ATLAS_BRIDGE" >/dev/null
          echo "atlas_network=$ATLAS_NETWORK gateway=$ATLAS_GATEWAY subnet=$ATLAS_SUBNET bridge=$ATLAS_BRIDGE"

          export NODE_ENV=production
          export ATLAS_ROUTER_HOST="$ATLAS_GATEWAY"
          export ATLAS_ROUTER_PORT=3014
          export ATLAS_ROUTER_MAX_BODY_BYTES=2000000
          export ATLAS_ROUTER_MAX_INFLIGHT=16

          # Keep AtlasRouter private. The bridge name is derived at deploy time so
          # recreating the Docker network cannot silently strand OpenWebUI again.
          if ! ufw status | grep -Fq "$ATLAS_GATEWAY 3014/tcp on $ATLAS_BRIDGE"; then
            ufw allow in on "$ATLAS_BRIDGE" from "$ATLAS_SUBNET" to "$ATLAS_GATEWAY" port 3014 proto tcp comment 'AtlasRouter private bridge'
          fi
          ufw status | grep -F "$ATLAS_GATEWAY 3014/tcp on $ATLAS_BRIDGE"

          pm2 delete atlas-router >/dev/null 2>&1 || true
          pm2 start /root/AtlasRouter/atlas-router.cjs --name atlas-router --time --update-env --max-memory-restart 350M
          pm2 save >/dev/null

          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 "http://$ATLAS_GATEWAY:3014/health" >/tmp/atlas-router-health.json 2>/dev/null; then break; fi
            sleep 1
          done
          cat /tmp/atlas-router-health.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/atlas-router-health.json'))
          assert d.get('service') == 'AtlasRouter', d
          assert d.get('version') == '1.1.0', d
          assert d.get('caspaDependency') is False, d
          assert d.get('localFallbackOwner') == 'atlas-openwebui', d
          assert int(d.get('maxInflight') or 0) == 16, d
          print('atlas_router_health=true', 'version='+str(d.get('version')), 'maxInflight='+str(d.get('maxInflight')))
          PY

          # Production direction: OpenWebUI container -> host AtlasRouter.
          docker exec -i atlas-openwebui python3 - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen('http://172.19.0.1:3014/health', timeout=5) as r:
              d=json.load(r)
          assert d.get('service') == 'AtlasRouter', d
          assert d.get('version') == '1.1.0', d
          assert d.get('caspaDependency') is False, d
          print('openwebui_to_atlas_router=true')
          PY

          curl -fsS --max-time 40 \
            -H 'Content-Type: application/json' \
            -d '{"prompt":"Return exactly ATLAS_ROUTER_OK","providerOverride":"grok","strictProvider":true,"intelligenceMode":"speed","maxTokens":40}' \
            "http://$ATLAS_GATEWAY:3014/api/ai/call" >/tmp/atlas-router-smoke.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/atlas-router-smoke.json'))
          assert d.get('service') == 'AtlasRouter', d
          assert d.get('provider') == 'grok', d
          assert 'ATLAS_ROUTER_OK' in str(d.get('result','')), d
          assert isinstance(d.get('requestId'), str) and d['requestId'], d
          assert isinstance(d.get('requestDurationMs'), int), d
          assert isinstance(d.get('providerDurationMs'), int), d
          print('atlas_router_cloud_smoke=true', d.get('provider'), d.get('model'), 'ms='+str(d.get('requestDurationMs')))
          PY

          # Web-enabled production-direction gate. Ordinary web search must not
          # require X search and must return a substantive, sourced result.
          docker exec -i atlas-openwebui python3 - <<'PY'
          import json, urllib.request
          payload=json.dumps({
              'prompt':'Use live web search. State today UTC date and include at least one retrieved source URL.',
              'primaryProvider':'grok',
              'useWebSearch':True,
              'useXSearch':False,
              'intelligenceMode':'speed',
              'maxTokens':500,
          }).encode()
          req=urllib.request.Request('http://172.19.0.1:3014/api/ai/call', data=payload, headers={'Content-Type':'application/json'})
          with urllib.request.urlopen(req, timeout=75) as r:
              d=json.load(r)
          result=str(d.get('result') or '')
          assert d.get('service') == 'AtlasRouter', d
          assert d.get('provider') in {'grok','gemini','venice'}, d
          assert len(result) > 80, d
          assert 'cannot access the internet' not in result.lower(), d
          print('openwebui_to_atlas_router_web_search=true', d.get('provider'), d.get('model'), 'ms='+str(d.get('requestDurationMs')))
          PY

          docker cp /root/AtlasRouter/rewire-openwebui.py atlas-openwebui:/tmp/rewire-openwebui.py
          docker exec atlas-openwebui python3 /tmp/rewire-openwebui.py
          docker restart atlas-openwebui >/dev/null
          for i in $(seq 1 40); do
            if curl -fsS --max-time 3 http://127.0.0.1:3002/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS --max-time 5 http://127.0.0.1:3002/health

          docker exec -i atlas-openwebui python3 - <<'PY'
          import sqlite3
          con=sqlite3.connect('/app/backend/data/webui.db')
          row=con.execute("select content,is_active from function where id='atlas-frontier-failover'").fetchone()
          assert row and int(row[1]) == 1
          code=str(row[0] or '')
          assert 'http://172.19.0.1:3014/api/ai/call' in code
          assert 'caspa.ocrowley.com/api/ai/call' not in code
          print('atlas_frontier_isolated=true')
          PY

          rm -f /tmp/atlas-router-health.json /tmp/atlas-router-smoke.json
          REMOTE
