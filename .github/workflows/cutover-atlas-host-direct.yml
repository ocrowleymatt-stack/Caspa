name: Cut atlas.ocrowley.com directly to new Atlas

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cutover-atlas-host-direct.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: SSH setup
        shell: bash
        run: |
          set -euo pipefail
          key="${PRIVATEKEY2:-${HETZNER_SSH_KEY:-}}"; test -n "$key"
          mkdir -p ~/.ssh; printf '%s\n' "$key" > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
      - name: Point old hostname at new Atlas service
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          file=/etc/nginx/conf.d/zzz-atlas-auth.conf
          backup="/var/backups/atlas-host-direct-$(date -u +%Y%m%dT%H%M%SZ).conf"
          cp "$file" "$backup"
          python3 - <<'PY'
from pathlib import Path
p=Path('/etc/nginx/conf.d/zzz-atlas-auth.conf')
s=p.read_text()
candidates=[
'''    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }''',
'''    location / {
        return 302 https://atlas2.ocrowley.com$request_uri;
    }'''
]
new='''    location / {
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_redirect off;
    }'''
for old in candidates:
    if old in s:
        s=s.replace(old,new,1)
        break
else:
    raise SystemExit('Expected atlas.ocrowley.com browser location block not found')
p.write_text(s)
PY
          nginx -t
          systemctl reload nginx
          echo "backup=$backup"
          echo "--- direct old hostname response ---"
          curl -k -sS -I https://127.0.0.1/ -H 'Host: atlas.ocrowley.com' | sed -n '1,20p'
          echo "--- login path on old hostname ---"
          curl -k -sS -I https://127.0.0.1/__atlas/login -H 'Host: atlas.ocrowley.com' | sed -n '1,20p'
          echo "--- agentic route remains separately configured ---"
          nginx -T 2>/dev/null | grep -n -A30 'server_name atlas.ocrowley.com' | head -70
          REMOTE
      - name: Verify public hostname is no longer old Next.js
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl -sS -I https://atlas.ocrowley.com/)"
          printf '%s\n' "$headers"
          printf '%s\n' "$headers" | grep -qiE '^HTTP/.* (303|200)'
          if printf '%s\n' "$headers" | grep -qi 'x-nextjs-cache'; then
            echo "Old Next.js response still present" >&2
            exit 1
          fi
          login="$(curl -sS https://atlas.ocrowley.com/__atlas/login)"
          printf '%s' "$login" | grep -q 'Sign in to private Atlas'
