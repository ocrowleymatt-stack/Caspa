name: Finish Autopilot and Council

on:
  push:
    branches: [main]
    paths:
      - 'scripts/finish-autopilot-and-council.py'
      - 'src/services/cloudKnowledgeAutopilotService.ts'
      - 'src/routes/caspa-knowledge-routes.ts'
      - 'src/services/knowledgeClient.ts'
      - 'src/components/KnowledgeCloudPanel.tsx'
      - '.github/workflows/finish-autopilot-and-council.yml'

permissions:
  contents: write

jobs:
  verify-and-integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply integration patch
        run: python3 scripts/finish-autopilot-and-council.py

      - name: Validate patch whitespace
        run: git diff --check

      - name: Test
        run: npm test

      - name: Browser production build
        run: npm run build

      - name: Server production build
        run: npm run build:server

      - name: Commit verified integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No integration changes to commit.'
            exit 0
          fi
          git config user.name 'atlas-automation'
          git config user.email 'atlas-automation@users.noreply.github.com'
          git add server.ts src/services/ai.ts src/services/freeModelPool.ts .env.example .github/workflows/deploy-atlas.yml .deploy-atlas-trigger
          git commit -m 'Finish unattended cloud ingestion and harden Council recovery'
          git push origin HEAD:main
