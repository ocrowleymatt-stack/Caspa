name: Council Gemini Real Budget Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/council-gemini-real-budget-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe Gemini with actual Council budget
        shell: bash
        run: |
          node <<'NODE'
          const started = Date.now();
          const response = await fetch('https://caspa.ocrowley.com/api/ai/call', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            signal: AbortSignal.timeout(24000),
            body: JSON.stringify({
              prompt: `You are a structural critic. Critique this short passage decisively. Return JSON with content, severity, and 3-5 suggestions. TEXT: The door opened. He knew immediately that the room had changed, but he could not say why.`,
              json: true,
              maxTokens: 900,
              providerOverride: 'gemini',
              strictProvider: true,
              intelligenceMode: 'balanced',
              taskHint: 'council',
              skipLocalFallback: true
            })
          });
          const body = await response.json().catch(() => ({}));
          console.log(JSON.stringify({ ms: Date.now() - started, status: response.status, model: body.model || null, error: body.error || null, message: body.message || null, ok: response.ok && Boolean(body.result) }, null, 2));
          if (!response.ok || !body.result) process.exit(1);
          NODE
