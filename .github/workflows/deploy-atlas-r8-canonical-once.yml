name: Deploy Atlas R8 and canonical hostname once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-atlas-r8-canonical-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas2-production-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
      OUTER_SHA256: b0a5c3e41596e927df94a70b2129922b54b5608cf84f5366365f2149e94b51d6
      RELEASE_SHA256: 29c668cde56b5cca4c85d42d8511ce2d98f44de9142fc1610ab8b1bd097ef44c
      RELEASE_COMMIT: c622d7b93a9156eb38679b77a81ec0e8ee2ab2ab
      RELEASE_URL: 'https://sdmntprukwest.oaiusercontent.com/files/00000000-ffd8-8243-96d5-fdaefb52d0be/raw?se=2026-09-25T19%3A32%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=71ec989f-b56d-5416-8976-fc15404d3cbe&skoid=56822d8b-6cfd-42ed-a00d-1452dca42036&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T19%3A23%3A58Z&ske=2026-09-26T19%3A23%3A58Z&sks=b&skv=2026-02-06&sig=2yTYL/s3QKpcCKemdB2O3MHNi3MSVXZOxtK4Vu9i27o%3D'

    steps:
      - name: Download exact verified R8 artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 2 "$RELEASE_URL" -o /tmp/atlas-r8-artifact.zip
          echo "$OUTER_SHA256  /tmp/atlas-r8-artifact.zip" | sha256sum -c -
          rm -rf /tmp/atlas-r8-artifact /tmp/atlas-release-src
          mkdir -p /tmp/atlas-r8-artifact /tmp/atlas-release-src
          unzip -q /tmp/atlas-r8-artifact.zip -d /tmp/atlas-r8-artifact
          echo "$RELEASE_SHA256  /tmp/atlas-r8-artifact/ATLAS_R8_25SEP2026.zip" | sha256sum -c -
          unzip -q /tmp/atlas-r8-artifact/ATLAS_R8_25SEP2026.zip -d /tmp/atlas-release-src
          tar -C /tmp/atlas-release-src -czf /tmp/atlas-release.tar.gz .
          sha256sum /tmp/atlas-release.tar.gz | tee /tmp/atlas-release.tar.gz.sha256
          cp /tmp/atlas-release-src/tools/deployment/update-private-release.py /tmp/update-private-release.py

      - name: Select SSH key
        shell: bash
        run: |
          set -euo pipefail
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY DEPLOY_SSH_KEY SERVER_SSH_KEY; do
            if [ -n "${!name:-}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Upload and activate R8
        shell: bash
        run: |
          set -euo pipefail
          scp -o BatchMode=yes -i ~/.ssh/id_ed25519 /tmp/atlas-release.tar.gz /tmp/update-private-release.py "${ATLAS_USER}@${ATLAS_HOST}:/tmp/"
          archive_sha="$(awk '{print $1}' /tmp/atlas-release.tar.gz.sha256)"
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}"             "python3 /tmp/update-private-release.py --archive /tmp/atlas-release.tar.gz --sha256 '$archive_sha' --commit '$RELEASE_COMMIT'"

      - name: Cut canonical hostname to new Atlas service
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          file=/etc/nginx/conf.d/zzz-atlas-auth.conf
          backup="/var/backups/zzz-atlas-auth.before-r8.$(date -u +%Y%m%dT%H%M%SZ).conf"
          cp "$file" "$backup"
          python3 - <<'PY'
from pathlib import Path
p=Path('/etc/nginx/conf.d/zzz-atlas-auth.conf')
s=p.read_text()
marker='server_name atlas.ocrowley.com;'
start=s.find(marker)
if start < 0:
    raise SystemExit('atlas.ocrowley.com TLS server block not found')
server_start=s.rfind('server {',0,start)
server_end=s.find('\n}',start)
if server_start < 0 or server_end < 0:
    raise SystemExit('atlas.ocrowley.com server block bounds not found')
block=s[server_start:server_end+2]
loc=block.find('location / {')
if loc < 0:
    raise SystemExit('root location not found in atlas.ocrowley.com block')
brace=block.find('{',loc)
depth=0
end=None
for i in range(brace,len(block)):
    if block[i]=='{': depth+=1
    elif block[i]=='}':
        depth-=1
        if depth==0:
            end=i+1
            break
if end is None:
    raise SystemExit('root location block not balanced')
replacement='''location / {
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }'''
block=block[:loc]+replacement+block[end:]
s=s[:server_start]+block+s[server_end+2:]
p.write_text(s)
PY
          nginx -t
          systemctl reload nginx
          echo "nginx_backup=$backup"
          REMOTE

      - name: Verify exact R8 on canonical hostname
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          test "$(basename "$(readlink -f /opt/atlas-unified/current)")" = "c622d7b93a9156eb38679b77a81ec0e8ee2ab2ab"
          systemctl is-active --quiet atlas-unified.service
          python3 - <<'PY' >/tmp/atlas-basic
import base64,json
c=json.load(open('/etc/atlas-unified/runtime.json'))
print('Basic '+base64.b64encode((c['basicUser']+':'+c['basicPassword']).encode()).decode())
PY
          auth="$(cat /tmp/atlas-basic)"
          curl -k -fsS -H 'Host: atlas.ocrowley.com' -H "Authorization: $auth" https://127.0.0.1/ -o /tmp/r8-root.html
          bundle="$(grep -oE 'assets/[^"]+\.js' /tmp/r8-root.html | head -1)"
          test -n "$bundle"
          curl -k -fsS -H 'Host: atlas.ocrowley.com' -H "Authorization: $auth" "https://127.0.0.1/$bundle" -o /tmp/r8.js
          grep -q 'One project context for conversation, deep research, evidence, writing, music, and product work.' /tmp/r8.js
          grep -q 'From brief to technical master candidate' /tmp/r8.js
          grep -q 'Search thoroughly' /tmp/r8.js
          if grep -q 'Command workspace' /tmp/r8.js; then
            echo 'Old Command workspace marker is still present in active bundle' >&2
            exit 1
          fi
          echo "r8_bundle=$bundle"
          echo "canonical_host_r8=true"
          curl -k -sS -I https://127.0.0.1/ -H 'Host: atlas.ocrowley.com' | sed -n '1,15p'
          REMOTE
          curl -fsS --max-time 15 https://atlas.ocrowley.com/health
