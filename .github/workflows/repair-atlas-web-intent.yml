name: Repair Atlas Web Intent

on:
  push:
    paths:
      - 'scripts/repair-atlas-web-intent.py'
      - '.github/workflows/repair-atlas-web-intent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - uses: actions/checkout@v4

      - name: Select SSH key
        shell: bash
        run: |
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Patch live global Atlas public-source filter
        shell: bash
        run: |
          scp -i ~/.ssh/id_ed25519 scripts/repair-atlas-web-intent.py "${ATLAS_USER}@${ATLAS_HOST}:/tmp/repair-atlas-web-intent.py"
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          docker cp /tmp/repair-atlas-web-intent.py atlas-openwebui:/tmp/repair-atlas-web-intent.py
          docker exec atlas-openwebui python3 /tmp/repair-atlas-web-intent.py
          docker restart atlas-openwebui >/dev/null
          for i in $(seq 1 40); do
            if curl -fsS --max-time 3 http://127.0.0.1:3002/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS --max-time 5 http://127.0.0.1:3002/health
          docker exec atlas-openwebui python3 - <<'PY'
          import sqlite3,json
          con=sqlite3.connect('/app/backend/data/webui.db')
          row=con.execute("SELECT content,meta,is_active,is_global FROM function WHERE id='atlas-public-source-research'").fetchone()
          assert row, 'filter missing'
          code=str(row[0] or '')
          assert 'ATLAS WEB INTENT ACTIVATION v1' in code
          assert 'features["web_search"] = True' in code
          assert 'features["web_search"] = False' in code
          assert int(row[2]) == 1 and int(row[3]) == 1
          print(json.dumps({'marker':True,'active':True,'global':True,'web_on':True,'web_off_override':True}))
          con.close()
          PY
          rm -f /tmp/repair-atlas-web-intent.py
          REMOTE
