name: Retry Atlas Mountain fixed deploy

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/retry-atlas-mountain-fixed-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ATLAS_HOST: 116.202.24.63
      RELEASE_SHA: d3400dda19dc9bec9737d2e185811d233bc84fc9
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
    steps:
      - name: Select live server identity
        shell: bash
        run: |
          set -euo pipefail
          key=''
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY DEPLOY_SSH_KEY SERVER_SSH_KEY; do
            if [ -n "${!name:-}" ]; then key="${!name}"; echo "identity=$name"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Execute fixed deploy script on authenticated archive
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 root@"$ATLAS_HOST" "RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          archive="/root/AtlasMountainDeploy/inbox/${RELEASE_SHA}.tgz"
          test -s "$archive"
          echo "authenticated_archive_bytes=$(stat -c '%s' "$archive")"
          set +e
          output="$(/root/AtlasMountainDeploy/deploy.sh "$RELEASE_SHA" "$archive" 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          echo "fixed_deploy_exit=$rc"
          exit "$rc"
          REMOTE

      - name: Verify exact release is live
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 root@"$ATLAS_HOST" "RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          current="$(basename "$(readlink -f /opt/atlas-mountain/current)")"
          test "$current" = "$RELEASE_SHA"
          systemctl is-active --quiet atlas-mountain-deploy-receiver.service
          systemctl is-active --quiet atlas-mountain-nexus.service
          curl -fsS --max-time 5 http://127.0.0.1:43101/health >/dev/null
          nginx -t >/dev/null
          echo "deployed_sha=$current"
          echo 'nexus_local_health=ok'
          REMOTE
          ui="$(curl -ksS -o /tmp/ui -w '%{http_code}' --max-time 10 https://atlas.ocrowley.com/v12/)"
          api="$(curl -ksS -o /dev/null -w '%{http_code}' --max-time 10 https://atlas.ocrowley.com/v12/api/models)"
          test "$ui" = 200
          case "$api" in 401|403) ;; *) exit 2 ;; esac
          curl -fsS --max-time 10 https://atlas.ocrowley.com/health >/dev/null
          echo "public_ui=$ui"
          echo "anonymous_api=$api"
          echo 'existing_atlas_health=ok'

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519 /tmp/ui
