name: Diagnose Atlas Council Live

on:
  push:
    paths:
      - '.github/workflows/diagnose-atlas-council-live.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: Select SSH key
        shell: bash
        run: |
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Inspect live Atlas services
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'bash -s' <<'REMOTE'
          set +e
          echo '=== CLOCK / HOST ==='
          date -u
          hostname

          echo '=== LISTENING TCP PORTS ==='
          ss -ltnp 2>/dev/null | sed -n '1,120p'

          echo '=== PM2 ==='
          pm2 jlist 2>/dev/null | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{for(const p of JSON.parse(s)){console.log(JSON.stringify({name:p.name,pid:p.pid,status:p.pm2_env?.status,port:p.pm2_env?.env?.PORT||p.pm2_env?.PORT||null,cwd:p.pm2_env?.pm_cwd||null}))}}catch(e){console.log("pm2 parse failed")}})'

          echo '=== DOCKER ==='
          docker ps --format '{{.Names}} | {{.Image}} | {{.Ports}} | {{.Status}}' 2>/dev/null || true

          echo '=== SYSTEMD LIKELY AI / WEB SERVICES ==='
          systemctl --type=service --state=running --no-pager 2>/dev/null | grep -Ei 'open-webui|webui|atlas|ollama|litellm|router|python|caspa|nginx' || true

          echo '=== NGINX ACTIVE SITES / UPSTREAM TARGETS ==='
          nginx -T 2>/dev/null | grep -E 'server_name|proxy_pass|upstream ' | sed -n '1,160p'

          echo '=== CASPA SOURCE LOCAL-ENDPOINT REFERENCES ==='
          cd /root/Caspa 2>/dev/null || true
          grep -RInE --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist --exclude='*.map' '(127\.0\.0\.1|localhost|UNIFIED_ROUTER_URL|OLLAMA|COUNCIL|council)' . 2>/dev/null | head -n 180 || true

          echo '=== SAFE ENV CONFIG SUMMARY ==='
          node <<'NODE'
          const fs=require('fs');
          let raw='';try{raw=fs.readFileSync('/root/Caspa/.env','utf8')}catch{}
          const rows=raw.split(/\r?\n/).filter(Boolean).filter(x=>!x.trim().startsWith('#'));
          for(const row of rows){
            const i=row.indexOf('='); if(i<1) continue;
            const k=row.slice(0,i).trim(); const v=row.slice(i+1).trim().replace(/^['"]|['"]$/g,'');
            if(/(URL|HOST|PORT|ROUTER|COUNCIL|ATLAS|OLLAMA|WEBUI)/i.test(k)){
              let safe=v?'SET':'EMPTY';
              if(/URL/i.test(k)&&v){try{const u=new URL(v); safe=`${u.protocol}//${u.hostname}${u.port?':'+u.port:''}${u.pathname}`;}catch{}}
              console.log(`${k}=${safe}`);
            }
          }
          NODE

          echo '=== RECENT CONNECTION / COUNCIL ERRORS FROM PM2 ==='
          pm2 logs caspa-server --lines 500 --nostream 2>&1 | grep -Ei 'refused|ECONNREFUSED|urlopen|council|failed|timeout|router|unified|ollama' | tail -n 160 || true

          echo '=== OPEN WEBUI / PYTHON CONTAINER LOG ERRORS (IF PRESENT) ==='
          for c in $(docker ps --format '{{.Names}}' 2>/dev/null | grep -Ei 'webui|atlas|open|litellm|router|council'); do
            echo "--- $c ---"
            docker logs --since 30m "$c" 2>&1 | grep -Ei 'refused|urlopen|errno 111|council|adversarial|evidence analyst|timeout|error' | tail -n 160 || true
          done
          REMOTE
