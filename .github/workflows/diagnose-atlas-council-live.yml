name: Diagnose Atlas Council Live

on:
  push:
    paths:
      - '.github/workflows/diagnose-atlas-council-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: Select SSH key
        shell: bash
        run: |
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Inspect exact Council OSINT quorum methods
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'bash -s' <<'REMOTE'
          set -e
          docker exec -i atlas-openwebui python3 - <<'PY'
          import re, sqlite3
          con=sqlite3.connect('/app/backend/data/webui.db')
          row=con.execute("SELECT content FROM function WHERE id='atlas-council'").fetchone()
          if not row: raise SystemExit('atlas-council function missing')
          lines=str(row[0]).splitlines()
          names=(
              '_osint_deterministic_brief',
              '_osint_fast_result',
              '_active_osint_packet',
              '_bigbrother_packet',
              '_spiderfoot_packet',
              '_bbot_packet',
              '_intelowl_packet',
              '_cc_retrieve_context',
              '_evidence_packet',
          )
          print('=== VERSION MARKERS ===')
          for n,line in enumerate(lines,1):
              if 'Atlas Council v3.' in line or 'initial useful quorum' in line or 'No substantive specialist' in line:
                  print(f'{n:04d} {line}')
          for name in names:
              pattern=re.compile(r'^\s*(?:async\s+)?def\s+'+re.escape(name)+r'\b')
              starts=[i for i,line in enumerate(lines) if pattern.search(line)]
              if not starts:
                  print(f'=== {name}: NOT FOUND ===')
                  continue
              start=starts[0]
              indent=len(lines[start])-len(lines[start].lstrip())
              end=min(len(lines), start+140)
              for j in range(start+1,end):
                  stripped=lines[j].strip()
                  current_indent=len(lines[j])-len(lines[j].lstrip()) if stripped else indent+1
                  if stripped and current_indent <= indent and re.match(r'(?:async\s+)?def\s+|class\s+', stripped):
                      end=j
                      break
              print(f'=== {name} lines {start+1}-{end} ===')
              for j in range(start,end):
                  text=lines[j]
                  if re.search(r'(?i)(api[_-]?key|secret|password|token)\s*=', text):
                      text=text.split('=',1)[0]+'= <REDACTED>'
                  print(f'{j+1:04d} {text}')
          con.close()
          PY
          REMOTE