name: Diagnose Atlas Council Live

on:
  push:
    paths:
      - '.github/workflows/diagnose-atlas-council-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: Select SSH key
        shell: bash
        run: |
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Trace live Council implementation
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'bash -s' <<'REMOTE'
          set +e
          echo '=== CLOCK / HOST ==='
          date -u
          hostname

          echo '=== LIVE REPOSITORY STATE ==='
          cd /root/Caspa 2>/dev/null || exit 0
          printf 'HEAD='; git rev-parse HEAD 2>/dev/null || true
          printf 'BRANCH='; git branch --show-current 2>/dev/null || true
          git status --short 2>/dev/null || true
          git diff --stat 2>/dev/null || true

          echo '=== PM2 EXECUTION OWNERS ==='
          pm2 jlist 2>/dev/null | node -e '
            let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{try{for(const p of JSON.parse(s)){console.log(JSON.stringify({name:p.name,pid:p.pid,status:p.pm2_env?.status,cwd:p.pm2_env?.pm_cwd||null,exec:p.pm2_env?.pm_exec_path||null,port:p.pm2_env?.env?.PORT||p.pm2_env?.PORT||null}))}}catch(e){console.log("pm2 parse failed")}})'

          echo '=== CONTAINERS / SIDECARS ==='
          docker ps --format '{{.Names}} | {{.Image}} | {{.Ports}} | {{.Status}}' 2>/dev/null || true

          echo '=== COUNCIL ROUTE / FAILURE STRING OWNERS ==='
          PATTERN='Council retrieval quorum|local inference saturated|retrieval preserved|Council audit:|no emergency inference|runCouncilResearch|getCouncilResearchStaticInfo|getCouncilResearchSourceCollectorStaticInfo|/api/ai/council|Council OSINT pass|bounded specialist inference'
          grep -RInE --binary-files=without-match \
            --exclude-dir=node_modules --exclude-dir=.git --exclude='*.map' \
            "$PATTERN" /root/Caspa 2>/dev/null | head -n 260 || true

          echo '=== RELEVANT LIVE SOURCE CONTEXT ==='
          grep -RIlE --binary-files=without-match \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist --exclude='*.map' \
            "$PATTERN" /root/Caspa 2>/dev/null | head -n 16 | while read -r f; do
              echo "--- FILE: $f ---"
              grep -nE -C 16 "$PATTERN" "$f" 2>/dev/null | head -n 220 || true
          done

          echo '=== DIRTY RELEVANT SOURCE DIFF ==='
          for f in $(git status --porcelain 2>/dev/null | awk '{print $2}'); do
            if [ -f "$f" ] && grep -qEi "$PATTERN" "$f" 2>/dev/null; then
              echo "--- DIFF: $f ---"
              git diff -- "$f" 2>/dev/null | head -n 280 || true
            fi
          done

          echo '=== LIVE BUILD INFO ==='
          curl -ksS --max-time 8 https://caspa.ocrowley.com/api/build-info 2>/dev/null || true
          echo

          echo '=== BOUNDED COUNCIL PROBE ==='
          curl -ksS --max-time 55 \
            -H 'Content-Type: application/json' \
            -X POST https://caspa.ocrowley.com/api/ai/council \
            --data '{"question":"Find the latest public UK government update about digital identity. Identify the bounded target before searching and cite the source.","intelligenceMode":"balanced","useSearch":true,"deepResearch":true}' \
            2>/dev/null | head -c 16000 || true
          echo

          echo '=== RECENT COUNCIL LOGS ==='
          pm2 logs caspa-server --lines 700 --nostream 2>&1 | grep -Ei 'council|ollama|quorum|retrieval|source collector|timeout|emergency' | tail -n 220 || true
          REMOTE
