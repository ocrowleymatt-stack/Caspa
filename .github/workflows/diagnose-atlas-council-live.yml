name: Diagnose Atlas Council Live

on:
  push:
    paths:
      - '.github/workflows/diagnose-atlas-council-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: Select SSH key
        shell: bash
        run: |
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Inspect OSINT research fast path
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'bash -s' <<'REMOTE'
          set -e
          docker exec -i atlas-openwebui python3 - <<'PY'
          import sqlite3
          con=sqlite3.connect('/app/backend/data/webui.db')
          row=con.execute("SELECT content FROM function WHERE id='atlas-council'").fetchone()
          code=str(row[0] or '')
          lines=code.splitlines()
          hits=[i for i,line in enumerate(lines) if 'if osint_active and profile == "research":' in line]
          if not hits: raise SystemExit('OSINT research fast path missing')
          start=max(0,hits[0]-8); end=min(len(lines),hits[0]+58)
          for i in range(start,end): print(f'{i+1:04d} {lines[i]}')
          con.close()
          PY
          REMOTE