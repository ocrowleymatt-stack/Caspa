name: Diagnose Atlas Council Live

on:
  push:
    paths:
      - '.github/workflows/diagnose-atlas-council-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: Select SSH key
        shell: bash
        run: |
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Inspect exact Council retrieval and exit paths
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'bash -s' <<'REMOTE'
          set -e
          docker exec -i atlas-openwebui python3 - <<'PY'
          import sqlite3
          con=sqlite3.connect('/app/backend/data/webui.db')
          row=con.execute("SELECT content FROM function WHERE id='atlas-council'").fetchone()
          if not row: raise SystemExit('atlas-council function missing')
          lines=str(row[0]).splitlines()
          for a,b,label in [
              (40,126,'VALVES / REGEX CONSTANTS'),
              (131,162,'QUESTION EXTRACTION / CASE'),
              (245,281,'KNOWLEDGE / GRAPH / WEB PACKETS'),
              (585,621,'BIGBROTHER / EVIDENCE PACKET'),
              (1420,1511,'PIPE TERMINAL PATHS'),
          ]:
              print(f'=== {label} lines {a}-{b} ===')
              for n in range(a-1,min(b,len(lines))):
                  text=lines[n]
                  if any(x in text.lower() for x in ('api_key =','secret =','password =','token =')):
                      text=text.split('=',1)[0]+'= <REDACTED>'
                  print(f'{n+1:04d} {text}')
          con.close()
          PY
          REMOTE
