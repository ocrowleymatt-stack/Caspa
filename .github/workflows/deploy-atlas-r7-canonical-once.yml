name: Deploy Atlas R7 canonical

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-atlas-r7-canonical-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas2-production-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
      OUTER_SHA256: 839965854bf8dac4e756a0331042684aaa373bc34b69543c3d01da4fe37d0129
      RELEASE_SHA256: 12b5ed9283578f1e4b45d340477ad9fe8f02ef436fdd6dbe61b99e10300977ba
      RELEASE_COMMIT: 76c05bb0377c958ba634a4d04e9394c93ceca683
      RELEASE_URL: 'https://sdmntprukwest.oaiusercontent.com/files/00000000-6a14-8243-b2b5-0071f9df6e67/raw?se=2026-09-25T19%3A00%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=e5af1fc1-4b8b-5fd9-9680-c4c6086a07d5&skoid=56822d8b-6cfd-42ed-a00d-1452dca42036&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T18%3A01%3A49Z&ske=2026-09-26T18%3A01%3A49Z&sks=b&skv=2026-02-06&sig=j9UbGxYnppawx0Pe9uAeK7sHE3FHZA4ugmQ5Kd9NXmc%3D'

    steps:
      - name: Download exact verified R7 release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 2 "$RELEASE_URL" -o /tmp/atlas-r7-wrapper.zip
          echo "$OUTER_SHA256  /tmp/atlas-r7-wrapper.zip" | sha256sum -c -
          rm -rf /tmp/atlas-r7-wrapper /tmp/atlas-release-src
          mkdir -p /tmp/atlas-r7-wrapper /tmp/atlas-release-src
          unzip -q /tmp/atlas-r7-wrapper.zip -d /tmp/atlas-r7-wrapper
          echo "$RELEASE_SHA256  /tmp/atlas-r7-wrapper/ATLAS_R7_25SEP2026.zip" | sha256sum -c -
          unzip -q /tmp/atlas-r7-wrapper/ATLAS_R7_25SEP2026.zip -d /tmp/atlas-release-src
          tar -C /tmp/atlas-release-src -czf /tmp/atlas-release.tar.gz .
          sha256sum /tmp/atlas-release.tar.gz | tee /tmp/atlas-release.tar.gz.sha256
          cp /tmp/atlas-release-src/tools/deployment/update-private-release.py /tmp/update-private-release.py

      - name: Select SSH key
        shell: bash
        run: |
          set -euo pipefail
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY DEPLOY_SSH_KEY SERVER_SSH_KEY; do
            if [ -n "${!name:-}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Upload and activate R7
        shell: bash
        run: |
          set -euo pipefail
          scp -o BatchMode=yes -i ~/.ssh/id_ed25519 /tmp/atlas-release.tar.gz /tmp/update-private-release.py "${ATLAS_USER}@${ATLAS_HOST}:/tmp/"
          archive_sha="$(awk '{print $1}' /tmp/atlas-release.tar.gz.sha256)"
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" \
            "python3 /tmp/update-private-release.py --archive /tmp/atlas-release.tar.gz --sha256 '$archive_sha' --commit '$RELEASE_COMMIT'"

      - name: Point atlas.ocrowley.com at R7
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" "
            set -euo pipefail
            cp /etc/nginx/conf.d/zzz-atlas-auth.conf /var/backups/zzz-atlas-auth.before-r7.$(date -u +%Y%m%dT%H%M%SZ).conf
            sed -i '0,/proxy_pass http:\/\/127\.0\.0\.1:8790;/s//proxy_pass http:\/\/127.0.0.1:3110;/' /etc/nginx/conf.d/zzz-atlas-auth.conf
            nginx -t
            systemctl reload nginx
          "

      - name: Verify canonical R7
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" "
            set -euo pipefail
            test \"\$(basename \"\$(readlink -f /opt/atlas-unified/current)\")\" = '$RELEASE_COMMIT'
            systemctl is-active --quiet atlas-unified.service
            grep -Rqs 'Create studio music' /opt/atlas-unified/current/apps/caspa/dist
            grep -Rqs 'deep research, evidence, writing, music, and product work' /opt/atlas-unified/current/apps/caspa/dist
            grep -q 'proxy_pass http://127.0.0.1:3110;' /etc/nginx/conf.d/zzz-atlas-auth.conf
          "
          status="$(curl -sS -o /dev/null -w '%{http_code}' https://atlas.ocrowley.com/)"
          test "$status" = 303
