name: Diagnose Atlas Router Network

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-atlas-post-v22-result.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: Select SSH key
        shell: bash
        run: |
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
      - name: Test bridge path and firewall
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== HOST HEALTH ==='
          curl -sS --max-time 3 http://172.19.0.1:3014/health || true
          echo
          echo '=== CONTAINER SOCKET/HTTP ==='
          docker exec -i atlas-openwebui python3 - <<'PY'
          import socket,urllib.request
          for host in ['172.19.0.1','172.28.0.1','172.30.0.1','192.168.0.1']:
              try:
                  s=socket.create_connection((host,3014),timeout=3); s.close(); print(host,'TCP_OK')
              except Exception as e:
                  print(host,'TCP_FAIL',type(e).__name__,str(e))
              try:
                  with urllib.request.urlopen(f'http://{host}:3014/health',timeout=3) as r:
                      print(host,'HTTP_OK',r.status,r.read(400).decode(errors='replace'))
              except Exception as e:
                  print(host,'HTTP_FAIL',type(e).__name__,str(e))
          PY
          echo '=== IPTABLES INPUT/DOCKER-USER ==='
          iptables -S INPUT 2>/dev/null || true
          iptables -S DOCKER-USER 2>/dev/null || true
          echo '=== NFT FILTER RELEVANT ==='
          nft list ruleset 2>/dev/null | grep -Ei -C 3 '3014|docker|br-74b93aa39fe1|172\.19' | head -n 300 || true
          echo '=== UFW ==='
          ufw status verbose 2>/dev/null || true
          REMOTE
