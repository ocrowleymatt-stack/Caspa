name: Diagnose Atlas Post-v2.2 Result

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-atlas-post-v22-result.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: Select SSH key
        shell: bash
        run: |
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect Atlas Auto live code
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'docker exec -i atlas-openwebui python3 -' <<'PY'
          import sqlite3
          con=sqlite3.connect('/app/backend/data/webui.db')
          code=con.execute("select content from function where id='atlas-auto'").fetchone()[0]
          lines=code.splitlines()
          print('LINES',len(lines))
          for i,line in enumerate(lines,1):
              if 1 <= i <= 190:
                  print(f'{i:03d}: {line}')
          PY
