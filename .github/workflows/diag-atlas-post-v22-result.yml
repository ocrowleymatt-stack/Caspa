name: Diagnose Atlas Router Network

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-atlas-post-v22-result.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: Select SSH key
        shell: bash
        run: |
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect host and container route to AtlasRouter
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== HOST LISTEN ==='
          ss -ltnp | grep ':3014' || true
          echo '=== HOST ADDRESSES ==='
          ip -4 addr show
          echo '=== OPENWEBUI NETWORKS ==='
          docker inspect atlas-openwebui --format '{{json .NetworkSettings.Networks}}'
          echo '=== CONTAINER ROUTE ==='
          docker exec atlas-openwebui sh -lc 'ip route 2>/dev/null || cat /proc/net/route'
          echo '=== CONTAINER RESOLV ==='
          docker exec atlas-openwebui sh -lc 'getent hosts host.docker.internal || true'
          echo '=== CANDIDATE HEALTH ==='
          docker exec atlas-openwebui python3 - <<'PY'
          import urllib.request, json, socket
          candidates=['172.19.0.1','172.18.0.1','172.20.0.1','172.21.0.1','172.17.0.1','host.docker.internal']
          for host in candidates:
              url=f'http://{host}:3014/health'
              try:
                  with urllib.request.urlopen(url,timeout=3) as r:
                      print(host,'OK',r.status,r.read(500).decode(errors='replace'))
              except Exception as e:
                  print(host,'FAIL',type(e).__name__,str(e))
          PY
          REMOTE
