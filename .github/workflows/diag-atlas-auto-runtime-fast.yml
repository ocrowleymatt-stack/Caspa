name: Diagnose Atlas Auto Runtime Fast

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-atlas-auto-runtime-fast.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: Select SSH key
        shell: bash
        run: |
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
      - name: Fast trace
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== OWUI REQUEST LOG HITS ==='
          docker logs atlas-openwebui --since '2026-08-12T19:24:00Z' --until '2026-08-12T19:32:00Z' 2>&1 | grep -Ei '648fb510|atlas-research|atlas-auto|web_search|gpt-5.6-terra|frontier|tool|search' | tail -n 500 || true
          echo '=== ROUTER RECENT LOGS ==='
          tail -n 500 /root/.pm2/logs/AtlasRouter-out.log 2>/dev/null | tail -n 500 || true
          tail -n 500 /root/.pm2/logs/AtlasRouter-error.log 2>/dev/null | tail -n 500 || true
          echo '=== CHAT COMPACT ==='
          docker exec -i atlas-openwebui python3 - <<'PY'
          import sqlite3,json
          con=sqlite3.connect('/app/backend/data/webui.db'); con.row_factory=sqlite3.Row
          cid='648fb510-63cd-4f88-819c-fb2d4a41b741'
          r=con.execute('select * from chat where id=?',(cid,)).fetchone()
          if not r:
              print('CHAT_NOT_FOUND')
          else:
              d=dict(r)
              print('columns',list(d.keys()))
              for k,v in d.items():
                  if k in ('chat','title','updated_at','created_at'):
                      s=str(v)
                      print(k,s[:32000])
          print('=== MODEL/FUNCTION ESSENTIALS ===')
          m=con.execute("select base_model_id,params,meta from model where id='atlas-research'").fetchone()
          print('atlas-research',json.dumps(dict(m),ensure_ascii=False) if m else 'missing')
          for fid in ('atlas-auto','atlas-frontier-failover'):
              f=con.execute('select content from function where id=?',(fid,)).fetchone()
              if f:
                  print('##',fid)
                  for i,line in enumerate(str(f[0]).splitlines(),1):
                      if any(x in line for x in ('generate_chat_completion','forwarded["model"]','features','web_search','provider_web','useWebSearch','bypass_filter','bypass_system_prompt')):
                          print(i,line[:800])
          PY
          REMOTE
