name: Fix Production Smoke Bugs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-production-smoke-bugs.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact smoke fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/components/LegalCasesDashboard.tsx')
          s = p.read_text()
          old = "                  ':hover': { boxShadow: '0 4px 12px rgba(0,0,0,0.1)' },\n"
          if old not in s:
              raise SystemExit('Legal hover bug marker not found')
          p.write_text(s.replace(old, '', 1))

          p = Path('src/components/_orphans/Dashboard.music-sketch.tsx')
          s = p.read_text()
          old = "from '../types';"
          if old not in s:
              raise SystemExit('Orphan import bug marker not found')
          p.write_text(s.replace(old, "from '../../types';", 1))

          p = Path('scripts/atlas-nginx-timeouts.sh')
          s = p.read_text()
          s = s.replace(
              "    /etc/nginx/conf.d/caspa.ocrowley.com.conf \\\n    /etc/nginx/conf.d/caspa.conf; do",
              "    /etc/nginx/conf.d/caspa.ocrowley.com.conf \\\n    /etc/nginx/conf.d/caspa.conf \\\n    /etc/nginx/conf.d/auth-gateway.conf; do",
              1,
          )
          s = s.replace(
              "  SITE=$(grep -RIl --include='*.conf' --include='*caspa*' 'server_name[[:space:]].*caspa\\.ocrowley\\.com' /etc/nginx 2>/dev/null | head -n 1 || true)",
              "  SITE=$(grep -RIl --include='*.conf' 'server_name[[:space:]].*caspa\\.ocrowley\\.com' /etc/nginx 2>/dev/null | grep -v 'pre-caspa-timeout' | head -n 1 || true)",
              1,
          )
          p.write_text(s)
          PY

      - name: Install and verify
        run: |
          npm ci
          npm run lint
          npm test

      - name: Commit verified fixes and deploy trigger
        shell: bash
        run: |
          set -euo pipefail
          printf 'deploy requested %s\nreason: verified production smoke bug fixes (TypeScript + nginx target selection)\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .deploy-atlas-trigger
          git config user.name 'Caspa Production Fixer'
          git config user.email 'actions@users.noreply.github.com'
          git add src/components/LegalCasesDashboard.tsx src/components/_orphans/Dashboard.music-sketch.tsx scripts/atlas-nginx-timeouts.sh .deploy-atlas-trigger
          git commit -m 'Fix production smoke bugs and redeploy'
          git push origin HEAD:main
