name: Consolidate Publication Studio

on:
  push:
    branches: [main]
    paths:
      - 'scripts/consolidate-publication-studio.mjs'
      - '.github/workflows/consolidate-publication-studio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply central Publication Studio UI patch
        run: node scripts/consolidate-publication-studio.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit consolidated UI and request deploy
        shell: bash
        run: |
          set -euo pipefail
          printf 'deploy requested %s\nreason: consolidate long-form work into Publication Studio\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .deploy-atlas-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/CaspaRedesign.tsx .deploy-atlas-trigger
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Consolidate long-form controls into Publication Studio'
          git push origin HEAD:main
