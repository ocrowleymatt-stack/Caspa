name: Repair Atlas Minimal Intervention

on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair-atlas-minimal-intervention.py'
      - '.github/workflows/repair-atlas-minimal-intervention.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - uses: actions/checkout@v4
      - name: Select SSH key
        shell: bash
        run: |
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
      - name: Install minimal-intervention policy
        shell: bash
        run: |
          scp -i ~/.ssh/id_ed25519 scripts/repair-atlas-minimal-intervention.py "${ATLAS_USER}@${ATLAS_HOST}:/tmp/repair-atlas-minimal-intervention.py"
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          docker cp /tmp/repair-atlas-minimal-intervention.py atlas-openwebui:/tmp/repair-atlas-minimal-intervention.py
          docker exec atlas-openwebui python3 /tmp/repair-atlas-minimal-intervention.py
          docker restart atlas-openwebui >/dev/null
          for i in $(seq 1 40); do
            if curl -fsS --max-time 3 http://127.0.0.1:3002/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS --max-time 5 http://127.0.0.1:3002/health
          docker exec -i atlas-openwebui python3 - <<'PY'
          import sqlite3
          con=sqlite3.connect('/app/backend/data/webui.db')
          for fid in ('atlas-public-source-research','atlas-deep-research-v21'):
              row=con.execute('select content,is_active from function where id=?',(fid,)).fetchone()
              assert row and int(row[1]) == 1
              code=str(row[0] or '')
              assert 'ATLAS MINIMAL INTERVENTION v1' in code
          print('atlas_minimal_intervention_verified=true')
          PY
          rm -f /tmp/repair-atlas-minimal-intervention.py
          REMOTE
