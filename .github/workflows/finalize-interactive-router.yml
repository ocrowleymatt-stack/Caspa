name: Finalize Interactive Router

on:
  push:
    paths:
      - '.github/workflows/finalize-interactive-router.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final routing cutoffs
        run: python scripts/finalize-interactive-router.py
      - name: Validate production build
        run: |
          npm ci
          npm run build
          git diff --check
      - name: Commit final routing
        run: |
          git config user.name atlas-router-finalizer
          git config user.email actions@users.noreply.github.com
          git add src/services/cloudModelRouter.ts src/services/ai.ts
          git commit -m "Keep slow local models off interactive Atlas paths"
          git pull --rebase origin main
          git push
