name: Force Atlas hostname cutover

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/force-atlas-host-cutover.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          key="${PRIVATEKEY2:-${HETZNER_SSH_KEY:-}}"
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Cut over old hostname structurally
        shell: bash
        run: |
          set -euo pipefail
          cat <<'PY' | ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" python3 -
          from pathlib import Path
          import re, shutil, datetime
          p=Path('/etc/nginx/conf.d/zzz-atlas-auth.conf')
          s=p.read_text()
          marker='server_name atlas.ocrowley.com;'
          pos=s.find(marker)
          if pos<0:
              raise SystemExit('atlas.ocrowley.com server block not found')
          start=s.rfind('server {',0,pos)
          if start<0:
              raise SystemExit('enclosing server block not found')
          depth=0
          end=None
          for i in range(start,len(s)):
              if s[i]=='{':
                  depth+=1
              elif s[i]=='}':
                  depth-=1
                  if depth==0:
                      end=i+1
                      break
          if end is None:
              raise SystemExit('unbalanced server block')
          block=s[start:end]
          if 'return 302 https://atlas2.ocrowley.com$request_uri;' in block:
              print('already_cut_over=true')
              raise SystemExit(0)
          loc=re.search(r'(?ms)^\s*location\s+/\s*\{.*?^\s*\}',block)
          if not loc:
              raise SystemExit('catch-all location / not found')
          backup=Path('/var/backups')/f"zzz-atlas-auth.before-cutover-{datetime.datetime.utcnow().strftime('%Y%m%dT%H%M%SZ')}.conf"
          shutil.copy2(p,backup)
          replacement='''    location / {
                  return 302 https://atlas2.ocrowley.com$request_uri;
              }'''
          newblock=block[:loc.start()]+replacement+block[loc.end():]
          p.write_text(s[:start]+newblock+s[end:])
          print(f'backup={backup}')
          print('patched=true')
          PY
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'nginx -t && systemctl reload nginx'

      - name: Verify public redirect
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -I https://atlas.ocrowley.com/ | tee /tmp/public.headers
          grep -Eqi '^HTTP/.* 30[12378]' /tmp/public.headers
          grep -Eqi '^location: https://atlas2\.ocrowley\.com/' /tmp/public.headers
