name: Vendor Atlas Router Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-atlas-router-source.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Create self-contained Atlas router source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p atlas-router/src
          cp src/services/cloudModelRouter.ts atlas-router/src/cloudModelRouter.ts
          cp src/services/aiRouterPolicy.ts atlas-router/src/aiRouterPolicy.ts
          cat > atlas-router/src/router.ts <<'TS'
          import {
            callCloudProvider,
            classifyTask,
            isBillingFailure,
            normaliseMode,
            providerOrder,
            type CloudProvider,
            type IntelligenceMode,
            type RoutedCallOptions,
            type TaskKind,
          } from './cloudModelRouter';
          import {
            isProviderConfigured,
            selectAttemptOrder,
            sharedCircuitBreaker,
          } from './aiRouterPolicy';

          export type AtlasProvider = CloudProvider;

          export interface RouterFailoverAttempt {
            provider: string;
            error: string;
            billingFailure: boolean;
            skipped?: boolean;
          }

          export interface RouterFailoverResult {
            text: string;
            model: string;
            provider: AtlasProvider;
            attempts: RouterFailoverAttempt[];
          }

          export interface RouterFailoverOptions extends RoutedCallOptions {
            primaryProvider?: string;
            sensitive?: boolean;
            strictProvider?: boolean;
          }

          const BILLING_COOLDOWN_MS = Number(process.env.AI_BILLING_COOLDOWN_MS) || 15 * 60_000;
          const TRANSIENT_COOLDOWN_MS = Number(process.env.AI_PROVIDER_COOLDOWN_MS) || 60_000;

          export const WEB_SEARCH_CAPABLE_PROVIDERS = ['venice', 'gemini', 'grok'] as const;
          const WEB_SEARCH_CAPABLE_PROVIDER_SET = new Set<string>(WEB_SEARCH_CAPABLE_PROVIDERS);

          export function providerSupportsWebSearch(provider: string): boolean {
            return WEB_SEARCH_CAPABLE_PROVIDER_SET.has(String(provider || '').toLowerCase());
          }

          /** Atlas-owned cloud failover. Local fail-soft belongs to OpenWebUI. */
          export async function routeAtlasPrompt(
            prompt: string,
            opts: RouterFailoverOptions = {},
          ): Promise<RouterFailoverResult> {
            const mode: IntelligenceMode = normaliseMode(opts.mode);
            const task: TaskKind = opts.task || classifyTask(prompt, opts);
            const primary = String(opts.primaryProvider || '').trim();
            const unfilteredPreferred = opts.strictProvider && primary
              ? [primary]
              : providerOrder(primary, mode, task, Boolean(opts.sensitive));
            const attempts: RouterFailoverAttempt[] = [];
            const webRequired = Boolean(opts.useSearch);

            if (webRequired && opts.strictProvider && primary && !providerSupportsWebSearch(primary)) {
              throw new Error(`Atlas web retrieval unavailable — strict provider "${primary}" has no wired web-search capability.`);
            }

            const preferred = webRequired
              ? unfilteredPreferred.filter((provider) => providerSupportsWebSearch(provider))
              : unfilteredPreferred;

            if (webRequired) {
              for (const provider of unfilteredPreferred) {
                if (!providerSupportsWebSearch(provider)) {
                  attempts.push({ provider, error: 'Skipped: provider has no wired Atlas web-search tool', billingFailure: false, skipped: true });
                }
              }
            }

            const { attempt: ordered, anyConfigured } = selectAttemptOrder(
              preferred,
              (provider) => isProviderConfigured(provider),
              (provider) => sharedCircuitBreaker.isOpen(provider),
            );

            if (!anyConfigured) {
              for (const provider of preferred) {
                attempts.push({ provider, error: webRequired ? 'Search-capable provider not configured' : 'Provider not configured', billingFailure: false, skipped: true });
              }
            }

            for (const providerName of ordered) {
              const provider = providerName as CloudProvider;
              try {
                const result = await callCloudProvider(provider, prompt, { ...opts, mode, task });
                sharedCircuitBreaker.recordSuccess(provider);
                return { ...result, attempts };
              } catch (error: any) {
                const message = String(error?.message || error || 'Unknown provider failure');
                const billingFailure = isBillingFailure(error);
                sharedCircuitBreaker.recordFailure(provider, billingFailure ? BILLING_COOLDOWN_MS : TRANSIENT_COOLDOWN_MS);
                attempts.push({ provider, error: message, billingFailure });
              }
            }

            const summary = attempts.map((attempt) => `${attempt.provider}${attempt.skipped ? ' skipped' : ''}: ${attempt.error.slice(0, 180)}`).join(' | ');
            const prefix = webRequired ? 'Atlas web retrieval unavailable' : 'Atlas model pool exhausted';
            throw new Error(`${prefix}${summary ? ` — ${summary}` : ''}`);
          }

          export { classifyTask, normaliseMode } from './cloudModelRouter';
          TS

          python3 - <<'PY'
          from pathlib import Path
          p=Path('atlas-router/server.ts')
          s=p.read_text()
          s=s.replace("import { routeAtlasPrompt } from '../src/services/routerFallbackBridge';\nimport { classifyTask, normaliseMode } from '../src/services/cloudModelRouter';", "import { routeAtlasPrompt, classifyTask, normaliseMode } from './src/router';")
          s=s.replace("      disableLocalFallback: true,\n", "")
          p.write_text(s)
          PY

          cat > atlas-router/package.json <<'JSON'
          {
            "name": "atlas-router",
            "version": "1.0.0",
            "private": true,
            "type": "module",
            "scripts": {
              "build": "esbuild server.ts --bundle --platform=node --target=node22 --format=cjs --sourcemap --outfile=dist/atlas-router.cjs",
              "check": "npm run build && node --check dist/atlas-router.cjs"
            },
            "dependencies": { "@google/genai": "^1.50.1" },
            "devDependencies": {
              "@types/node": "^22.14.0",
              "esbuild": "^0.28.0",
              "typescript": "~5.8.2"
            }
          }
          JSON

          cat > atlas-router/README.md <<'MD'
          # Atlas Router

          Atlas-owned cloud model routing service. It is intentionally independent of the Caspa application runtime.

          ## Runtime boundary

          - Service identity: `AtlasRouter`
          - Internal bind: `172.19.0.1:3014`
          - Consumer: `atlas-openwebui`
          - Public exposure: none required
          - Local model fallback: owned by OpenWebUI, not this service
          - Caspa runtime dependency: none

          ## Source boundary

          Everything required to build the router is contained under `atlas-router/`. The directory can be moved to a standalone Atlas repository without importing Caspa application source.

          Provider credentials live on the host in `/root/.atlas-secrets/atlas-router.env`; never commit them.
          MD

          # Executable router source must not import or call outside Atlas Router.
          if grep -RInE "from ['\"]\.\./|/root/Caspa|caspa\.ocrowley\.com" atlas-router/server.ts atlas-router/src --include='*.ts' --include='*.js'; then
            echo 'Executable Atlas router still contains a Caspa/source-tree dependency.' >&2
            exit 1
          fi

      - name: Build using only Atlas router package
        shell: bash
        run: |
          set -euo pipefail
          cd atlas-router
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm run check
          test -s dist/atlas-router.cjs
      - name: Commit self-contained Atlas router
        shell: bash
        run: |
          set -euo pipefail
          git config user.name atlas-automation
          git config user.email atlas-automation@users.noreply.github.com
          git add atlas-router
          if git diff --cached --quiet; then
            echo 'Atlas router already self-contained.'
            exit 0
          fi
          git commit -m 'Make Atlas router source independent of Caspa'
          git pull --rebase origin main
          git push origin HEAD:main
