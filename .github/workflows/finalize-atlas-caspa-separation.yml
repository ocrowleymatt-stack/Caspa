name: Finalize Atlas Caspa Separation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-atlas-caspa-separation.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Point persistent Atlas repair script only to Atlas Router
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/repair-atlas-frontier-multiprovider.py')
          s=p.read_text()
          s=s.replace('https://caspa.ocrowley.com/api/ai/call','http://172.19.0.1:3014/api/ai/call')
          s=s.replace("multi-provider bridge to Caspa's canonical router.", "multi-provider bridge to Atlas's internal canonical router.")
          p.write_text(s)
          PY
          ! grep -F 'https://caspa.ocrowley.com/api/ai/call' scripts/repair-atlas-frontier-multiprovider.py
          grep -F 'http://172.19.0.1:3014/api/ai/call' scripts/repair-atlas-frontier-multiprovider.py
      - name: Commit script cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name atlas-automation
          git config user.email atlas-automation@users.noreply.github.com
          git add scripts/repair-atlas-frontier-multiprovider.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Keep Atlas frontier repair script independent of Caspa'
          git pull --rebase origin main
          git push origin HEAD:main
