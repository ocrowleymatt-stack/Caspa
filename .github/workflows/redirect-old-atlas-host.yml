name: Switch old Atlas host to new Atlas service

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/redirect-old-atlas-host.yml'

permissions:
  contents: read

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: SSH setup
        shell: bash
        run: |
          set -euo pipefail
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY; do
            if [ -n "${!name:-}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Proxy atlas.ocrowley.com to new Atlas service
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/atlas-cutover.py <<'PY'
          from pathlib import Path
          p = Path("/etc/nginx/conf.d/zzz-atlas-auth.conf")
          s = p.read_text()
          old_proxy = """    location / {
              proxy_pass http://127.0.0.1:8790;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_redirect off;
          }"""
          old_redirect = """    location / {
              return 302 https://atlas2.ocrowley.com$request_uri;
          }"""
          new = """    location / {
              proxy_pass http://127.0.0.1:3110;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto https;
              proxy_set_header Connection "";
              proxy_read_timeout 300s;
              proxy_send_timeout 300s;
              proxy_redirect off;
          }"""
          if new in s:
              print("direct proxy already present")
          elif old_redirect in s:
              p.write_text(s.replace(old_redirect, new, 1))
              print("replaced cross-origin redirect with direct proxy")
          elif old_proxy in s:
              p.write_text(s.replace(old_proxy, new, 1))
              print("replaced old Next.js proxy with new Atlas proxy")
          else:
              raise SystemExit("expected atlas.ocrowley.com location block not found")
          PY
          scp -o BatchMode=yes -i ~/.ssh/id_ed25519 /tmp/atlas-cutover.py "${ATLAS_USER}@${ATLAS_HOST}:/tmp/atlas-cutover.py"
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" \
            'cp /etc/nginx/conf.d/zzz-atlas-auth.conf /var/backups/zzz-atlas-auth.before-direct-atlas.bak && python3 /tmp/atlas-cutover.py && nginx -t && systemctl reload nginx'

      - name: Verify public hostname
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl -sSI https://atlas.ocrowley.com/)"
          printf '%s\n' "$headers"
          if printf '%s\n' "$headers" | grep -qi 'x-nextjs-cache'; then
            echo "Old Next.js app is still active" >&2
            exit 1
          fi
          if printf '%s\n' "$headers" | grep -qi '^location: https://atlas2.ocrowley.com'; then
            echo "Cross-origin redirect is still active" >&2
            exit 1
          fi
          printf '%s\n' "$headers" | grep -qiE '^HTTP/.* (200|303)'
          curl -sS https://atlas.ocrowley.com/__atlas/login | grep -q 'Sign in to private Atlas'
