name: Apply Atlas hostname cutover now

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-atlas-host-cutover-now.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          key="${PRIVATEKEY2:-${HETZNER_SSH_KEY:-}}"
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Cut old Atlas hostname over
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/cutover.py <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          p = Path('/etc/nginx/conf.d/zzz-atlas-auth.conf')
          s = p.read_text()
          old = """    location / {
                  proxy_pass http://127.0.0.1:8790;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_redirect off;
              }"""
          new = """    location / {
                  return 302 https://atlas2.ocrowley.com$request_uri;
              }"""
          backup = Path('/var/backups') / ('zzz-atlas-auth.conf.before-' + datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ'))
          backup.write_text(s)
          if old in s:
              p.write_text(s.replace(old, new, 1))
          elif 'return 302 https://atlas2.ocrowley.com$request_uri;' not in s:
              raise SystemExit('Expected atlas.ocrowley.com root proxy block was not found')
          print(f'backup={backup}')
          PY
          scp -o BatchMode=yes -i ~/.ssh/id_ed25519 /tmp/cutover.py "${ATLAS_USER}@${ATLAS_HOST}:/tmp/cutover-atlas-host.py"
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" "python3 /tmp/cutover-atlas-host.py && nginx -t && systemctl reload nginx"

      - name: Verify exact public hostname
        shell: bash
        run: |
          set -euo pipefail
          sleep 1
          curl -sS -D /tmp/headers -o /dev/null https://atlas.ocrowley.com/
          cat /tmp/headers
          grep -qi '^HTTP/.* 302' /tmp/headers
          grep -qi '^location: https://atlas2.ocrowley.com/' /tmp/headers
          curl -sS -D /tmp/newheaders -o /dev/null https://atlas2.ocrowley.com/
          cat /tmp/newheaders
