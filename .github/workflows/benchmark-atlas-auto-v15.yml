name: Benchmark Atlas Auto v1.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/benchmark-atlas-auto-v15.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: Select SSH key
        shell: bash
        run: |
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
      - name: Benchmark Gemini against exact Auto research contract
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'docker exec -i atlas-openwebui python3 -' <<'PY'
          import asyncio, json, sqlite3, sys, types, urllib.request

          users_mod=types.ModuleType('open_webui.models.users')
          class DummyUsers:
              @staticmethod
              async def get_user_by_id(_): return object()
          users_mod.Users=DummyUsers
          chat_mod=types.ModuleType('open_webui.utils.chat')
          async def unused_generate_chat_completion(*args,**kwargs):
              raise AssertionError('provider benchmark unexpectedly recursed')
          chat_mod.generate_chat_completion=unused_generate_chat_completion
          sys.modules['open_webui.models.users']=users_mod
          sys.modules['open_webui.utils.chat']=chat_mod

          con=sqlite3.connect('/app/backend/data/webui.db')
          code=con.execute("select content from function where id='atlas-auto'").fetchone()[0]
          assert 'ATLAS AUTO PERFORMANCE HARDENING v1.5' in code
          ns={}; exec(compile(code,'<live-atlas-auto-v15>','exec'),ns)
          p=ns['Pipe']()
          user_prompt='osint search and create a background story with current info for stuart a Hardman previously of Nottingham, previous partner of Scott millard and now living in walsall with Adam Walsh'
          body={'messages':[{'role':'user','content':user_prompt}]}
          router_prompt=p._router_prompt(body)

          payload=json.dumps({
              'prompt':router_prompt,
              'providerOverride':'gemini',
              'strictProvider':True,
              'useWebSearch':True,
              'useXSearch':False,
              'intelligenceMode':'speed',
              'maxTokens':3600,
              'taskHint':'factual',
          }).encode()
          req=urllib.request.Request('http://172.19.0.1:3014/api/ai/call',data=payload,headers={'Content-Type':'application/json'})
          try:
              with urllib.request.urlopen(req,timeout=100) as r:
                  d=json.load(r)
          except urllib.error.HTTPError as e:
              raw=e.read().decode(errors='replace')
              print('GEMINI_HTTP_ERROR',e.code,raw[:6000])
              raise
          text=str(d.get('result') or '')
          low=text.lower()
          print('provider=',d.get('provider'))
          print('model=',d.get('model'))
          print('requestDurationMs=',d.get('requestDurationMs'))
          print('providerDurationMs=',d.get('providerDurationMs'))
          print('result_chars=',len(text))
          print('attempts=',json.dumps(d.get('attempts'),ensure_ascii=False))
          print('RESULT_PREVIEW',text[:6500].replace('\n',' '))
          assert d.get('provider') == 'gemini', d
          assert len(text) > 800, text
          assert 'cannot access the internet' not in low
          assert "can't access the internet" not in low
          print('gemini_strict_research_benchmark_pass=true')
          PY
