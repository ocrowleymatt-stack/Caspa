name: Benchmark Atlas Auto v1.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/benchmark-atlas-auto-v15.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: Select SSH key
        shell: bash
        run: |
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
      - name: Benchmark exact live Auto research path
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'docker exec -i atlas-openwebui python3 -' <<'PY'
          import asyncio, sqlite3, sys, types, time

          users_mod=types.ModuleType('open_webui.models.users')
          class DummyUsers:
              @staticmethod
              async def get_user_by_id(_):
                  return object()
          users_mod.Users=DummyUsers
          chat_mod=types.ModuleType('open_webui.utils.chat')
          async def unused_generate_chat_completion(*args,**kwargs):
              raise AssertionError('benchmark web path unexpectedly recursed into generate_chat_completion')
          chat_mod.generate_chat_completion=unused_generate_chat_completion
          sys.modules['open_webui.models.users']=users_mod
          sys.modules['open_webui.utils.chat']=chat_mod

          con=sqlite3.connect('/app/backend/data/webui.db')
          row=con.execute("select content,is_active from function where id='atlas-auto'").fetchone()
          assert row and int(row[1]) == 1
          code=row[0]
          assert 'ATLAS AUTO PERFORMANCE HARDENING v1.5' in code
          assert 'WEB_MAX_TOKENS: int = Field(default=3600' in code
          assert 'WEB_CONTEXT_CHARS: int = Field(default=32000' in code
          ns={}
          exec(compile(code,'<live-atlas-auto-v15>','exec'),ns)
          Pipe=ns['Pipe']
          statuses=[]
          async def emitter(evt): statuses.append(evt)
          prompt='osint search and create a background story with current info for stuart a Hardman previously of Nottingham, previous partner of Scott millard and now living in walsall with Adam Walsh'
          body={'model':'atlas-auto','messages':[{'role':'user','content':prompt}]}

          async def main():
              p=Pipe()
              started=time.monotonic()
              result=await p.pipe(body,{'id':'benchmark-user'},None,emitter)
              elapsed=time.monotonic()-started
              text=str(result or '')
              low=text.lower()
              print(f'elapsed_seconds={elapsed:.3f}')
              print('result_chars=',len(text))
              print('status_count=',len(statuses))
              for s in statuses: print('STATUS',s)
              print('RESULT_PREVIEW',text[:6000].replace('\n',' '))
              assert len(text)>800, text
              assert ('http://' in text or 'https://' in text or 'source' in low or '[[' in text), text[:2000]
              assert 'cannot access the internet' not in low
              assert "can't access the internet" not in low
              assert 'i should use tools' not in low
              assert 'i should search' not in low
              assert any('live research complete' in str(s).lower() for s in statuses), statuses
              print('atlas_auto_v15_benchmark_pass=true')
          asyncio.run(main())
          PY
