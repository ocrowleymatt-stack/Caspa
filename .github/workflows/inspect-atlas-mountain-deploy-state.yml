name: Inspect Atlas Mountain deployment state

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/inspect-atlas-mountain-deploy-state.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ATLAS_HOST: 116.202.24.63
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
    steps:
      - name: Inspect live state
        shell: bash
        run: |
          set -euo pipefail
          key=''
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY DEPLOY_SSH_KEY SERVER_SSH_KEY; do
            if [ -n "${!name:-}" ]; then key="${!name}"; echo "identity=$name"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 root@"$ATLAS_HOST" 'bash -s' <<'REMOTE'
          set -u
          current=''
          [ -L /opt/atlas-mountain/current ] && current="$(basename "$(readlink -f /opt/atlas-mountain/current)")"
          echo "current_release=$current"
          echo "receiver_state=$(systemctl is-active atlas-mountain-deploy-receiver.service 2>/dev/null || true)"
          echo "nexus_state=$(systemctl is-active atlas-mountain-nexus.service 2>/dev/null || true)"
          echo "receiver_port=$(ss -ltn 2>/dev/null | grep -c ':3016 ' || true)"
          echo "nexus_port=$(ss -ltn 2>/dev/null | grep -c ':43101 ' || true)"
          echo 'release_dirs:'
          find /opt/atlas-mountain/releases -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | tail -n 10 || true
          echo 'receiver_journal:'
          journalctl -u atlas-mountain-deploy-receiver.service -n 35 --no-pager -o cat 2>&1 || true
          echo 'nexus_journal:'
          journalctl -u atlas-mountain-nexus.service -n 35 --no-pager -o cat 2>&1 || true
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
