name: Recover Active Publication

on:
  push:
    branches: [main]
    paths:
      - '.recover-active-publication-trigger'

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      HOST: 116.202.24.63
      USER: root
    steps:
      - name: Select SSH key
        shell: bash
        run: |
          set -euo pipefail
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY DEPLOY_SSH_KEY SERVER_SSH_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$HOST" >> ~/.ssh/known_hosts

      - name: Recover latest interrupted commission
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          BASE=http://127.0.0.1:3000/api/caspa/gold
          curl -fsS http://127.0.0.1:3000/health >/dev/null
          curl -fsS "$BASE/jobs" > /tmp/caspa-jobs-live.json
          python3 - <<'PY' >/tmp/candidate.env
          import json, shlex
          d=json.load(open('/tmp/caspa-jobs-live.json'))
          jobs=(d.get('data') or {}).get('jobs') or []
          commissions=[j for j in jobs if j.get('type')=='commission']
          def ts(j): return str(j.get('updatedAt') or j.get('createdAt') or '')
          active=[j for j in commissions if j.get('status') in ('running','queued') and j.get('input')]
          failed=[j for j in commissions if j.get('status')=='failed' and j.get('input')]
          candidate=max(active,key=ts) if active else (max(failed,key=ts) if failed else None)
          vals={
              'JOB_ID': '' if not candidate else str(candidate.get('id') or ''),
              'JOB_STATUS': '' if not candidate else str(candidate.get('status') or ''),
              'JOB_STAGE': '' if not candidate else str(candidate.get('stage') or ''),
              'JOB_TITLE': '' if not candidate else str((((candidate.get('input') or {}).get('brief') or {}).get('title') or '')).replace('\n',' '),
          }
          for k,v in vals.items(): print(f'{k}={shlex.quote(v)}')
          PY
          cat /tmp/candidate.env
          . /tmp/candidate.env
          if [ -z "${JOB_ID:-}" ]; then
            echo 'No resumable Commission job found.'
            exit 3
          fi
          echo "RECOVERING_JOB=$JOB_ID"
          echo "TITLE=${JOB_TITLE:-unknown}"
          echo "PRE_STATUS=${JOB_STATUS:-unknown}"
          echo "PRE_STAGE=${JOB_STAGE:-unknown}"

          if [ "${JOB_STATUS:-}" = "failed" ]; then
            curl -fsS -X POST "$BASE/jobs/$JOB_ID/retry" | python3 -m json.tool
          fi

          retries=0
          last=''
          for n in $(seq 1 720); do
            curl -fsS "$BASE/jobs/$JOB_ID" >/tmp/job.json
            eval "$(python3 - <<'PY'
          import json, shlex
          j=json.load(open('/tmp/job.json'))['data']
          vals={
            'status':j.get('status',''),
            'stage':j.get('stage',''),
            'progress':j.get('progress',''),
            'words':(j.get('result') or {}).get('words',''),
            'error':j.get('error') or '',
          }
          for k,v in vals.items(): print(f'{k}={shlex.quote(str(v))}')
          PY
            )"
            now="$status|$stage|$progress|$words|$error"
            if [ "$now" != "$last" ]; then
              echo "STATUS=$status STAGE=$stage PROGRESS=$progress WORDS=$words ERROR=$error"
              last="$now"
            fi
            if [ "$status" = "complete" ]; then
              mkdir -p /root/Caspa/exports/recovered
              JOB_TITLE="$JOB_TITLE" python3 - <<'PY'
          import json, pathlib, re, os
          j=json.load(open('/tmp/job.json'))['data']
          result=j.get('result') or {}
          title=os.environ.get('JOB_TITLE') or 'Recovered Publication'
          safe=re.sub(r'[^A-Za-z0-9._-]+','_',title).strip('_') or 'Recovered_Publication'
          out=pathlib.Path('/root/Caspa/exports/recovered')/(safe+'_'+j['id']+'.md')
          out.write_text(result.get('artefact') or result.get('finalText') or '',encoding='utf-8')
          print('FINAL_JOB_ID='+j['id'])
          print('FINAL_WORDS='+str(result.get('words') or ''))
          print('FINAL_STAGE='+str(j.get('stage') or ''))
          print('EXPORT='+str(out))
          PY
              exit 0
            fi
            if [ "$status" = "failed" ]; then
              if [ "$retries" -lt 1 ]; then
                retries=$((retries+1))
                echo 'Job failed after recovery; issuing one bounded retry from retained checkpoint.'
                curl -fsS -X POST "$BASE/jobs/$JOB_ID/retry" | python3 -m json.tool
              else
                echo "Recovery exhausted: $error" >&2
                exit 4
              fi
            fi
            sleep 15
          done
          echo 'Timed out waiting for publication completion.' >&2
          exit 5
          REMOTE
