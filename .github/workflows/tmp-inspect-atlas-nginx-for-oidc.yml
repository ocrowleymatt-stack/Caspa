name: Inspect Atlas Ingress For OIDC Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-inspect-atlas-nginx-for-oidc.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      ATLAS_HOST: 116.202.24.63
    steps:
      - name: Inspect live ingress and runtime
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATEKEY2"
          mkdir -p ~/.ssh
          printf '%s\n' "$PRIVATEKEY2" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 root@"$ATLAS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== NODE ==='
          node --version
          echo '=== NGINX VERSION ==='
          nginx -v 2>&1
          echo '=== ATLAS NGINX FILES ==='
          grep -RIl 'atlas\.ocrowley\.com' /etc/nginx 2>/dev/null | sort || true
          echo '=== ATLAS SERVER BLOCK ==='
          nginx -T 2>/dev/null | awk '
            /server_name[[:space:]]+atlas\.ocrowley\.com/ {show=1; depth=0}
            show {print; for(i=1;i<=length($0);i++){c=substr($0,i,1); if(c=="{")depth++; else if(c=="}")depth--}; if(depth<0 || (depth==0 && $0 ~ /}/)){exit}}
          ' | head -n 180
          echo '=== LISTENERS ==='
          ss -lntp | grep -E ':(80|443|3002|3014|3015)\b' || true
          echo '=== PM2 ATLAS ==='
          pm2 jlist | python3 -c 'import json,sys; a=json.load(sys.stdin); print([(x.get("name"),(x.get("pm2_env") or {}).get("status"),(x.get("pm2_env") or {}).get("pm_exec_path")) for x in a if "atlas" in str(x.get("name","")).lower()])'
          REMOTE
