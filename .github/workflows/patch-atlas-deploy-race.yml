name: Patch AtlasRouter Deploy Race

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-atlas-deploy-race.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove shared tmp staging from AtlasRouter deploy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/deploy-atlas-router.yml')
          s=p.read_text()
          old='''          scp -i ~/.ssh/id_ed25519 atlas-router/dist/atlas-router.cjs "${ATLAS_USER}@${ATLAS_HOST}:/tmp/atlas-router.cjs"\n          scp -i ~/.ssh/id_ed25519 atlas-router/rewire-openwebui.py "${ATLAS_USER}@${ATLAS_HOST}:/tmp/rewire-openwebui.py"\n'''
          new='''          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'install -d -m 755 /root/AtlasRouter'\n          scp -i ~/.ssh/id_ed25519 atlas-router/dist/atlas-router.cjs "${ATLAS_USER}@${ATLAS_HOST}:/root/AtlasRouter/atlas-router.cjs"\n          scp -i ~/.ssh/id_ed25519 atlas-router/rewire-openwebui.py "${ATLAS_USER}@${ATLAS_HOST}:/root/AtlasRouter/rewire-openwebui.py"\n'''
          if old not in s: raise SystemExit('scp staging anchor missing')
          s=s.replace(old,new,1)
          old2='''          install -d -m 755 /root/AtlasRouter\n          install -d -m 700 /root/.atlas-secrets\n          install -m 644 /tmp/atlas-router.cjs /root/AtlasRouter/atlas-router.cjs\n'''
          new2='''          install -d -m 755 /root/AtlasRouter\n          install -d -m 700 /root/.atlas-secrets\n          chmod 644 /root/AtlasRouter/atlas-router.cjs /root/AtlasRouter/rewire-openwebui.py\n'''
          if old2 not in s: raise SystemExit('install staging anchor missing')
          s=s.replace(old2,new2,1)
          if 'docker cp /tmp/rewire-openwebui.py atlas-openwebui:/tmp/rewire-openwebui.py' not in s:
              raise SystemExit('rewire docker cp anchor missing')
          s=s.replace('docker cp /tmp/rewire-openwebui.py atlas-openwebui:/tmp/rewire-openwebui.py', 'docker cp /root/AtlasRouter/rewire-openwebui.py atlas-openwebui:/tmp/rewire-openwebui.py', 1)
          s=s.replace('rm -f /tmp/atlas-router.cjs /tmp/rewire-openwebui.py /tmp/atlas-router-health.json /tmp/atlas-router-smoke.json', 'rm -f /tmp/atlas-router-health.json /tmp/atlas-router-smoke.json', 1)
          p.write_text(s)
          PY
          grep -q 'concurrency:' .github/workflows/deploy-atlas-router.yml
          ! grep -q ':/tmp/atlas-router.cjs' .github/workflows/deploy-atlas-router.yml
          ! grep -q 'install -m 644 /tmp/atlas-router.cjs' .github/workflows/deploy-atlas-router.yml
      - name: Commit deploy race fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Atlas Router Bot'
          git config user.email 'atlas-router@users.noreply.github.com'
          git add .github/workflows/deploy-atlas-router.yml
          git commit -m 'Remove AtlasRouter shared deploy staging race'
          git push origin HEAD:main
