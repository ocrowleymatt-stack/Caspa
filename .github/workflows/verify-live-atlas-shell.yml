name: Verify Live Atlas Shell

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-atlas-shell.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify live Atlas identity and shipped bundle
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://caspa.ocrowley.com'

          DOCTOR=$(curl -fsS "$BASE/api/doctor")
          echo "DOCTOR=$DOCTOR"
          echo "$DOCTOR" | grep -q '"service":"Atlas"'
          echo "$DOCTOR" | grep -q '"gitSha":"191ad4e20a120187dd8106651b6e377add96570b"'

          curl -fsS "$BASE/atlas-logo.svg" -o /tmp/atlas-logo.svg
          grep -q '<title id="title">ATLAS</title>' /tmp/atlas-logo.svg
          echo 'LIVE_LOGO=present'

          curl -fsS "$BASE/" -o /tmp/index.html
          grep -q '<title>ATLAS • Nexus Strategist</title>' /tmp/index.html
          ASSET=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' /tmp/index.html | head -n1)
          test -n "$ASSET"
          echo "LIVE_ASSET=$ASSET"
          curl -fsS "$BASE$ASSET" -o /tmp/app.js

          grep -q 'atlas-mobile-upload' /tmp/app.js
          grep -q '/api/atlas/knowledge' /tmp/app.js
          grep -q 'ATLAS — Nexus Strategist' /tmp/app.js
          echo 'LIVE_MOBILE_UPLOAD=one-shell-control-marker-present'
          echo 'LIVE_ATLAS_KNOWLEDGE_NAMESPACE=present'
          echo 'LIVE_ATLAS_BRAND=present'
