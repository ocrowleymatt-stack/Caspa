name: Fix Council Mode

on:
  push:
    paths:
      - '.github/workflows/fix-council-mode.yml'

permissions:
  contents: write

# Claude compatibility pass: 2026-08-09T02:53Z
jobs:
  patch-council:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Claude Council model
        run: python scripts/update-live-council-models.py
      - name: Validate production build
        run: |
          npm ci
          npm run build
          git diff --check
      - name: Commit model migration
        run: |
          git config user.name atlas-council-fix
          git config user.email actions@users.noreply.github.com
          git add server.ts
          git commit -m "Use Claude Sonnet 4.6 for Council compatibility"
          git push
