name: Fix Council Mode

on:
  push:
    paths:
      - '.github/workflows/fix-council-mode.yml'

permissions:
  contents: write

jobs:
  patch-council:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Council Mode patch
        run: python scripts/fix-council-mode.py
      - name: Validate production build
        run: |
          npm ci
          npm run build
          git diff --check
      - name: Commit repair
        run: |
          git config user.name atlas-council-fix
          git config user.email actions@users.noreply.github.com
          git add src/services/ai.ts server.ts
          git commit -m "Make Council Mode multi-provider and fail-soft"
          git push
