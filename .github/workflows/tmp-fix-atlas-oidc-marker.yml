name: Fix Atlas OIDC Marker Check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-atlas-oidc-marker.yml'

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      ATLAS_HOST: 116.202.24.63
    steps:
      - name: Patch receiver marker scan
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATEKEY2"
          mkdir -p ~/.ssh
          printf '%s\n' "$PRIVATEKEY2" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 root@"$ATLAS_HOST" 'python3 -' <<'PY'
          from pathlib import Path
          p=Path('/root/AtlasDeploy/receiver.mjs')
          s=p.read_text()
          old="if (!router.toString('utf8', 0, Math.min(router.length, 200000)).includes('AtlasRouter')) throw new Error('router_marker');"
          new="if (!router.includes(Buffer.from('AtlasRouter'))) throw new Error('router_marker');"
          assert old in s, 'expected marker check not found'
          p.write_text(s.replace(old,new,1))
          print('atlas_oidc_marker_scan_full_bundle=true')
          PY
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 root@"$ATLAS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          pm2 restart atlas-deploy-receiver >/dev/null
          for i in $(seq 1 15); do
            if curl -fsS --max-time 2 http://127.0.0.1:3015/health >/tmp/atlas-deploy-health.json 2>/dev/null; then break; fi
            sleep 1
          done
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/atlas-deploy-health.json'))
          assert d.get('ok') is True and d.get('service') == 'AtlasOIDCDeployReceiver', d
          print('atlas_oidc_receiver_after_marker_fix=true')
          PY
          REMOTE
