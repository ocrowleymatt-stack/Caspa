name: Patch AtlasRouter v1.1 Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-atlas-router-v11.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: atlas-router/package-lock.json
      - name: Patch Atlas-only provider adapter
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('atlas-router/src/cloudModelRouter.ts')
          s=p.read_text()
          replacements=[
            ("  useSearch?: boolean;\n", "  useSearch?: boolean;\n  useXSearch?: boolean;\n"),
            ("const CATALOG_TTL_MS = 10 * 60_000;", "const CATALOG_TTL_MS = 30 * 60_000;"),
            ("signal: AbortSignal.timeout(6000)", "signal: AbortSignal.timeout(2500)"),
            ("...(opts.useSearch ? { tools: [{ type: 'web_search' }, { type: 'x_search' }] } : {}),", "...(opts.useSearch ? { tools: [{ type: 'web_search' }, ...(opts.useXSearch ? [{ type: 'x_search' as const }] : [])] } : {}),"),
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit(f'missing patch anchor: {old[:100]}')
              s=s.replace(old,new)
          anchor="export async function callCloudProvider(provider: CloudProvider, prompt: string, opts: RoutedCallOptions = {}): Promise<RoutedCloudResult> {\n"
          validator="""function searchOutputLooksUsable(text: string): boolean {\n  const t = String(text || '').trim();\n  if (t.length < 80) return false;\n  return !/\\b(?:i (?:cannot|can't|can not) access the internet|i (?:cannot|can't|can not) browse|unable to (?:access|browse) (?:the )?(?:internet|web)|i should (?:use tools|search|browse)|no internet access)\\b/i.test(t);\n}\n\n"""
          if anchor not in s:
              raise SystemExit('callCloudProvider anchor missing')
          s=s.replace(anchor,validator+anchor,1)
          quality_anchor="      if (!text) throw new Error(`${provider}/${model} returned empty output`);\n      if (opts.json) text = requireValidJson(text);\n"
          quality_replacement="      if (!text) throw new Error(`${provider}/${model} returned empty output`);\n      if (opts.useSearch && !searchOutputLooksUsable(text)) throw new Error(`${provider}/${model} returned unusable search output`);\n      if (opts.json) text = requireValidJson(text);\n"
          if quality_anchor not in s:
              raise SystemExit('quality anchor missing')
          s=s.replace(quality_anchor,quality_replacement,1)
          p.write_text(s)
          PY
          cd atlas-router
          npm ci --ignore-scripts
          npm run check
          grep -q 'useXSearch?: boolean' src/cloudModelRouter.ts
          grep -q 'searchOutputLooksUsable' src/cloudModelRouter.ts
          test "$(grep -c "x_search' as const" src/cloudModelRouter.ts)" -eq 2
      - name: Commit provider adapter patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Atlas Router Bot'
          git config user.email 'atlas-router@users.noreply.github.com'
          git add atlas-router/src/cloudModelRouter.ts
          git commit -m 'Speed and harden Atlas web provider execution'
          git push origin HEAD:main
