name: Make atlas.ocrowley.com the new Atlas directly

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/make-atlas-canonical-direct.yml'

permissions:
  contents: read

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: SSH setup
        shell: bash
        run: |
          set -euo pipefail
          key="${PRIVATEKEY2:-${HETZNER_SSH_KEY:-}}"
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Switch canonical hostname to Atlas unified
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" '
            set -euo pipefail
            f=/etc/nginx/conf.d/zzz-atlas-auth.conf
            grep -q "return 302 https://atlas2.ocrowley.com" "$f"
            cp "$f" "/var/backups/zzz-atlas-auth.before-direct-$(date -u +%Y%m%dT%H%M%SZ).conf"
            sed -i "s@return 302 https://atlas2.ocrowley.com.*;@proxy_pass http://127.0.0.1:3110;@" "$f"
            grep -n -A4 -B2 "server_name atlas.ocrowley.com" "$f"
            nginx -t
            systemctl reload nginx
          '

      - name: Verify canonical hostname
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -I https://atlas.ocrowley.com/ | tee /tmp/h
          grep -qi '^location: /__atlas/login?next=%2F' /tmp/h
          if grep -qi 'atlas2.ocrowley.com' /tmp/h; then
            echo 'Canonical hostname still redirects to atlas2' >&2
            exit 1
          fi
