name: Repair Atlas Council OSINT

on:
  push:
    paths:
      - '.github/workflows/repair-atlas-council-osint.yml'
      - 'scripts/repair-atlas-council-osint.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - uses: actions/checkout@v4

      - name: Adapt installer to current live fallback block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/repair-atlas-council-osint.py')
          text = path.read_text(encoding='utf-8')
          start_token = "old_incomplete = '''"
          end_marker = 'patched = patched.replace(old_incomplete, new_incomplete, 1)\n'
          if start_token in text:
              start = text.index(start_token)
              end = text.index(end_marker, start) + len(end_marker)
              replacement = r'''fallback_anchor = ''' + "'''" + r'''            if osint_active and profile == "research":
                answer = self._osint_deterministic_brief(evidence_packet)
                if answer:
                    elapsed = time.monotonic() - started
                    await self._emit(__event_emitter__, f"Atlas Council complete · {elapsed:.0f}s · readable deterministic OSINT quorum", done=True)
                    return answer
''' + "'''" + r'''
fallback_new = ''' + "'''" + r'''            if osint_active and profile == "research":
                answer = self._osint_deterministic_brief(evidence_packet)
                if answer:
                    elapsed = time.monotonic() - started
                    await self._emit(__event_emitter__, f"Atlas Council complete · {elapsed:.0f}s · substantive deterministic OSINT quorum", done=True)
                    return answer
                answer = self._osint_incomplete_brief(evidence_packet)
                if answer:
                    elapsed = time.monotonic() - started
                    await self._emit(__event_emitter__, f"Atlas Council complete · {elapsed:.0f}s · bounded OSINT incomplete without false quorum", done=True)
                    return answer
''' + "'''" + r'''
if fallback_anchor not in patched:
    raise SystemExit("OSINT research fallback anchor mismatch")
patched = patched.replace(fallback_anchor, fallback_new, 1)
'''
              text = text[:start] + replacement + text[end:]
              path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/repair-atlas-council-osint.py
          grep -q 'OSINT research fallback anchor mismatch' scripts/repair-atlas-council-osint.py
          grep -q 'bounded OSINT incomplete without false quorum' scripts/repair-atlas-council-osint.py

      - name: Select SSH key
        shell: bash
        run: |
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Copy repair script
        shell: bash
        run: |
          scp -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 \
            scripts/repair-atlas-council-osint.py \
            "${ATLAS_USER}@${ATLAS_HOST}:/tmp/repair-atlas-council-osint.py"

      - name: Patch and verify live Council
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          docker cp /tmp/repair-atlas-council-osint.py atlas-openwebui:/tmp/repair-atlas-council-osint.py
          docker exec atlas-openwebui python3 /tmp/repair-atlas-council-osint.py

          docker restart atlas-openwebui >/dev/null
          for i in $(seq 1 35); do
            state=$(docker inspect -f '{{.State.Health.Status}}' atlas-openwebui 2>/dev/null || true)
            [ "$state" = healthy ] && break
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' atlas-openwebui)" = healthy

          docker exec -i atlas-openwebui python3 - <<'PY'
          import json, sqlite3
          con=sqlite3.connect('/app/backend/data/webui.db')
          row=con.execute("SELECT content, meta FROM function WHERE id='atlas-council'").fetchone()
          assert row, 'atlas-council missing after restart'
          code=row[0] or ''
          meta=json.loads(row[1] or '{}')
          assert 'Atlas Council v3.9.5' in code
          assert 'substantive payload required for OSINT quorum' in code
          assert 'substantive_progressive_quorum' in code
          assert '"validated_profiles": {' in code
          assert 'Council OSINT target unresolved — no broad search launched.' in code
          assert 'SELF-HOSTED PUBLIC WEB SEARCH: skipped — explicit OSINT requested but no bounded target was resolved.' in code
          assert 'no false quorum declared' in code
          assert 'bounded OSINT incomplete without false quorum' in code
          assert 'status-only false quorum' in str(meta.get('description',''))
          assert 'never falls through' in str(meta.get('description',''))
          print('live_version=v3.9.5')
          print('substantive_quorum=PASS')
          print('identity_compaction=PASS')
          print('readable_incomplete=PASS')
          print('verification=PASS')
          con.close()
          PY
          REMOTE