name: Cut old Atlas hostname over to Atlas2 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cutover-atlas-hostname-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: SSH setup
        shell: bash
        run: |
          set -euo pipefail
          key="${PRIVATEKEY2:-${HETZNER_SSH_KEY:-}}"
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Route atlas.ocrowley.com to new Atlas service
        shell: bash
        run: |
          set -euo pipefail
          cat <<'PY' | ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" python3 -
          from pathlib import Path
          import re, time
          p=Path('/etc/nginx/conf.d/zzz-atlas-auth.conf')
          s=p.read_text()
          backup=Path(f"/var/backups/zzz-atlas-auth.before-cutover-{int(time.time())}.conf")
          backup.write_text(s)

          m=re.search(r"server\s*\{(?:(?!\n\}).)*?server_name\s+atlas\.ocrowley\.com;(?:(?!\n\}).)*?\n\}", s, re.S)
          if not m:
              raise SystemExit("atlas.ocrowley.com TLS server block not found")
          block=m.group(0)

          loc=re.search(r"\n\s*location\s+/\s*\{.*?\n\s*\}", block, re.S)
          if not loc:
              raise SystemExit("atlas.ocrowley.com location / block not found")

          newloc="""
    location / {
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }"""
          newblock=block[:loc.start()]+newloc+block[loc.end():]
          p.write_text(s[:m.start()]+newblock+s[m.end():])
          print(f"backup={backup}")
          PY
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'nginx -t && systemctl reload nginx'

      - name: Verify old hostname now reaches new Atlas
        shell: bash
        run: |
          set -euo pipefail
          echo "--- public old hostname ---"
          curl -sS -I https://atlas.ocrowley.com/ | sed -n '1,20p'
          echo "--- server-side old hostname ---"
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          curl -k -sS -D /tmp/h -o /tmp/b https://127.0.0.1/ -H 'Host: atlas.ocrowley.com'
          cat /tmp/h
          grep -q 'location: /__atlas/login' /tmp/h || test "$(grep -c 'HTTP/2 200' /tmp/h)" -gt 0
          nginx -T 2>/dev/null | grep -n -A20 'server_name atlas.ocrowley.com' | head -40
          REMOTE

# direct same-origin proxy cutover trigger
