name: Cut old Atlas hostname over to Atlas2 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cutover-atlas-hostname-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root

    steps:
      - name: SSH setup
        shell: bash
        run: |
          set -euo pipefail
          key="${PRIVATEKEY2:-${HETZNER_SSH_KEY:-}}"
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Redirect old Atlas browser host
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" "python3 -c \"
          from pathlib import Path
          p=Path('/etc/nginx/conf.d/zzz-atlas-auth.conf')
          s=p.read_text()
          old='''    location / {
                  proxy_pass http://127.0.0.1:8790;
                  proxy_set_header Host \\$host;
                  proxy_set_header X-Real-IP \\$remote_addr;
                  proxy_set_header X-Forwarded-For \\$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \\$scheme;
                  proxy_redirect off;
              }'''
          new='''    location / {
                  return 302 https://atlas2.ocrowley.com\\$request_uri;
              }'''
          assert old in s, 'expected old atlas location block not found'
          Path('/var/backups/zzz-atlas-auth.before-cutover.conf').write_text(s)
          p.write_text(s.replace(old,new,1))
          \"" 
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" "nginx -t && systemctl reload nginx"

      - name: Verify public cutover
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl -sS -I https://atlas.ocrowley.com/)"
          printf '%s\n' "$headers"
          printf '%s\n' "$headers" | grep -qi '^location: https://atlas2.ocrowley.com/'
          curl -sS -I https://atlas2.ocrowley.com/ | sed -n '1,15p'
