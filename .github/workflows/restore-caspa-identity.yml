name: Restore CASPA Identity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-caspa-identity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: python3 scripts/restore-caspa-identity.py
      - run: npm test
      - run: npm run build

      - name: Verify CASPA identity contract
        shell: bash
        run: |
          grep -q 'CASPA • Creative Engine' index.html
          grep -q 'Caspa hit a snag' src/main.tsx
          grep -q 'Make the thing first. Tools second.' src/App.tsx
          grep -q "service: 'Caspa'" src/services/doctorService.ts
          ! grep -q '/atlas-logo.svg' src/App.tsx
          ! grep -q 'ATLAS • Nexus Strategist' index.html
          ! grep -q 'className="atlas-mobile-upload"' src/App.tsx
          test ! -e public/atlas-logo.svg

      - name: Commit restored CASPA identity
        shell: bash
        run: |
          git config user.name caspa-automation
          git config user.email caspa-automation@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes required.'
          else
            git commit -m 'Restore CASPA identity and remove Atlas shell branding'
            git push origin HEAD:main
          fi
