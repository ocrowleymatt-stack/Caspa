name: Accelerate Atlas Live Search

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/accelerate-live-search.yml'

permissions:
  contents: write

jobs:
  accelerate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prefer low-latency Grok for ordinary factual work
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/services/cloudModelRouter.ts')
          s=p.read_text()
          old="""  if (provider === 'grok') {\n    if (task === 'creative' && mode !== 'speed') return ['grok-4.5'];\n    if (task === 'fast') return ['grok-4.20-0309-non-reasoning'];\n  }\n"""
          new="""  if (provider === 'grok') {\n    if (task === 'creative' && mode !== 'speed') return ['grok-4.5'];\n    if (task === 'fast') return ['grok-4.20-0309-non-reasoning'];\n    if (task === 'factual' && mode !== 'god') return ['grok-4.20-0309-non-reasoning', 'grok-4.20-0309-reasoning'];\n  }\n"""
          if old not in s:
              raise SystemExit('Grok task adjustment anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
      - run: npm ci
      - name: Router regression tests
        run: node --import tsx --test tests/routerCostPolicy.test.ts
      - run: npm run build
      - name: Commit acceleration
        shell: bash
        run: |
          git config user.name 'ocrowleymatt-stack'
          git config user.email 'ocrowley.matt@gmail.com'
          git add src/services/cloudModelRouter.ts
          git commit -m 'Use low-latency Grok for ordinary live research'
          git push origin HEAD:main
