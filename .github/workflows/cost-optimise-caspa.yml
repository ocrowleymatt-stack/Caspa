name: Cost optimise Caspa AI usage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cost-optimise-caspa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimise:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply consolidated cost patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-ai-cost-optimisation.py

      - name: Build production bundle
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build

      - name: Commit cost optimisation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src server.ts .deploy-atlas-trigger
          if git diff --cached --quiet; then
            echo 'No cost changes to commit.'
            exit 0
          fi
          git commit -m 'Cut AI spend with local-first and cheap cached routing'
          git pull --rebase origin main
          git push origin HEAD:main
