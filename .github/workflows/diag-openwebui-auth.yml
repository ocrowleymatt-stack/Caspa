name: Diagnose OpenWebUI Auth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-openwebui-auth.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: Select SSH key
        shell: bash
        run: |
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect auth helpers
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'docker exec -i atlas-openwebui python3 -' <<'PY'
          import inspect
          mods=[]
          for name in ('open_webui.utils.auth','open_webui.utils.security_headers','open_webui.models.auths'):
              try:
                  m=__import__(name,fromlist=['*']); mods.append((name,m))
              except Exception as e: print('IMPORT_FAIL',name,repr(e))
          for name,m in mods:
              print('MODULE',name)
              for attr in dir(m):
                  if any(k in attr.lower() for k in ('token','jwt','auth')):
                      obj=getattr(m,attr)
                      try: sig=str(inspect.signature(obj))
                      except Exception: sig=''
                      print(attr,sig)
          PY
