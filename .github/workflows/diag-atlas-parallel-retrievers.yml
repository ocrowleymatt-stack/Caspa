name: Diagnose Atlas Parallel Retrievers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-atlas-parallel-retrievers.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: Select SSH key
        shell: bash
        run: |
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
      - name: Probe retriever contracts and source
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== PM2 SERVICE MAP ==='
          pm2 jlist > /tmp/pm2.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/pm2.json'))
          for p in data:
              if p.get('name') in {'fortune-agent','tavily-search','perplexica-research','spiderfoot-osint'}:
                  env=p.get('pm2_env') or {}
                  print({'name':p.get('name'),'pid':p.get('pid'),'exec':env.get('pm_exec_path'),'cwd':env.get('pm_cwd')})
          PY

          echo '=== LISTENERS ==='
          ss -ltnp 2>/dev/null | grep -E ':(3004|3005|3006)[[:space:]]' || true

          for port in 3004 3005 3006; do
            echo "=== PORT $port ROOT ==="
            curl -sS --max-time 4 "http://127.0.0.1:${port}/" || true; echo
            echo "=== PORT $port OPENAPI PATHS ==="
            curl -sS --max-time 4 "http://127.0.0.1:${port}/openapi.json" -o "/tmp/openapi-${port}.json" || true
            python3 - "$port" <<'PY'
          import json,sys
          port=sys.argv[1]
          try:
              d=json.load(open('/tmp/openapi-'+port+'.json'))
          except Exception as e:
              print('OPENAPI_ERROR',e); raise SystemExit
          print('title=',(d.get('info') or {}).get('title'))
          for path,methods in (d.get('paths') or {}).items():
              print(path, sorted(methods.keys()))
              for method,spec in methods.items():
                  rb=(spec or {}).get('requestBody') or {}
                  schemas=[]
                  for ctype,val in (rb.get('content') or {}).items():
                      schemas.append((ctype,(val or {}).get('schema')))
                  if schemas: print(' request=',schemas)
          PY
          done

          echo '=== LIVE SOURCE CONTRACTS ==='
          for f in /root/enhanced-omni-tools/tavily-search.py /root/enhanced-omni-tools/perplexica-research.py /root/enhanced-omni-tools/fortune-agent.py; do
            echo "--- $f ---"
            if [ -f "$f" ]; then
              grep -nE '(@app\.|def |class |PORT|port=|uvicorn|query|search|research|httpx|requests|return )' "$f" | head -n 220 || true
            else
              echo MISSING
            fi
          done

          echo '=== LIVE AUTO MARKERS ==='
          docker exec -i atlas-openwebui python3 - <<'PY'
          import sqlite3
          con=sqlite3.connect('/app/backend/data/webui.db')
          code=con.execute("select content from function where id='atlas-auto'").fetchone()[0]
          for marker in ['ATLAS AUTO DIRECT WEB ROUTING v1.4','ATLAS AUTO PERFORMANCE HARDENING v1.5','ATLAS AUTO PUBLIC FOOTPRINT ROUTING v1.6']:
              print(marker, marker in code)
          print('code_chars',len(code))
          PY
          REMOTE
