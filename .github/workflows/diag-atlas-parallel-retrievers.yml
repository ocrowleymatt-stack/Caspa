name: Diagnose Atlas Parallel Retrievers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-atlas-parallel-retrievers.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: Select SSH key
        shell: bash
        run: |
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
      - name: Benchmark live retrievers
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'python3 -' <<'PY'
          import concurrent.futures, json, time, urllib.request, urllib.error
          q='osint search and create a background story with current info for stuart a Hardman previously of Nottingham, previous partner of Scott millard and now living in walsall with Adam Walsh'

          def post(name,url,payload,timeout):
              started=time.monotonic()
              req=urllib.request.Request(url,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      raw=r.read().decode(errors='replace')
                      code=r.status
              except Exception as e:
                  return {'name':name,'ok':False,'ms':round((time.monotonic()-started)*1000),'error':repr(e)}
              try: data=json.loads(raw)
              except Exception: data={'raw':raw}
              return {'name':name,'ok':200<=code<300,'ms':round((time.monotonic()-started)*1000),'code':code,'data':data}

          tests=[
              ('tavily-basic','http://127.0.0.1:3006/search',{'query':q},25),
              ('tavily-advanced','http://127.0.0.1:3006/search/advanced',{'query':q,'include_answer':True,'include_sources':True},25),
              ('perplexica','http://127.0.0.1:3008/research',{'query':q,'mode':'research'},55),
          ]
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:
              futs=[ex.submit(post,*t) for t in tests]
              rows=[f.result() for f in futs]
          for row in rows:
              data=row.pop('data',None)
              print('RESULT',json.dumps(row,ensure_ascii=False))
              if data is not None:
                  txt=json.dumps(data,ensure_ascii=False)
                  print('BODY',row['name'],txt[:12000])
          print('=== LISTENER 3008 ===')
          import subprocess
          print(subprocess.run("ss -ltnp 2>/dev/null | grep -E ':(3006|3008)[[:space:]]' || true",shell=True,text=True,capture_output=True).stdout)
          PY
