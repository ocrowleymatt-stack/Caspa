name: Benchmark Atlas Parallel Research

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-atlas-parallel-retrievers.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: Select SSH key
        shell: bash
        run: |
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
      - name: Benchmark exact live Auto and inspect retrieval telemetry
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'docker exec -i atlas-openwebui python3 -' <<'PY'
          import asyncio, json, sqlite3, sys, time, types, urllib.request

          prompt='osint search and create a background story with current info for stuart a Hardman previously of Nottingham, previous partner of Scott millard and now living in walsall with Adam Walsh'

          users_mod=types.ModuleType('open_webui.models.users')
          class DummyUsers:
              @staticmethod
              async def get_user_by_id(_): return object()
          users_mod.Users=DummyUsers
          chat_mod=types.ModuleType('open_webui.utils.chat')
          async def forbidden_local(*args,**kwargs):
              raise AssertionError('web benchmark unexpectedly recursed into local completion')
          chat_mod.generate_chat_completion=forbidden_local
          sys.modules['open_webui.models.users']=users_mod
          sys.modules['open_webui.utils.chat']=chat_mod

          con=sqlite3.connect('/app/backend/data/webui.db')
          code=con.execute("select content from function where id='atlas-auto'").fetchone()[0]
          for marker in ['ATLAS AUTO DIRECT WEB ROUTING v1.4','ATLAS AUTO PERFORMANCE HARDENING v1.5','ATLAS AUTO PUBLIC FOOTPRINT ROUTING v1.6']:
              assert marker in code, marker
          ns={}; exec(compile(code,'<live-atlas-auto-v16>','exec'),ns)
          pipe=ns['Pipe']()
          body={'model':'atlas-auto','messages':[{'role':'user','content':prompt}]}
          router_prompt=pipe._router_prompt(body)

          # First inspect the Router response directly so retrieval mode/query/source timing is visible.
          payload=json.dumps({
              'prompt':router_prompt,
              'intelligenceMode':'speed',
              'maxTokens':3600,
              'primaryProvider':'grok',
              'useWebSearch':True,
              'useXSearch':False,
              'taskHint':'factual',
              'json':False,
          }).encode()
          req=urllib.request.Request('http://172.19.0.1:3014/api/ai/call',data=payload,headers={'Content-Type':'application/json'})
          started=time.monotonic()
          with urllib.request.urlopen(req,timeout=120) as r:
              direct=json.load(r)
          direct_elapsed=time.monotonic()-started
          text=str(direct.get('result') or '')
          retrieval=direct.get('retrieval') or {}
          print('DIRECT_ELAPSED_SECONDS',round(direct_elapsed,3))
          print('DIRECT_REQUEST_MS',direct.get('requestDurationMs'))
          print('DIRECT_PROVIDER_MS',direct.get('providerDurationMs'))
          print('RETRIEVAL',json.dumps(retrieval,ensure_ascii=False))
          print('DIRECT_RESULT_CHARS',len(text))
          print('DIRECT_PREVIEW',text[:1800].replace('\n',' '))
          assert direct.get('provider') == 'grok', direct
          assert len(text) > 800, text[:1000]
          assert retrieval.get('mode') == 'parallel-tavily-prefetch', retrieval
          assert int(retrieval.get('sourceCount') or 0) >= 3, retrieval
          assert 'http://' in text or 'https://' in text, text[:2000]

          # Then exercise the actual live Auto pipe end-to-end.
          statuses=[]
          async def emitter(evt): statuses.append(evt)
          async def run_auto():
              started=time.monotonic()
              result=await pipe.pipe(body, {'id':'benchmark-user'}, None, emitter)
              return result, time.monotonic()-started
          auto_result, auto_elapsed=asyncio.run(run_auto())
          auto_text=str(auto_result or '')
          print('AUTO_ELAPSED_SECONDS',round(auto_elapsed,3))
          print('AUTO_RESULT_CHARS',len(auto_text))
          for status in statuses: print('AUTO_STATUS',status)
          print('AUTO_PREVIEW',auto_text[:1800].replace('\n',' '))
          assert len(auto_text)>800, auto_text[:1000]
          assert 'http://' in auto_text or 'https://' in auto_text, auto_text[:2000]
          low=auto_text.lower()
          for bad in ['cannot access the internet', "can't access the internet", 'i should use tools', 'i should search']:
              assert bad not in low, bad
          assert any('live research complete' in str(s).lower() for s in statuses), statuses
          print('ATLAS_PARALLEL_RESEARCH_BENCHMARK_PASS=true')
          PY
