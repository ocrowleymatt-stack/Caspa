name: Force Atlas canonical hostname cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-atlas-canonical-cutover.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: SSH setup
        shell: bash
        run: |
          set -euo pipefail
          key="${PRIVATEKEY2:-${HETZNER_SSH_KEY:-}}"
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Cut atlas.ocrowley.com to new Atlas
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'python3 -' <<'PY'
          from pathlib import Path
          import time
          p=Path('/etc/nginx/conf.d/zzz-atlas-auth.conf')
          s=p.read_text()
          old="""    location / {
                  proxy_pass http://127.0.0.1:8790;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_redirect off;
              }"""
          if old not in s:
              old="""    location / {
              proxy_pass http://127.0.0.1:8790;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_redirect off;
          }"""
          if old not in s:
              raise SystemExit('old port-8790 location block not found; refusing blind edit')
          backup=Path(f'/var/backups/zzz-atlas-auth.before-force-cutover-{int(time.time())}.conf')
          backup.write_text(s)
          new="""    location / {
              proxy_pass http://127.0.0.1:3110;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto https;
              proxy_set_header Connection "";
              proxy_read_timeout 300s;
              proxy_send_timeout 300s;
          }"""
          p.write_text(s.replace(old,new,1))
          print(f'backup={backup}')
          PY
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'nginx -t'
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'systemctl reload nginx'

      - name: Verify exact public hostname
        shell: bash
        run: |
          set -euo pipefail
          echo '--- public atlas.ocrowley.com ---'
          headers="$(curl -sS -I https://atlas.ocrowley.com/)"
          printf '%s\n' "$headers"
          printf '%s\n' "$headers" | grep -Eq '^HTTP/.* (200|303)'
          body="$(curl -sS -L --max-redirs 2 https://atlas.ocrowley.com/)"
          printf '%s' "$body" | grep -Eq 'Sign in to private Atlas|ATLAS · PRIVATE STAGING|Computer & apps|Search thoroughly'
          echo 'canonical_hostname_new_atlas=true'
