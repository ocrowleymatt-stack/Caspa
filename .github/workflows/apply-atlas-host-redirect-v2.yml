name: Apply Atlas hostname redirect v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-atlas-host-redirect-v2.yml'

permissions:
  contents: read

jobs:
  redirect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: SSH setup
        shell: bash
        run: |
          set -euo pipefail
          key="${PRIVATEKEY2:-${HETZNER_SSH_KEY:-}}"
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Apply redirect and reload nginx
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          file=/etc/nginx/conf.d/zzz-atlas-auth.conf
          cp "$file" "/var/backups/zzz-atlas-auth-before-atlas2-$(date -u +%Y%m%dT%H%M%SZ).conf"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("/etc/nginx/conf.d/zzz-atlas-auth.conf")
          s=p.read_text()
          old="""    location / {
                  proxy_pass http://127.0.0.1:8790;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_redirect off;
              }"""
          new="""    location / {
                  return 302 https://atlas2.ocrowley.com$request_uri;
              }"""
          if new in s:
              print("redirect already installed")
          elif old in s:
              p.write_text(s.replace(old,new,1))
              print("redirect installed")
          else:
              raise SystemExit("expected old Atlas proxy block not found")
          PY
          nginx -t
          systemctl reload nginx
          curl -k -sSI https://127.0.0.1/ -H 'Host: atlas.ocrowley.com' | sed -n '1,15p'
          REMOTE

      - name: Verify public redirect
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl -sSI https://atlas.ocrowley.com/)"
          printf '%s\n' "$headers"
          printf '%s\n' "$headers" | grep -qi '^location: https://atlas2.ocrowley.com/'
