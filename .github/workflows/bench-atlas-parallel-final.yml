name: Benchmark Atlas Parallel Final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bench-atlas-parallel-final.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: Select SSH key
        shell: bash
        run: |
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
      - name: Exact final live Auto benchmark
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'docker exec -i atlas-openwebui python3 -' <<'PY'
          import asyncio,json,sqlite3,sys,time,types,urllib.request
          prompt='osint search and create a background story with current info for stuart a Hardman previously of Nottingham, previous partner of Scott millard and now living in walsall with Adam Walsh'
          users_mod=types.ModuleType('open_webui.models.users')
          class DummyUsers:
              @staticmethod
              async def get_user_by_id(_): return object()
          users_mod.Users=DummyUsers
          chat_mod=types.ModuleType('open_webui.utils.chat')
          async def forbidden(*args,**kwargs): raise AssertionError('unexpected local recursion')
          chat_mod.generate_chat_completion=forbidden
          sys.modules['open_webui.models.users']=users_mod
          sys.modules['open_webui.utils.chat']=chat_mod
          con=sqlite3.connect('/app/backend/data/webui.db')
          code=con.execute("select content from function where id='atlas-auto'").fetchone()[0]
          ns={};exec(compile(code,'<live-auto>','exec'),ns)
          p=ns['Pipe'](); body={'model':'atlas-auto','messages':[{'role':'user','content':prompt}]}
          router_prompt=p._router_prompt(body)
          payload=json.dumps({'prompt':router_prompt,'intelligenceMode':'speed','maxTokens':3600,'primaryProvider':'grok','useWebSearch':True,'useXSearch':False,'taskHint':'factual'}).encode()
          req=urllib.request.Request('http://172.19.0.1:3014/api/ai/call',data=payload,headers={'Content-Type':'application/json'})
          t=time.monotonic()
          with urllib.request.urlopen(req,timeout=120) as r: d=json.load(r)
          print('DIRECT_SECONDS',round(time.monotonic()-t,3))
          print('RETRIEVAL',json.dumps(d.get('retrieval') or {},ensure_ascii=False))
          print('DIRECT_CHARS',len(str(d.get('result') or '')))
          rt=d.get('retrieval') or {}
          assert rt.get('mode')=='parallel-tavily-prefetch',rt
          assert int(rt.get('sourceCount') or 0)>=3,rt
          queries=rt.get('queries') or []
          print('QUERIES',json.dumps(queries,ensure_ascii=False))
          assert all(not (q.count('"') % 2) for q in queries),queries
          statuses=[]
          async def emit(e): statuses.append(e)
          async def run():
              t=time.monotonic(); result=await p.pipe(body,{'id':'benchmark-user'},None,emit); return result,time.monotonic()-t
          result,elapsed=asyncio.run(run())
          text=str(result or '')
          print('AUTO_SECONDS',round(elapsed,3))
          print('AUTO_CHARS',len(text))
          for s in statuses: print('STATUS',s)
          assert len(text)>800
          assert 'http://' in text or 'https://' in text
          assert any('live research complete' in str(s).lower() for s in statuses)
          print('FINAL_PARALLEL_BENCHMARK_PASS=true')
          PY
