name: Restore Atlas production auth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atlas-auth-emergency-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ATLAS_HOST: 116.202.24.63
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
    steps:
      - name: Select server SSH identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PRIVATEKEY2:-}"
          mkdir -p ~/.ssh
          printf '%s\n' "$PRIVATEKEY2" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Restore current-release service with native auth enabled
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 root@"$ATLAS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          live_unit=/etc/systemd/system/atlas-mountain-nexus.service

          compatible="$(find /etc/systemd/system -maxdepth 1 -type f \
            -name 'atlas-mountain-nexus.service.pre-auth-repair.*' -printf '%T@ %p\n' \
            | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$compatible" || { echo 'No preserved pre-repair Atlas service unit found.' >&2; exit 1; }
          echo 'atlas_preserved_unit_found=true'

          repaired="$(mktemp /tmp/atlas-nexus-auth.XXXXXX.service)"
          cp -a "$compatible" "$repaired"
          if grep -q '^Environment=NEXUS_NATIVE_AUTH_ENABLED=' "$repaired"; then
            sed -i 's/^Environment=NEXUS_NATIVE_AUTH_ENABLED=.*$/Environment=NEXUS_NATIVE_AUTH_ENABLED=true/' "$repaired"
          else
            sed -i '/^EnvironmentFile=/a Environment=NEXUS_NATIVE_AUTH_ENABLED=true' "$repaired"
          fi
          grep -qx 'Environment=NEXUS_NATIVE_AUTH_ENABLED=true' "$repaired"
          ! grep -q '^Environment=NEXUS_NATIVE_AUTH_ENABLED=false$' "$repaired"

          install -o root -g root -m 0644 "$repaired" "$live_unit"
          rm -f "$repaired"
          systemctl daemon-reload
          if ! systemctl restart atlas-mountain-nexus.service; then
            echo 'atlas_nexus_restart_command=false' >&2
            systemctl status atlas-mountain-nexus.service --no-pager -l >&2 || true
            journalctl -u atlas-mountain-nexus.service -n 100 --no-pager >&2 || true
            systemctl stop atlas-mountain-nexus.service || true
            exit 1
          fi

          ready=false
          for _ in $(seq 1 45); do
            if curl -fsS --max-time 3 http://127.0.0.1:43101/health >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo 'atlas_nexus_restart_ready=false' >&2
            systemctl status atlas-mountain-nexus.service --no-pager -l >&2 || true
            journalctl -u atlas-mountain-nexus.service -n 100 --no-pager >&2 || true
            systemctl stop atlas-mountain-nexus.service || true
            exit 1
          fi
          echo 'atlas_nexus_restart_ready=true'
          systemctl is-active --quiet atlas-mountain-nexus.service
          REMOTE

      - name: Verify public auth boundary
        shell: bash
        run: |
          set -euo pipefail
          base='https://atlas.ocrowley.com'
          for _ in $(seq 1 20); do
            api="$(curl -ksS -o /dev/null -w '%{http_code}' --max-time 10 "$base/v12/api/models" || true)"
            login="$(curl -ksS -o /dev/null -w '%{http_code}' --max-time 10 "$base/v12/login" || true)"
            auth="$(curl -ksS -o /dev/null -w '%{http_code}' --max-time 10 "$base/v12/auth/status" || true)"
            echo "atlas_auth_probe=api:${api:-000},login:${login:-000},status:${auth:-000}"
            if [[ "$api" == 401 || "$api" == 403 ]] && [[ "$login" == 200 ]] && [[ "$auth" == 200 ]]; then
              echo 'atlas_public_auth_fail_closed=true'
              exit 0
            fi
            sleep 2
          done
          echo 'Atlas public auth boundary did not recover; stopping Nexus to remain fail-closed.' >&2
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 root@"$ATLAS_HOST" \
            'systemctl stop atlas-mountain-nexus.service || true'
          exit 1

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
