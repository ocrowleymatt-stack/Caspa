name: Deploy Caspa

# Caspa production only. Atlas has its own deploy-atlas-router.yml path.
# .deploy-atlas-trigger is retained temporarily as a legacy Caspa trigger because
# older Caspa repair workflows still write it; it no longer represents Atlas.

on:
  push:
    branches:
      - main
    paths:
      - '.deploy-atlas-trigger'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type deploy to confirm CASPA production restart'
        required: true
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
      CASPA_DIR: /root/Caspa
    steps:
      - name: Require confirmation
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.confirm }}" != "deploy" ]; then
            echo "Refusing: set confirm=deploy to run the CASPA deploy."
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Caspa deploy authorised by legacy .deploy-atlas-trigger change on main."
          fi

      - name: Select SSH key
        shell: bash
        run: |
          key=""
          chosen=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY DEPLOY_SSH_KEY SERVER_SSH_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; chosen="$name"; break; fi
          done
          if [ -z "$key" ]; then
            echo "::error::No CASPA SSH secret found. Add PRIVATEKEY2 (preferred) in repo Settings → Secrets."
            exit 2
          fi
          echo "Using secret: $chosen"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy origin/main on Caspa
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 \
            "${ATLAS_USER}@${ATLAS_HOST}" \
            "set -euo pipefail
             cd '${CASPA_DIR}'
             git fetch origin
             git reset --hard origin/main
             git clean -fd -e data -e .env -e .caspa-core.env -e '.caspa-core.env.bak.*' -e exports -e backups -e .caspa_snapshots
             export CASPA_GIT_SHA=\$(git rev-parse HEAD)
             export CASPA_GIT_BRANCH=\$(git rev-parse --abbrev-ref HEAD || echo main)
             export CASPA_BUILD_TIME=\$(date -u +%Y-%m-%dT%H:%M:%SZ)
             unset NODE_ENV || true
             npm ci
             PROXY_SECRET=\$(node -e \"require('dotenv').config({path:['.env','.caspa-core.env'],quiet:true}); process.stdout.write(process.env.CASPA_PROXY_SHARED_SECRET || '')\")
             OPS_GROUPS=\$(node -e \"require('dotenv').config({path:['.env','.caspa-core.env'],quiet:true}); process.stdout.write(process.env.CASPA_OPS_GROUPS || '')\")
             DATABASE_URL=\$(node -e \"require('dotenv').config({path:['.env','.caspa-core.env'],quiet:true}); process.stdout.write(process.env.CASPA_DATABASE_URL || '')\")
             if [ -z \"\$PROXY_SECRET\" ]; then
               echo 'CASPA_PROXY_SHARED_SECRET is required; refusing deployment.' >&2
               exit 3
             fi
             if [ -z \"\$OPS_GROUPS\" ]; then
               echo 'CASPA_OPS_GROUPS is required; refusing deployment.' >&2
               exit 3
             fi
             if [ -z \"\$DATABASE_URL\" ]; then
               echo 'CASPA_DATABASE_URL is required; refusing deployment.' >&2
               exit 3
             fi
             CASPA_DATABASE_URL=\"\$DATABASE_URL\" node -e \"const {Client}=require('pg'); const c=new Client({connectionString:process.env.CASPA_DATABASE_URL}); c.connect().then(()=>c.query('select 1')).then(()=>c.end()).catch((error)=>{console.error('PostgreSQL preflight failed:', error.message); process.exit(1)})\"
             bash scripts/verify-nginx-identity.sh
             npm run lint
             export NODE_ENV=production
             export CASPA_DATA_DIR=/root/Caspa/data
             if grep -q '^CLOUD_TOKEN_ENCRYPTION_KEY=$' .env 2>/dev/null; then
               CLOUD_KEY=\$(openssl rand -hex 32)
               sed -i \"s|^CLOUD_TOKEN_ENCRYPTION_KEY=$|CLOUD_TOKEN_ENCRYPTION_KEY=\${CLOUD_KEY}|\" .env
             elif ! grep -q '^CLOUD_TOKEN_ENCRYPTION_KEY=' .env 2>/dev/null; then
               umask 077
               printf '\\nCLOUD_TOKEN_ENCRYPTION_KEY=%s\\n' \"\$(openssl rand -hex 32)\" >> .env
             fi
             chmod 600 .env
             npm run build
             npm test
             test -f dist/server.cjs
             test -f dist/index.html
             pm2 delete caspa || true
             pm2 startOrReload ecosystem.config.cjs --update-env
             pm2 save
             sleep 3
             curl -fsS http://127.0.0.1:3000/health
             echo
             curl -fsS http://127.0.0.1:3000/api/doctor
             echo
             OPS_GROUP=\${OPS_GROUPS%%,*}
             OPS_GROUP=\${OPS_GROUP%%|*}
             DETAIL=\$(curl -fsS http://127.0.0.1:3000/api/v2/doctor \
               -H \"X-Authentik-Uid: deploy-verifier\" \
               -H \"X-Authentik-Groups: \$OPS_GROUP\" \
               -H \"X-Caspa-Proxy-Secret: \$PROXY_SECRET\")
             echo \"\$DETAIL\" | grep -Fq \"\\\"gitSha\\\":\\\"\$CASPA_GIT_SHA\\\"\" || {
               echo 'Authenticated build fingerprint did not match deployed commit.' >&2
               exit 4
             }
             echo 'Authenticated build fingerprint matches deployed commit.'"

      - name: Verify sanitised public Caspa endpoints
        shell: bash
        run: |
          sleep 2
          HEALTH=$(curl -fsS "https://caspa.ocrowley.com/health")
          echo "$HEALTH" | grep -q '"status":"ok"' || {
            echo "::error::Public /health is not healthy."
            exit 1
          }
          DOCTOR=$(curl -fsS "https://caspa.ocrowley.com/api/doctor")
          echo "$DOCTOR" | grep -q '"success":true' || {
            echo "::error::Public /api/doctor is not serving Caspa."
            echo "$DOCTOR" | head -c 800
            exit 1
          }
          echo "$DOCTOR" | grep -q '"ready"' || {
            echo "::error::Public /api/doctor is missing readiness."
            echo "$DOCTOR" | head -c 800
            exit 1
          }
          echo "$DOCTOR" | grep -q '"service"\|"gitSha"\|"builtAt"\|"aiProviders"\|"storage"' && {
            echo "::error::Public /api/doctor leaked deployment internals."
            exit 1
          }
          echo "Public Caspa is healthy and sanitised; private fingerprint verification passed on-host."
