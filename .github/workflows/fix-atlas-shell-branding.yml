name: Fix Atlas Shell Identity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-atlas-shell-branding.yml'

permissions:
  contents: write

jobs:
  repair-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply Atlas shell identity repair
        run: python3 scripts/fix-atlas-shell-branding.py
      - name: Test
        run: npm test
      - name: Production build
        run: npm run build
      - name: Assert Atlas public contract
        shell: bash
        run: |
          grep -q '/atlas-logo.svg' src/App.tsx
          grep -q 'NEXUS STRATEGIST' public/atlas-logo.svg
          grep -q 'atlas-mobile-upload' src/App.tsx
          ! grep -q 'Fast Data Upload' src/App.tsx
          grep -q '/api/atlas/knowledge' src/services/knowledgeClient.ts
          grep -q 'X-Atlas-Local-Scope' src/services/knowledgeClient.ts
          grep -q 'app.use("/api/atlas/knowledge"' server.ts
          grep -q "service: 'Atlas'" src/services/doctorService.ts
          grep -q 'ATLAS • Nexus Strategist' index.html
          grep -q '"service":"Atlas"' .github/workflows/deploy-atlas.yml
      - name: Commit verified repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name atlas-automation
          git config user.email atlas-automation@users.noreply.github.com
          git add src/App.tsx src/main.tsx index.html src/services/knowledgeClient.ts src/routes/caspa-knowledge-routes.ts server.ts src/services/doctorService.ts .github/workflows/deploy-atlas.yml
          git commit -m 'Restore Atlas identity and single mobile ingest'
          git push origin HEAD:main
