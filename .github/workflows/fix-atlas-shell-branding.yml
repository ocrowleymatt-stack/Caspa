name: Fix Atlas Shell Identity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-atlas-shell-branding.yml'

permissions:
  contents: write

jobs:
  repair-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tighten repair-script duplicate checks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/fix-atlas-shell-branding.py')
          s = p.read_text()
          old = "if 'Fast Data Upload' in s:\n    raise SystemExit('Fast Data Upload still present in App.tsx after repair')"
          new = "if 'fastUploadRef' in s or 'onFastUpload=' in s:\n    raise SystemExit('Launchpad upload wiring still present in App.tsx after repair')"
          if old in s:
              s = s.replace(old, new, 1)

          marker = "# Atlas brand kicker on launch screen."
          if 'old_footer_upload = ' not in s:
              footer_patch = r'''# Remove the second launchpad upload entry point from the sticky footer too.
          old_footer_upload = ''' + "'''" + r'''            <button
              type="button"
              onClick={() => fastUploadRef.current?.click()}
              disabled={fastUploading}
              style={{ ...ghostButton, color: '#ffe2a5', borderColor: '#6b5430', background: '#21180f' }}
            >
              <UploadCloud size={17} /> Fast Data Upload
            </button>
''' + "'''" + r'''
          if old_footer_upload in s:
              s = s.replace(old_footer_upload, '', 1)

          '''
              if marker not in s:
                  raise SystemExit('Atlas launch brand marker not found in repair script')
              s = s.replace(marker, footer_patch + marker, 1)
          p.write_text(s)
          PY
      - name: Apply Atlas shell identity repair
        run: python3 scripts/fix-atlas-shell-branding.py
      - name: Test
        run: npm test
      - name: Production build
        run: npm run build
      - name: Assert Atlas public contract
        shell: bash
        run: |
          grep -q '/atlas-logo.svg' src/App.tsx
          grep -q 'NEXUS STRATEGIST' public/atlas-logo.svg
          grep -q 'atlas-mobile-upload' src/App.tsx
          ! grep -q 'fastUploadRef' src/App.tsx
          ! grep -q 'onFastUpload=' src/App.tsx
          grep -q '/api/atlas/knowledge' src/services/knowledgeClient.ts
          grep -q 'X-Atlas-Local-Scope' src/services/knowledgeClient.ts
          grep -q 'app.use("/api/atlas/knowledge"' server.ts
          grep -q "service: 'Atlas'" src/services/doctorService.ts
          grep -q 'ATLAS • Nexus Strategist' index.html
          grep -q '"service":"Atlas"' .github/workflows/deploy-atlas.yml
      - name: Commit verified repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name atlas-automation
          git config user.email atlas-automation@users.noreply.github.com
          git add scripts/fix-atlas-shell-branding.py src/App.tsx src/main.tsx index.html src/services/knowledgeClient.ts src/routes/caspa-knowledge-routes.ts server.ts src/services/doctorService.ts .github/workflows/deploy-atlas.yml
          git commit -m 'Restore Atlas identity and single mobile ingest'
          git push origin HEAD:main
