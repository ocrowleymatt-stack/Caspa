name: Recover Atlas Final QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-final-qa.yml'
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
      JOB_ID: 3f246dc4-9b68-41f3-9867-b4c33c71e0d5
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATEKEY2"
          mkdir -p ~/.ssh
          printf '%s\n' "$PRIVATEKEY2" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Recover Final QA status
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 80); do
            BODY=$(ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" "curl -fsS 'http://127.0.0.1:3000/api/caspa/gold/jobs/${JOB_ID}'")
            printf '%s' "$BODY" > atlas-job-status.json
            STATUS=$(printf '%s' "$BODY" | python3 -c 'import sys,json; print((json.load(sys.stdin).get("data") or {}).get("status",""))')
            STAGE=$(printf '%s' "$BODY" | python3 -c 'import sys,json; print((json.load(sys.stdin).get("data") or {}).get("stage",""))')
            echo "[$i] ${STATUS:-unknown} :: ${STAGE:-unknown}"
            if [ "$STATUS" = "complete" ]; then
              printf '%s' "$BODY" | python3 -m json.tool
              exit 0
            fi
            if [ "$STATUS" = "failed" ]; then
              printf '%s' "$BODY" | python3 -m json.tool
              exit 1
            fi
            sleep 15
          done
          echo 'Atlas job is still processing after 20 minutes; no repair or retry was re-run.'
          exit 2

      - name: Export existing Final QA artefact
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" "python3 - <<'PY'
          import json, pathlib
          job_id = '3f246dc4-9b68-41f3-9867-b4c33c71e0d5'
          p = pathlib.Path('/root/Caspa/data/caspa-jobs.json')
          d = json.loads(p.read_text())
          j = next(x for x in d['jobs'] if x['id'] == job_id)
          r = j.get('result') or {}
          text = r.get('artefact') or r.get('finalText')
          chapters = r.get('chapters') or (j.get('checkpoint') or {}).get('chapters') or []
          chapters = sorted(chapters, key=lambda x: x.get('order', 0))
          if not text and chapters:
              text = '\n\n'.join('# ' + str(c.get('title','')) + '\n\n' + str(c.get('content','')) for c in chapters)
          if not text:
              raise SystemExit('Final QA is complete but no manuscript artefact/finalText/chapters were found')
          out = pathlib.Path('/root/Caspa/exports/chemsex-guide-final-qa.md')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(text)
          print(out, len(text.split()), 'words')
          PY"
          scp -o BatchMode=yes -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}:/root/Caspa/exports/chemsex-guide-final-qa.md" ./chemsex-guide-final-qa.md

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-final-qa-recovery
          path: |
            atlas-job-status.json
            chemsex-guide-final-qa.md
          if-no-files-found: warn
          retention-days: 7
