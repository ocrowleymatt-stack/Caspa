name: Inspect Live Commission

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-live-commission.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: Select SSH key
        shell: bash
        run: |
          set -euo pipefail
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY DEPLOY_SSH_KEY SERVER_SSH_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; echo "Using $name"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Host and process health
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" \
            "echo '=== HOST ==='; uptime; free -h; df -h /; echo '=== PM2 ==='; pm2 status || true; echo '=== DOCTOR ==='; curl -fsS http://127.0.0.1:3000/api/doctor || true; echo"

      - name: Recent Commission jobs
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" \
            "cd /root/Caspa && node -e 'const fs=require(\"fs\"); const o=JSON.parse(fs.readFileSync(\"data/caspa-jobs.json\",\"utf8\")); const jobs=Array.isArray(o)?o:(o.jobs||[]); const rows=jobs.filter(j=>j.type===\"commission\").sort((a,b)=>String(b.updatedAt||\"\").localeCompare(String(a.updatedAt||\"\"))).slice(0,12).map(j=>{const cp=j.checkpoint||{}, ch=cp.chapters||[], r=j.result||{}, inp=j.input||{}; return {id:j.id,status:j.status,progress:j.progress,stage:j.stage,updatedAt:j.updatedAt,error:j.error,checkpointPhase:cp.phase,checkpointChapters:ch.length,checkpointWords:ch.reduce((n,c)=>n+String(c.content||\"\").trim().split(/\\s+/).filter(Boolean).length,0),resultWords:r.words,targetWords:r.targetWords,publicationReady:r.publicationReady,qaHold:r.qaHold,repairOnly:inp.repairOnly,repairSourceJobId:inp.repairSourceJobId};}); for(const x of rows) console.log(JSON.stringify(x));'"

      - name: Recent app errors
        if: always()
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" \
            "echo '=== ERROR LOGS ==='; for f in /root/.pm2/logs/*error*.log; do [ -f \"\$f\" ] || continue; echo --- \"\$f\" ---; tail -n 160 \"\$f\" | grep -E -i 'error|exception|timeout|abort|heap|memory|failed|ECONN|429|5[0-9][0-9]|commission|qa' | tail -n 80 || true; done; echo '=== OUTPUT LOGS ==='; for f in /root/.pm2/logs/*out*.log; do [ -f \"\$f\" ] || continue; echo --- \"\$f\" ---; tail -n 160 \"\$f\" | grep -E -i 'commission|qa|job|timeout|failed|restart|ready|listening' | tail -n 80 || true; done"
