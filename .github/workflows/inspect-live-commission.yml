name: Inspect Live Commission

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-live-commission.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: Select SSH key
        shell: bash
        run: |
          set -euo pipefail
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY DEPLOY_SSH_KEY SERVER_SSH_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; echo "Using $name"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Host and process health
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" \
            "echo '=== HOST ==='; uptime; free -h; df -h /; echo '=== PM2 ==='; pm2 status || true; echo '=== DOCTOR ==='; curl -fsS http://127.0.0.1:3000/api/doctor || true; echo"

      - name: Recent Commission jobs
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" \
            "python3 -c \"import json,pathlib; p=pathlib.Path('/root/Caspa/data/caspa-jobs.json'); o=json.loads(p.read_text()); jobs=o.get('jobs',[]) if isinstance(o,dict) else o; rows=[];\nfor j in sorted([x for x in jobs if x.get('type')=='commission'], key=lambda x:x.get('updatedAt',''), reverse=True)[:12]:\n cp=j.get('checkpoint') or {}; ch=cp.get('chapters') or []; r=j.get('result') or {}; inp=j.get('input') or {}; rows.append({'id':j.get('id'),'status':j.get('status'),'progress':j.get('progress'),'stage':j.get('stage'),'updatedAt':j.get('updatedAt'),'error':j.get('error'),'checkpointPhase':cp.get('phase'),'checkpointChapters':len(ch),'checkpointWords':sum(len((c.get('content') or '').split()) for c in ch),'resultWords':r.get('words'),'targetWords':r.get('targetWords'),'publicationReady':r.get('publicationReady'),'qaHold':r.get('qaHold'),'repairOnly':inp.get('repairOnly'),'repairSourceJobId':inp.get('repairSourceJobId')});\nprint('\\n'.join(json.dumps(x) for x in rows))\""

      - name: Recent app errors
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" \
            "echo '=== ERROR LOGS ==='; for f in /root/.pm2/logs/*error*.log; do [ -f \"\$f\" ] || continue; echo --- \"\$f\" ---; tail -n 120 \"\$f\" | grep -E -i 'error|exception|timeout|abort|heap|memory|failed|ECONN|429|5[0-9][0-9]|commission|qa' | tail -n 60 || true; done; echo '=== OUTPUT LOGS ==='; for f in /root/.pm2/logs/*out*.log; do [ -f \"\$f\" ] || continue; echo --- \"\$f\" ---; tail -n 120 \"\$f\" | grep -E -i 'commission|qa|job|timeout|failed|restart|ready|listening' | tail -n 60 || true; done"
