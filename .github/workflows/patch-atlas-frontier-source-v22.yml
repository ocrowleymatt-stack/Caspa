name: Patch Atlas Frontier Source v2.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-atlas-frontier-source-v22.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch persistent frontier source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/repair-atlas-frontier-multiprovider.py')
          s=p.read_text()
          s=s.replace('MARKER = "ATLAS MULTI-PROVIDER FRONTIER v2.1"','MARKER = "ATLAS MULTI-PROVIDER FRONTIER v2.2"',1)
          s=s.replace('version: 2.1.0','version: 2.2.0',1)
          s=s.replace('description: Venice-primary multi-provider Atlas frontier bridge with canonical cloud failover and local Qwen as final fail-soft.','description: Multi-provider Atlas frontier bridge with mandatory provider-native live search whenever web retrieval is requested and local Qwen as final fail-soft.',1)
          s=s.replace('# ATLAS MULTI-PROVIDER FRONTIER v2.1','# ATLAS MULTI-PROVIDER FRONTIER v2.2\n# ATLAS RESEARCH WEB EXECUTION v1',1)
          old='''        # OpenWebUI has already performed SearXNG retrieval when web_search is enabled.\n        # Avoid paying the latency cost twice for Luna/Terra; Sol keeps provider-native\n        # search as a corroborating second retrieval pass.\n        provider_web = bool(use_web and selected.endswith("sol"))\n        prompt = self._prompt(body)\n'''
          new='''        # ATLAS RESEARCH WEB EXECUTION v1\n        # Do not assume OpenWebUI retrieval has already executed. A requested web\n        # search must reach AtlasRouter, whose capability gate restricts execution\n        # to Venice/Grok/Gemini. This makes Terra/Research genuinely live as well\n        # as Sol/Deep Research.\n        provider_web = bool(use_web)\n        prompt = self._prompt(body)\n        if use_web:\n            prompt = (\n                "[ATLAS LIVE-RETRIEVAL CONTRACT]\\n"\n                "Current/public-source web retrieval is required for this request. "\n                "Use the provider-native search path and base material claims on retrieved sources. "\n                "Do not claim that web/OSINT tools are unavailable merely because unrelated tool schemas are present. "\n                "If retrieval itself fails, state that as an execution failure rather than substituting model memory.\\n\\n"\n                + prompt\n            )\n'''
          if old not in s:
              raise SystemExit('frontier source web block not found')
          s=s.replace(old,new,1)
          s=s.replace(' + (" · provider corroboration" if provider_web else "")',' + (" · provider live search" if provider_web else "")',1)
          s=s.replace('meta_obj["atlas_multi_provider_frontier"] = "v2"','meta_obj["atlas_multi_provider_frontier"] = "v2.2"\nmeta_obj["atlas_research_web_execution"] = "v1"',1)
          s=s.replace("assert 'PRIMARY_PROVIDER: str = Field(default=\"venice\")' in code", "assert 'PRIMARY_PROVIDER: str = Field(default=\"venice\")' in code\nassert 'ATLAS RESEARCH WEB EXECUTION v1' in code\nassert 'provider_web = bool(use_web)' in code\nassert 'provider_web = bool(use_web and selected.endswith(\"sol\"))' not in code",1)
          p.write_text(s)
          PY
          grep -F 'ATLAS MULTI-PROVIDER FRONTIER v2.2' scripts/repair-atlas-frontier-multiprovider.py
          grep -F '        provider_web = bool(use_web)' scripts/repair-atlas-frontier-multiprovider.py
          ! grep -F '        provider_web = bool(use_web and selected.endswith("sol"))' scripts/repair-atlas-frontier-multiprovider.py
      - name: Commit source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name atlas-automation
          git config user.email atlas-automation@users.noreply.github.com
          git add scripts/repair-atlas-frontier-multiprovider.py
          git commit -m 'Make Atlas frontier live-search contract persistent'
          git pull --rebase origin main
          git push origin HEAD:main
