name: Repair Atlas Auto social continuation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-atlas-tool-leak.yml'
      - 'scripts/repair-atlas-auto-social-continuation-v17.py'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - uses: actions/checkout@v4
      - name: Select SSH key
        shell: bash
        run: |
          test -n "$PRIVATEKEY2"
          mkdir -p ~/.ssh
          printf '%s\n' "$PRIVATEKEY2" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
      - name: Copy repair script
        shell: bash
        run: |
          scp -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 scripts/repair-atlas-auto-social-continuation-v17.py "${ATLAS_USER}@${ATLAS_HOST}:/root/repair-atlas-auto-v17.py"
      - name: Patch live OpenWebUI database
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'docker cp /root/repair-atlas-auto-v17.py atlas-openwebui:/tmp/repair-atlas-auto-v17.py && docker exec atlas-openwebui python3 /tmp/repair-atlas-auto-v17.py'
      - name: Restart OpenWebUI and verify health
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'docker restart atlas-openwebui >/dev/null; for i in $(seq 1 45); do curl -fsS http://127.0.0.1:3002/health >/dev/null && exit 0; sleep 2; done; exit 1'
      - name: Run exact routing regressions
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'docker cp /root/repair-atlas-auto-v17.py atlas-openwebui:/tmp/repair-atlas-auto-v17.py && docker exec atlas-openwebui python3 /tmp/repair-atlas-auto-v17.py --test'
