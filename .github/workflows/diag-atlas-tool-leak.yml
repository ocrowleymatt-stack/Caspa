name: Diagnose Atlas tool leak

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-atlas-tool-leak.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: Select SSH key
        shell: bash
        run: |
          test -n "$PRIVATEKEY2"
          mkdir -p ~/.ssh
          printf '%s\n' "$PRIVATEKEY2" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect live Atlas Auto function
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'docker exec -i atlas-openwebui python3 -' <<'PY'
          import sqlite3, json
          db='/app/backend/data/webui.db'
          con=sqlite3.connect(db)
          con.row_factory=sqlite3.Row
          cols=[r[1] for r in con.execute('pragma table_info("function")')]
          print('FUNCTION_COLUMNS', cols)
          rows=con.execute('select * from "function"').fetchall()
          print('FUNCTION_COUNT', len(rows))
          for row in rows:
              vals={c:row[c] for c in cols}
              joined='\n'.join(v for v in vals.values() if isinstance(v,str))
              if 'atlas' not in joined.lower():
                  continue
              print('\nFUNCTION_ROW')
              for c,v in vals.items():
                  if not isinstance(v,str):
                      print(c, repr(v)); continue
                  if c.lower() in {'content','valves','meta','params'} or len(v)>300:
                      print(c, 'LEN', len(v))
                  else:
                      print(c, v)
              for needle in ['class Pipe','def pipe','atlas-auto','atlas-research','_router_prompt','generate_chat_completion','reasoning','<think>','statusHistory','native tools','search_calendar_events']:
                  i=joined.lower().find(needle.lower())
                  if i>=0:
                      s=max(0,i-1000); e=min(len(joined),i+3500)
                      print('CONTEXT', needle, joined[s:e].replace('\x00',' '))
          PY
