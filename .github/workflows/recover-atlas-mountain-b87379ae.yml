name: Recover Atlas Mountain repaired release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/recover-atlas-mountain-b87379ae.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ATLAS_HOST: 116.202.24.63
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
    steps:
      - name: Inspect live auth gate
        shell: bash
        run: |
          set -euo pipefail
          key=''
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY DEPLOY_SSH_KEY SERVER_SSH_KEY; do
            if [ -n "${!name:-}" ]; then key="${!name}"; echo "identity=$name"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 root@"$ATLAS_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo 'openwebui_auth_status:'
          status="$(curl -sS -o /tmp/auth-body -w '%{http_code}' --max-time 5 http://127.0.0.1:3002/api/v1/auths/ || true)"
          echo "status=$status"
          python3 - <<'PY'
import json
p='/tmp/auth-body'
try:
    data=json.load(open(p))
    if isinstance(data, dict): print('body_keys=' + ','.join(sorted(data.keys())))
    elif isinstance(data, list): print('body_list_length=' + str(len(data)))
    else: print('body_type=' + type(data).__name__)
except Exception:
    print('body=non_json_or_empty')
PY
          rm -f /tmp/auth-body
          echo 'atlas_auth_related_nginx:'
          nginx -T 2>/dev/null | grep -n -E -C 7 'atlas\.ocrowley\.com|auth_request|127\.0\.0\.1:3002|api/v1/auths|auth-gateway' | head -n 500 || true
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
