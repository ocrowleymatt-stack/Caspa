name: Wire Knowledge Ingestion

on:
  push:
    branches: [main]
    paths:
      - 'scripts/wire-knowledge-ingestion.py'
      - '.github/workflows/wire-knowledge-ingestion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply integration patch
        run: python3 scripts/wire-knowledge-ingestion.py

      - name: Install and test
        run: |
          npm ci
          npm test
          npm run build
          git diff --check

      - name: Bootstrap Atlas media + embedding workers
        if: env.PRIVATEKEY2 != ''
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$PRIVATEKEY2" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            apt-get update -y
            DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
          fi
          if command -v ollama >/dev/null 2>&1; then
            ollama pull embeddinggemma
            curl -fsS http://127.0.0.1:11434/api/embed \
              -H 'Content-Type: application/json' \
              -d '{"model":"embeddinggemma","input":["Atlas knowledge smoke test"]}' \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("embeddings") and len(d["embeddings"][0]) > 10; print("embedding worker OK")'
          else
            echo 'Ollama not installed on host; lexical search will remain available.'
          fi
          ffmpeg -version | head -1
          REMOTE

      - name: Commit integrated product files
        run: |
          git config user.name 'atlas-automation'
          git config user.email 'atlas-automation@users.noreply.github.com'
          git add server.ts src/lib/firebase.ts src/components/SettingsStudio.tsx src/App.tsx .env.example .deploy-atlas-trigger
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
          else
            git commit -m 'Restore cloud corpus ingestion and semantic search'
            git push origin main
          fi
