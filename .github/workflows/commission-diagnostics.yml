name: Commission Diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/commission-diagnostics.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: Select SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$PRIVATEKEY2" > ~/.ssh/id_atlas
          chmod 600 ~/.ssh/id_atlas
          ssh-keyscan -H "$ATLAS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Inspect live job state and quota errors
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_atlas -o IdentitiesOnly=yes "$ATLAS_USER@$ATLAS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          BASE='http://127.0.0.1:3000'
          echo '--- health ---'
          curl -fsS "$BASE/health"; echo
          echo '--- publication status ---'
          curl -sS -w '\nHTTP %{http_code}\n' "$BASE/api/caspa/gold/publication-studio/status" || true
          echo '--- publication progress ---'
          curl -sS -w '\nHTTP %{http_code}\n' "$BASE/api/caspa/gold/publication-studio/progress" || true
          echo '--- recent jobs ---'
          curl -fsS "$BASE/api/caspa/gold/jobs" | python3 -c 'import sys,json; d=json.load(sys.stdin); jobs=(d.get("data") or {}).get("jobs",[]);\nfor j in jobs[:20]: print(json.dumps({k:j.get(k) for k in ["id","type","status","stage","progress","error","updatedAt"]},ensure_ascii=False))'
          echo '--- recovered job ---'
          curl -sS "$BASE/api/caspa/gold/jobs/5afbd817-fee6-46cd-aa26-2274bee58052"; echo
          echo '--- quota strings in recent caspa logs ---'
          pm2 logs caspa-server --lines 400 --nostream 2>&1 | grep -Ei 'quota|credit|billing|insufficient|out of' | tail -n 80 || true
          REMOTE
