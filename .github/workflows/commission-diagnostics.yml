name: Commission Diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/commission-diagnostics.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: Select SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$PRIVATEKEY2" > ~/.ssh/id_atlas
          chmod 600 ~/.ssh/id_atlas
          ssh-keyscan -H "$ATLAS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Retry retained checkpoint and verify recovery starts
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_atlas -o IdentitiesOnly=yes "$ATLAS_USER@$ATLAS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          JOB='0420dfe9-2899-491f-80ca-399369daddac'
          echo '--- build ---'
          curl -fsS http://127.0.0.1:3000/health
          echo
          echo '--- before ---'
          curl -fsS "http://127.0.0.1:3000/api/caspa/gold/jobs/$JOB" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s).data; console.log(JSON.stringify({id:j.id,status:j.status,stage:j.stage,progress:j.progress,error:j.error,updatedAt:j.updatedAt},null,2))})"
          echo '--- retry ---'
          curl -fsS -X POST "http://127.0.0.1:3000/api/caspa/gold/jobs/$JOB/retry"
          echo
          sleep 5
          echo '--- after ---'
          curl -fsS "http://127.0.0.1:3000/api/caspa/gold/jobs/$JOB" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s).data; console.log(JSON.stringify({id:j.id,status:j.status,stage:j.stage,progress:j.progress,error:j.error,updatedAt:j.updatedAt},null,2))})"
          REMOTE
