# Temporary operational workflow. Do not merge.
name: Apply Atlas v12 static root fix

on:
  push:
    branches: [chatgpt/apply-v12-static-root]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-atlas-v12-static-root.yml'

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ATLAS_HOST: 116.202.24.63
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Select live server identity
        shell: bash
        run: |
          set -euo pipefail
          key=''
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY DEPLOY_SSH_KEY SERVER_SSH_KEY; do
            if [ -n "${!name:-}" ]; then key="${!name}"; echo "identity=$name"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Apply merged deployment bridge and inspect effective path
        shell: bash
        run: |
          set -euo pipefail
          remote=/tmp/atlas-mountain-v12-root-fix
          ssh -i ~/.ssh/id_ed25519 root@"$ATLAS_HOST" "rm -rf '$remote' && mkdir -p '$remote'"
          scp -i ~/.ssh/id_ed25519 -r deployment/atlas-mountain-oidc/. root@"$ATLAS_HOST":"$remote/"
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 root@"$ATLAS_HOST" \
            "bash '$remote/bootstrap.sh' '$remote' && rm -rf '$remote'"

          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 root@"$ATLAS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo 'installed_snippet:'
          sed -n '1,180p' /etc/nginx/snippets/atlas-mountain-v12.conf
          echo 'fixed_source:'
          sed -n '1,180p' /root/AtlasMountainDeploy/nginx-app.conf
          echo 'effective_v12_locations:'
          nginx -T 2>/dev/null | grep -n -E 'server_name.*atlas\.ocrowley\.com|location (=|\^~ )?/v12|atlas-mountain-v12|auth_request' | tail -n 80 || true
          echo 'filesystem:'
          ls -ld /var/www/atlas-mountain /var/www/atlas-mountain/v12
          ls -l /var/www/atlas-mountain/v12/index.html
          echo 'local_host_header_response:'
          curl -ksS -D - -o /tmp/v12-body --resolve atlas.ocrowley.com:443:127.0.0.1 https://atlas.ocrowley.com/v12/ | head -n 30
          echo "local_body_bytes=$(wc -c </tmp/v12-body)"
          echo 'public_response:'
          curl -ksS -D - -o /tmp/v12-public https://atlas.ocrowley.com/v12/ | head -n 30
          echo "public_body_bytes=$(wc -c </tmp/v12-public)"
          REMOTE

      - name: Verify static UI and API boundary
        shell: bash
        run: |
          set -euo pipefail
          ui_status="$(curl -ksS -o /tmp/v12.html -w '%{http_code}' --max-time 10 https://atlas.ocrowley.com/v12/)"
          api_status="$(curl -ksS -o /dev/null -w '%{http_code}' --max-time 10 https://atlas.ocrowley.com/v12/api/models || true)"
          echo "v12_ui=$ui_status"
          echo "v12_api_anon=$api_status"
          case "$api_status" in 401|403) ;; *) exit 1 ;; esac

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519 /tmp/v12.html
