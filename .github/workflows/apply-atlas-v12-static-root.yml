# Temporary operational workflow. Do not merge.
name: Apply Atlas v12 static root fix

on:
  push:
    branches: [chatgpt/apply-v12-static-root]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-atlas-v12-static-root.yml'

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ATLAS_HOST: 116.202.24.63
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Select live server identity
        shell: bash
        run: |
          set -euo pipefail
          key=''
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY DEPLOY_SSH_KEY SERVER_SSH_KEY; do
            if [ -n "${!name:-}" ]; then key="${!name}"; echo "identity=$name"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Inspect live and staged Atlas paths
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 root@"$ATLAS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          target=/opt/atlas-mountain/releases/b44acd95658e0ccec845c0287674f6887d450bc6/apps/desktop/dist/index.html
          echo 'current_release:'
          readlink -f /opt/atlas-mountain/current || true
          echo 'staged_index:'
          stat -c 'mode=%a owner=%U group=%G size=%s path=%n' "$target"
          echo 'staged_path_walk:'
          namei -l "$target"
          echo 'staged_assets:'
          find "$(dirname "$target")/assets" -maxdepth 1 -type f -printf '%m %u %g %f\n' | sort | head -n 20
          echo 'nginx_identity:'
          ps -o user=,group=,comm= -C nginx | head -n 10 || true
          echo 'live_web_index:'
          stat -c 'mode=%a owner=%U group=%G size=%s path=%n' /var/www/atlas-mountain/v12/index.html
          namei -l /var/www/atlas-mountain/v12/index.html
          echo 'current_public_status:'
          curl -ksS -o /dev/null -w 'ui=%{http_code}\n' --max-time 10 https://atlas.ocrowley.com/v12/
          curl -ksS -o /dev/null -w 'api=%{http_code}\n' --max-time 10 https://atlas.ocrowley.com/v12/api/models || true
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
