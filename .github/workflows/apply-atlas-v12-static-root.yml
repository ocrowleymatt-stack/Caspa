# Temporary operational workflow. Do not merge.
name: Apply Atlas v12 static root fix

on:
  push:
    branches: [chatgpt/apply-v12-static-root]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-atlas-v12-static-root.yml'

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ATLAS_HOST: 116.202.24.63
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Select live server identity
        shell: bash
        run: |
          set -euo pipefail
          key=''
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY DEPLOY_SSH_KEY SERVER_SSH_KEY; do
            if [ -n "${!name:-}" ]; then key="${!name}"; echo "identity=$name"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Apply merged deployment bridge
        shell: bash
        run: |
          set -euo pipefail
          remote=/tmp/atlas-mountain-umask-fix
          ssh -i ~/.ssh/id_ed25519 root@"$ATLAS_HOST" "rm -rf '$remote' && mkdir -p '$remote'"
          scp -i ~/.ssh/id_ed25519 \
            deployment/atlas-mountain-oidc/bootstrap.sh \
            deployment/atlas-mountain-oidc/receiver.mjs \
            deployment/atlas-mountain-oidc/deploy.sh \
            deployment/atlas-mountain-oidc/atlas-mountain-deploy-receiver.service \
            deployment/atlas-mountain-oidc/atlas-mountain-nexus.service \
            deployment/atlas-mountain-oidc/nginx-app.conf \
            deployment/atlas-mountain-oidc/nginx-receiver.conf \
            root@"$ATLAS_HOST":"$remote/"
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 root@"$ATLAS_HOST" \
            "test -s '$remote/bootstrap.sh' && bash '$remote/bootstrap.sh' '$remote' && rm -rf '$remote'"

          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 root@"$ATLAS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          # A failed deployment may have left the experimental static snippet live.
          # Restore the now-merged stable snippet before the next OIDC promotion.
          install -o root -g root -m 0644 /root/AtlasMountainDeploy/nginx-app.conf /etc/nginx/snippets/atlas-mountain-v12.conf
          nginx -t >/dev/null
          systemctl reload nginx

          receiver_pid="$(systemctl show atlas-mountain-deploy-receiver.service -p MainPID --value)"
          test -n "$receiver_pid" && test "$receiver_pid" != 0
          grep -Eq '^Umask:[[:space:]]+0022$' "/proc/${receiver_pid}/status"
          systemctl is-active --quiet atlas-mountain-deploy-receiver.service
          systemctl is-active --quiet atlas-mountain-nexus.service
          curl -fsS --max-time 5 http://127.0.0.1:3016/health >/dev/null
          curl -fsS --max-time 5 http://127.0.0.1:43101/health >/dev/null

          ui="$(curl -ksS -o /tmp/v12-restored.html -w '%{http_code}' --max-time 10 https://atlas.ocrowley.com/v12/)"
          api="$(curl -ksS -o /dev/null -w '%{http_code}' --max-time 10 https://atlas.ocrowley.com/v12/api/models || true)"
          test "$ui" = 200
          case "$api" in 401|403) ;; *) exit 1 ;; esac
          echo 'receiver_umask=0022'
          echo "v12_ui=$ui"
          echo "v12_api_anon=$api"
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
