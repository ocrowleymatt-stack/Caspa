name: Repair Atlas Deep Research Resilience

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-atlas-deep-research-resilience.yml'
      - 'scripts/repair-atlas-deep-research-resilience.py'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - uses: actions/checkout@v4
      - name: Select SSH key
        shell: bash
        run: |
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
      - name: Install resilient Deep Research
        shell: bash
        run: |
          scp -i ~/.ssh/id_ed25519 scripts/repair-atlas-deep-research-resilience.py "${ATLAS_USER}@${ATLAS_HOST}:/tmp/repair-atlas-deep-research-resilience.py"
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          docker cp /tmp/repair-atlas-deep-research-resilience.py atlas-openwebui:/tmp/repair-atlas-deep-research-resilience.py
          docker exec atlas-openwebui python3 /tmp/repair-atlas-deep-research-resilience.py
          docker restart atlas-openwebui >/dev/null
          for i in $(seq 1 40); do
            if curl -fsS --max-time 3 http://127.0.0.1:3002/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS --max-time 5 http://127.0.0.1:3002/health
          docker exec -i atlas-openwebui python3 - <<'PY'
          import sqlite3
          con=sqlite3.connect('/app/backend/data/webui.db')
          row=con.execute("select content,is_active from function where id='atlas-deep-research-v21'").fetchone()
          assert row and int(row[1]) == 1
          code=str(row[0] or '')
          assert 'ATLAS DEEP RESEARCH RESILIENCE v2.2' in code
          assert '"terra-osint"' in code
          assert 'parallel workers unavailable; running one resilient live-research fallback' in code
          assert 'hostile gate unavailable' in code
          print('atlas_deep_research_resilience_live=v2.2')
          PY
          rm -f /tmp/repair-atlas-deep-research-resilience.py
          REMOTE
