# One-shot break-glass edge repair trigger: 2026-08-28T12:14Z reload-drain
name: Diagnose Atlas nginx edge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-atlas-nginx.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ATLAS_HOST: 116.202.24.63
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
    steps:
      - name: Select live server identity
        shell: bash
        run: |
          set -euo pipefail
          key=''
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY DEPLOY_SSH_KEY SERVER_SSH_KEY; do
            if [ -n "${!name:-}" ]; then key="${!name}"; break; fi
          done
          test -n "$key" || { echo 'No live server SSH credential is configured.' >&2; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Repair Atlas human edge in break-glass mode
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 root@"$ATLAS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          snippet=/etc/nginx/snippets/atlas-mountain-v12.conf
          test -s "$snippet"
          backup="${snippet}.pre-breakglass-$(date -u +%Y%m%dT%H%M%SZ)"
          cp -a "$snippet" "$backup"
          restore() {
            cp -a "$backup" "$snippet"
            nginx -t >/dev/null 2>&1 && systemctl reload nginx >/dev/null 2>&1 || true
          }
          trap 'rc=$?; if (( rc != 0 )); then restore; echo atlas_breakglass_edge_rollback=true >&2; fi; exit $rc' EXIT

          python3 - "$snippet" <<'PY'
          from pathlib import Path
          import sys
          path=Path(sys.argv[1])
          text=path.read_text(encoding='utf-8')
          needle='auth_request /__atlas_mountain_auth;'
          count=text.count(needle)
          if count < 3:
              raise SystemExit(f'expected at least 3 human auth_request directives, found {count}')
          text=text.replace(needle, 'auth_request off; # TEMPORARY BREAK-GLASS HUMAN ACCESS')
          if 'auth_request /__atlas_mountain_device_auth;' not in text:
              raise SystemExit('paired-device auth directive missing; refusing repair')
          path.write_text(text, encoding='utf-8')
          print(f'atlas_breakglass_human_auth_directives_disabled={count}')
          PY

          nginx -t
          before_workers="$(pgrep -d, -f 'nginx: worker process' || true)"
          systemctl reload nginx

          local_api=000; public_api=000; local_ui=000; public_ui=000
          for attempt in $(seq 1 15); do
            sleep 1
            local_api="$(curl -ksS --resolve atlas.ocrowley.com:443:127.0.0.1 -o /dev/null -w '%{http_code}' --max-time 4 -H 'Connection: close' https://atlas.ocrowley.com/v12/api/models || true)"
            public_api="$(curl -ksS -o /dev/null -w '%{http_code}' --max-time 4 -H 'Connection: close' https://atlas.ocrowley.com/v12/api/models || true)"
            local_ui="$(curl -ksS --resolve atlas.ocrowley.com:443:127.0.0.1 -o /dev/null -w '%{http_code}' --max-time 4 -H 'Connection: close' https://atlas.ocrowley.com/v12/ || true)"
            public_ui="$(curl -ksS -o /dev/null -w '%{http_code}' --max-time 4 -H 'Connection: close' https://atlas.ocrowley.com/v12/ || true)"
            echo "atlas_breakglass_reload_probe=${attempt}:${local_api},${public_api},${local_ui},${public_ui}"
            if [[ "$local_api" == 200 && "$public_api" == 200 && "$local_ui" == 200 && "$public_ui" == 200 ]]; then
              break
            fi
          done

          direct_api="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 http://127.0.0.1:43101/api/models || true)"
          device_bridge="$(curl -ksS -X POST -o /dev/null -w '%{http_code}' --max-time 8 https://atlas.ocrowley.com/v12/device-bridge/device/not-a-device/poll || true)"
          device_api="$(curl -ksS -o /dev/null -w '%{http_code}' --max-time 8 https://atlas.ocrowley.com/v12/device-api/models || true)"
          after_workers="$(pgrep -d, -f 'nginx: worker process' || true)"

          echo "atlas_breakglass_probe=direct_api:${direct_api},local_api:${local_api},public_api:${public_api},local_ui:${local_ui},public_ui:${public_ui},device_bridge:${device_bridge},device_api:${device_api}"
          echo "atlas_nginx_worker_generation_changed=$([[ "$before_workers" != "$after_workers" ]] && echo true || echo false)"
          [[ "$direct_api" == 200 ]]
          [[ "$local_api" == 200 ]]
          [[ "$public_api" == 200 ]]
          [[ "$local_ui" == 200 ]]
          [[ "$public_ui" == 200 ]]
          [[ "$device_bridge" == 401 ]]
          case "$device_api" in 401|403) ;; *) echo "device API protection failed: $device_api" >&2; exit 1 ;; esac

          trap - EXIT
          echo atlas_breakglass_edge_live=true
          echo "atlas_breakglass_backup=$backup"
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
