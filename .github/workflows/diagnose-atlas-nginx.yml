# One-shot recovery probe trigger: 2026-08-28T12:13Z outer-edge
name: Diagnose Atlas nginx edge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-atlas-nginx.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ATLAS_HOST: 116.202.24.63
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
    steps:
      - name: Select live server identity
        shell: bash
        run: |
          set -euo pipefail
          key=''
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY DEPLOY_SSH_KEY SERVER_SSH_KEY; do
            if [ -n "${!name:-}" ]; then key="${!name}"; break; fi
          done
          test -n "$key" || { echo 'No live server SSH credential is configured.' >&2; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Inspect Atlas outer nginx edge
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 root@"$ATLAS_HOST" 'python3 -' <<'PY'
          from pathlib import Path
          import re, subprocess

          p=Path('/etc/nginx/conf.d/auth-gateway.conf')
          text=p.read_text(errors='replace') if p.exists() else ''

          def blocks(source):
              for m in re.finditer(r'\bserver\s*\{', source):
                  start=m.start(); brace=source.find('{',start); depth=0; quote=None; esc=False; comment=False
                  for i in range(brace,len(source)):
                      ch=source[i]
                      if comment:
                          if ch=='\n': comment=False
                          continue
                      if quote:
                          if esc: esc=False
                          elif ch=='\\': esc=True
                          elif ch==quote: quote=None
                          continue
                      if ch=='#': comment=True; continue
                      if ch in ('"',"'"): quote=ch; continue
                      if ch=='{': depth+=1
                      elif ch=='}':
                          depth-=1
                          if depth==0:
                              yield source[start:i+1]
                              break

          print('atlas_outer_edge_diag_begin')
          print('auth_gateway_exists='+str(p.exists()).lower())
          for block in blocks(text):
              if 'atlas.ocrowley.com' not in block:
                  continue
              for line in block.splitlines():
                  low=line.lower()
                  if any(term in low for term in ('server_name','include ','auth_request','error_page 401','proxy_pass','location = /','location ^~ /v12','location = /v12','43105','43101')):
                      if any(secret in low for secret in ('authorization','token','password','secret','ssl_certificate_key')):
                          continue
                      print(line[:1200])

          print('--- recent_atlas_nginx_errors ---')
          log=Path('/var/log/nginx/error.log')
          if log.exists():
              for raw in log.read_text(errors='replace').splitlines()[-2000:]:
                  low=raw.lower()
                  if ('atlas.ocrowley.com' in low or '43105' in low or 'auth request' in low or 'auth_request' in low or '/v12/' in low) and ('12:11:' in raw or '12:10:' in raw or '12:12:' in raw):
                      line=re.sub(r'(?i)(authorization|token|secret|password)[=: ]+[^ ,;]+', r'\1=[redacted]', raw)
                      print(line[:1500])

          for name,url,extra in [
              ('direct','http://127.0.0.1:43101/api/models',[]),
              ('local','https://atlas.ocrowley.com/v12/api/models',['--resolve','atlas.ocrowley.com:443:127.0.0.1','-k']),
              ('public','https://atlas.ocrowley.com/v12/api/models',['-k']),
          ]:
              r=subprocess.run(['curl','-sS','-o','/dev/null','-w','%{http_code}','--max-time','8',*extra,url],capture_output=True,text=True)
              print(f'probe_{name}={r.stdout.strip() or "000"}')
          print('atlas_outer_edge_diag_end')
          PY

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
