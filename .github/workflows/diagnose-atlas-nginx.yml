# One-shot recovery probe trigger: 2026-08-28 service-failure-context
name: Diagnose Atlas nginx edge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-atlas-nginx.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ATLAS_HOST: 116.202.24.63
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
    steps:
      - name: Select live server identity
        shell: bash
        run: |
          set -euo pipefail
          key=''
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY DEPLOY_SSH_KEY SERVER_SSH_KEY; do
            if [ -n "${!name:-}" ]; then key="${!name}"; break; fi
          done
          test -n "$key" || { echo 'No live server SSH credential is configured.' >&2; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Inspect Atlas edge and Nexus service
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 root@"$ATLAS_HOST" 'python3 -' <<'PY'
          from __future__ import annotations
          import re
          import subprocess
          from pathlib import Path

          def run(args):
              return subprocess.run(args, capture_output=True, text=True)

          print('atlas_recovery_diag_begin')
          current=Path('/opt/atlas-mountain/current')
          try:
              print('current_release='+str(current.resolve()).rsplit('/',1)[-1])
          except Exception as exc:
              print('current_release_error='+type(exc).__name__)

          status=run(['systemctl','is-active','atlas-mountain-nexus.service'])
          print('nexus_service_active='+status.stdout.strip())
          show=run(['systemctl','show','atlas-mountain-nexus.service','-p','Result','-p','ExecMainStatus','-p','ExecStartPost'])
          for line in show.stdout.splitlines():
              if line.startswith(('Result=','ExecMainStatus=','ExecStartPost=')):
                  print(line[:1200])

          unit=run(['systemctl','cat','atlas-mountain-nexus.service'])
          print('--- nexus_unit_auth_controls ---')
          for line in unit.stdout.splitlines():
              if any(key in line for key in ('NEXUS_NATIVE_AUTH_ENABLED','NEXUS_OPENWEBUI_AUTH_BASE_URL','NEXUS_AUTH_MODE','ExecStartPost','ExecStart=')):
                  print(line[:1000])

          probes=[
              ('direct_health','http://127.0.0.1:43101/health',[]),
              ('direct_api','http://127.0.0.1:43101/api/models',[]),
              ('local_api','https://atlas.ocrowley.com/v12/api/models',['--resolve','atlas.ocrowley.com:443:127.0.0.1','-k']),
              ('public_api','https://atlas.ocrowley.com/v12/api/models',['-k']),
              ('local_ui','https://atlas.ocrowley.com/v12/',['--resolve','atlas.ocrowley.com:443:127.0.0.1','-k']),
              ('public_ui','https://atlas.ocrowley.com/v12/',['-k']),
              ('device_bridge','https://atlas.ocrowley.com/v12/device-bridge/device/not-a-device/poll',['-k','-X','POST']),
          ]
          for name,url,extra in probes:
              p=run(['curl','-sS','-o','/dev/null','-w','%{http_code}','--max-time','8',*extra,url])
              print(f'probe_{name}={p.stdout.strip() or "000"}')

          journal=run(['journalctl','-u','atlas-mountain-nexus.service','--since','2026-08-28 11:44:00 UTC','--no-pager','-n','180'])
          print('--- nexus_recent_failures ---')
          for raw in journal.stdout.splitlines():
              low=raw.lower()
              if any(term in low for term in ('failed','failure','error','gate','permission denied','read-only','no such file','status=')):
                  line=re.sub(r'(?i)(authorization|token|secret|password|api[_-]?key)[=: ]+[^ ,;]+', r'\1=[redacted]', raw)
                  print(line[:1400])
          print('atlas_recovery_diag_end')
          PY

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
