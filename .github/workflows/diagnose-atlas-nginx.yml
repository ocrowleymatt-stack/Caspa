# One-shot Atlas service startup diagnostic: 2026-08-28T12:59Z
name: Diagnose Atlas nginx edge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-atlas-nginx.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ATLAS_HOST: 116.202.24.63
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
    steps:
      - name: Select live server identity
        shell: bash
        run: |
          set -euo pipefail
          key=''
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY DEPLOY_SSH_KEY SERVER_SSH_KEY; do
            if [ -n "${!name:-}" ]; then key="${!name}"; break; fi
          done
          test -n "$key" || { echo 'No live server SSH credential is configured.' >&2; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Inspect failed Atlas service startup
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 root@"$ATLAS_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo '=== CURRENT RELEASE ==='
          readlink -f /opt/atlas-mountain/current || true
          echo '=== SERVICE STATUS ==='
          systemctl status atlas-mountain-nexus.service --no-pager -l || true
          echo '=== SERVICE UNIT ==='
          systemctl cat atlas-mountain-nexus.service --no-pager || true
          echo '=== FAILED START JOURNAL ==='
          journalctl -u atlas-mountain-nexus.service --since '2026-08-28 12:56:45 UTC' --until '2026-08-28 12:58:10 UTC' --no-pager -o short-iso | tail -n 220 || true
          echo '=== CURRENT PROBES ==='
          printf 'direct_api='; curl -sS -o /dev/null -w '%{http_code}\n' --max-time 5 http://127.0.0.1:43101/api/models || true
          printf 'public_api='; curl -ksS -o /dev/null -w '%{http_code}\n' --max-time 5 https://atlas.ocrowley.com/v12/api/models || true
          printf 'public_ui='; curl -ksS -o /dev/null -w '%{http_code}\n' --max-time 5 https://atlas.ocrowley.com/v12/ || true
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
