name: Diagnose Atlas native-auth edge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-atlas-native-auth-edge.yml'
      - 'deployment/atlas-mountain-oidc/diagnose-native-auth-edge.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ATLAS_HOST: 116.202.24.63
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Select live server identity
        shell: bash
        run: |
          set -euo pipefail
          key=''
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY DEPLOY_SSH_KEY SERVER_SSH_KEY; do
            if [ -n "${!name:-}" ]; then key="${!name}"; echo "live_server_identity=$name"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
      - name: Diagnose live Atlas edge
        shell: bash
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_ed25519 deployment/atlas-mountain-oidc/diagnose-native-auth-edge.sh root@"$ATLAS_HOST":/tmp/diagnose-atlas-native-auth-edge.sh
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 root@"$ATLAS_HOST" 'bash /tmp/diagnose-atlas-native-auth-edge.sh; status=$?; rm -f /tmp/diagnose-atlas-native-auth-edge.sh; exit $status'
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
