name: Deploy Atlas

# Production deploy to Hetzner Atlas (caspa.ocrowley.com).
# Manual dispatch requires confirm=deploy. A change to .deploy-atlas-trigger on main
# is also an explicit deployment request, allowing trusted repository automation to deploy.
# Requires a repository secret with the Atlas SSH private key.
# Preferred secret name: PRIVATEKEY2 (current), with legacy aliases retained.

on:
  push:
    branches:
      - main
    paths:
      - '.deploy-atlas-trigger'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type deploy to confirm Atlas production restart'
        required: true
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
      ATLAS_DIR: /root/Caspa
    steps:
      - name: Require confirmation
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.confirm }}" != "deploy" ]; then
            echo "Refusing: set confirm=deploy to run the Atlas deploy."
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Deploy authorised by .deploy-atlas-trigger change on main."
          fi

      - name: Select SSH key
        id: key
        shell: bash
        run: |
          key=""
          chosen=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY DEPLOY_SSH_KEY SERVER_SSH_KEY; do
            if [ -n "${!name}" ]; then
              key="${!name}"
              chosen="$name"
              break
            fi
          done
          if [ -z "$key" ]; then
            echo "::error::No Atlas SSH secret found. Add PRIVATEKEY2 (preferred) in repo Settings → Secrets, then re-run."
            exit 2
          fi
          echo "Using secret: $chosen"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
          echo "key_ready=1" >> "$GITHUB_OUTPUT"

      - name: Deploy origin/main on Atlas
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 \
            "${ATLAS_USER}@${ATLAS_HOST}" \
            "set -euo pipefail
             cd '${ATLAS_DIR}'
             git fetch origin
             git reset --hard origin/main
             git clean -fd -e data -e .env -e exports -e backups -e .caspa_snapshots
             export CASPA_GIT_SHA=\$(git rev-parse HEAD)
             export CASPA_GIT_BRANCH=\$(git rev-parse --abbrev-ref HEAD || echo main)
             export CASPA_BUILD_TIME=\$(date -u +%Y-%m-%dT%H:%M:%SZ)
             unset NODE_ENV || true
             npm ci
             export NODE_ENV=production
             export CASPA_DATA_DIR=/root/Caspa/data
             if grep -q '^CLOUD_TOKEN_ENCRYPTION_KEY=$' .env 2>/dev/null; then
               CLOUD_KEY=\$(openssl rand -hex 32)
               sed -i \"s|^CLOUD_TOKEN_ENCRYPTION_KEY=$|CLOUD_TOKEN_ENCRYPTION_KEY=\${CLOUD_KEY}|\" .env
             elif ! grep -q '^CLOUD_TOKEN_ENCRYPTION_KEY=' .env 2>/dev/null; then
               umask 077
               printf '\\nCLOUD_TOKEN_ENCRYPTION_KEY=%s\\n' \"\$(openssl rand -hex 32)\" >> .env
             fi
             grep -q '^ATLAS_PUBLIC_URL=' .env 2>/dev/null || printf 'ATLAS_PUBLIC_URL=https://caspa.ocrowley.com\\n' >> .env
             chmod 600 .env
             if grep -Eq '^(DROPBOX_APP_KEY|VITE_DROPBOX_APP_KEY)=.+' .env 2>/dev/null; then echo 'Dropbox offline OAuth: configured'; else echo 'Dropbox offline OAuth: NOT CONFIGURED'; fi
             if grep -Eq '^(GOOGLE_DRIVE_CLIENT_ID|GOOGLE_OAUTH_CLIENT_ID|GOOGLE_CLIENT_ID|VITE_GOOGLE_CLIENT_ID)=.+' .env 2>/dev/null && grep -Eq '^(GOOGLE_DRIVE_CLIENT_SECRET|GOOGLE_OAUTH_CLIENT_SECRET|GOOGLE_CLIENT_SECRET)=.+' .env 2>/dev/null; then echo 'Google Drive offline OAuth: configured'; else echo 'Google Drive offline OAuth: NOT CONFIGURED'; fi
             npm run build
             test -f dist/server.cjs
             test -f dist/index.html
             pm2 delete caspa caspa-server || true
             pm2 start ecosystem.config.cjs --update-env
             pm2 save
             if [ -f scripts/atlas-nginx-timeouts.sh ]; then
               bash scripts/atlas-nginx-timeouts.sh
             fi
             sleep 3
             curl -fsS http://127.0.0.1:3000/health
             echo
             curl -fsS http://127.0.0.1:3000/api/doctor
             echo"

      - name: Verify public fingerprint
        shell: bash
        run: |
          sleep 2
          DOCTOR=$(curl -fsS "https://caspa.ocrowley.com/api/doctor")
          echo "$DOCTOR" | grep -q '"service":"Caspa"' || {
            echo "::error::Public /api/doctor is not serving Caspa."
            echo "$DOCTOR" | head -c 800
            exit 1
          }
          echo "$DOCTOR" | grep -Fq "\"gitSha\":\"${GITHUB_SHA}\"" || {
            echo "::error::Public Atlas is not serving the commit just deployed. Expected ${GITHUB_SHA}."
            echo "$DOCTOR" | head -c 1200
            exit 1
          }
          echo "Public Atlas is serving expected commit ${GITHUB_SHA}:"
          echo "$DOCTOR" | head -c 1200
