name: Deploy verified Atlas R8 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-atlas-r6-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas2-production-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
      OUTER_SHA256: b0a5c3e41596e927df94a70b2129922b54b5608cf84f5366365f2149e94b51d6
      RELEASE_SHA256: 29c668cde56b5cca4c85d42d8511ce2d98f44de9142fc1610ab8b1bd097ef44c
      RELEASE_COMMIT: c622d7b93a9156eb38679b77a81ec0e8ee2ab2ab
      RELEASE_URL: 'https://sdmntprukwest.oaiusercontent.com/files/00000000-ffd8-8243-96d5-fdaefb52d0be/raw?se=2026-09-25T19%3A32%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=71ec989f-b56d-5416-8976-fc15404d3cbe&skoid=56822d8b-6cfd-42ed-a00d-1452dca42036&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T19%3A23%3A58Z&ske=2026-09-26T19%3A23%3A58Z&sks=b&skv=2026-02-06&sig=2yTYL/s3QKpcCKemdB2O3MHNi3MSVXZOxtK4Vu9i27o%3D'

    steps:
      - name: Download exact green release artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 2 "$RELEASE_URL" -o /tmp/atlas-r8-artifact.zip
          echo "$OUTER_SHA256  /tmp/atlas-r8-artifact.zip" | sha256sum -c -
          rm -rf /tmp/atlas-r8-artifact /tmp/atlas-release-src
          mkdir -p /tmp/atlas-r8-artifact /tmp/atlas-release-src
          unzip -q /tmp/atlas-r8-artifact.zip -d /tmp/atlas-r8-artifact
          echo "$RELEASE_SHA256  /tmp/atlas-r8-artifact/ATLAS_R8_25SEP2026.zip" | sha256sum -c -
          unzip -q /tmp/atlas-r8-artifact/ATLAS_R8_25SEP2026.zip -d /tmp/atlas-release-src
          tar -C /tmp/atlas-release-src -czf /tmp/atlas-release.tar.gz .
          sha256sum /tmp/atlas-release.tar.gz | tee /tmp/atlas-release.tar.gz.sha256
          cp /tmp/atlas-release-src/tools/deployment/update-private-release.py /tmp/update-private-release.py

      - name: Select SSH key
        shell: bash
        run: |
          set -euo pipefail
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY DEPLOY_SSH_KEY SERVER_SSH_KEY; do
            if [ -n "${!name:-}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Upload and activate
        shell: bash
        run: |
          set -euo pipefail
          scp -o BatchMode=yes -i ~/.ssh/id_ed25519 /tmp/atlas-release.tar.gz /tmp/update-private-release.py "${ATLAS_USER}@${ATLAS_HOST}:/tmp/"
          archive_sha="$(awk '{print $1}' /tmp/atlas-release.tar.gz.sha256)"
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}"             "python3 /tmp/update-private-release.py --archive /tmp/atlas-release.tar.gz --sha256 '$archive_sha' --commit '$RELEASE_COMMIT'"

      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'systemctl is-active --quiet atlas-unified.service && curl -fsS --max-time 10 http://127.0.0.1:3110/health'
          curl -fsS --max-time 15 https://atlas2.ocrowley.com/health
