name: Data Ingest Live Speed Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/data-ingest-live-speed-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Benchmark three-file fast ingest
        shell: bash
        run: |
          node <<'NODE'
          const base = 'https://caspa.ocrowley.com';
          const scope = `atlas-ingest-speed-${Date.now()}`;
          const marker = `SPEEDMARK-${Date.now()}`;
          const makeText = (index) => Array.from({ length: 2400 }, (_, n) =>
            `${marker} file ${index} paragraph ${n}. This is representative source material for the Atlas ingestion latency benchmark, with enough text to produce a meaningful chunk set.`
          ).join('\n\n');

          const started = Date.now();
          const jobs = [1, 2, 3].map(async (index) => {
            const form = new FormData();
            form.append('file', new Blob([makeText(index)], { type: 'text/plain' }), `speed-${index}.txt`);
            form.append('fileId', `${scope}-${index}`);
            form.append('deferEmbeddings', '1');
            const oneStarted = Date.now();
            const response = await fetch(`${base}/api/caspa/knowledge/ingest/file`, {
              method: 'POST',
              headers: { 'X-Caspa-Local-Scope': scope },
              body: form,
              signal: AbortSignal.timeout(30000),
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body.success === false) throw new Error(`file ${index}: ${response.status} ${body.message || ''}`);
            return {
              file: index,
              ms: Date.now() - oneStarted,
              chunks: body?.data?.chunkCount,
              vectorsAtReturn: body?.data?.vectorChunkCount,
              extractedChars: String(body?.data?.extractedText || '').length,
            };
          });
          const results = await Promise.all(jobs);
          const elapsedMs = Date.now() - started;

          const statusResponse = await fetch(`${base}/api/caspa/knowledge/status`, {
            headers: { 'X-Caspa-Local-Scope': scope },
            signal: AbortSignal.timeout(10000),
          });
          const statusBody = await statusResponse.json();
          const summary = { elapsedMs, results, status: statusBody?.data };
          console.log(JSON.stringify(summary, null, 2));

          if (results.some((r) => !r.chunks || r.vectorsAtReturn !== 0)) {
            throw new Error('Fast ingest did not return at lexical-registration stage');
          }
          if ((statusBody?.data?.sources || 0) !== 3) throw new Error('Expected three registered sources');
          if (elapsedMs > 12000) throw new Error(`Three-file foreground ingest exceeded 12s: ${elapsedMs}ms`);
          NODE
