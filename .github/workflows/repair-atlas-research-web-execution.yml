name: Repair Atlas Research Web Execution

on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair-atlas-research-web-execution.py'
      - '.github/workflows/repair-atlas-research-web-execution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - uses: actions/checkout@v4
      - name: Select SSH key
        shell: bash
        run: |
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
      - name: Install live Atlas research-web repair
        shell: bash
        run: |
          scp -i ~/.ssh/id_ed25519 scripts/repair-atlas-research-web-execution.py "${ATLAS_USER}@${ATLAS_HOST}:/tmp/repair-atlas-research-web-execution.py"
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          docker cp /tmp/repair-atlas-research-web-execution.py atlas-openwebui:/tmp/repair-atlas-research-web-execution.py
          docker exec atlas-openwebui python3 /tmp/repair-atlas-research-web-execution.py
          docker restart atlas-openwebui >/dev/null
          for i in $(seq 1 40); do
            if curl -fsS --max-time 3 http://127.0.0.1:3002/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS --max-time 5 http://127.0.0.1:3002/health

          echo '--- Verify model bindings and frontier contract ---'
          docker exec -i atlas-openwebui python3 - <<'PY'
          import sqlite3,json
          con=sqlite3.connect('/app/backend/data/webui.db')
          for mid in ('atlas-research','atlas-deep-research'):
              row=con.execute('select meta,is_active from model where id=?',(mid,)).fetchone()
              assert row and int(row[1]) == 1
              meta=json.loads(row[0] or '{}')
              ids=meta.get('toolIds') or []
              assert 'tool_searxng_search' in ids, (mid,ids)
              assert 'tool_perplexica_research' in ids, (mid,ids)
              assert 'web_search' in (meta.get('defaultFeatureIds') or []), meta
              print(mid,'web_tools=',ids)
          row=con.execute("select content from function where id='atlas-frontier-failover'").fetchone()
          code=str(row[0] or '')
          assert 'ATLAS RESEARCH WEB EXECUTION v1' in code
          assert 'provider_web = bool(use_web)' in code
          assert 'provider_web = bool(use_web and selected.endswith("sol"))' not in code
          print('frontier_web_all_tiers=true')
          PY

          echo '--- Verify private SearXNG backend really searches ---'
          docker exec -i atlas-openwebui python3 - <<'PY'
          import json,urllib.parse,urllib.request
          q=urllib.parse.urlencode({'q':'OpenAI August 2026','format':'json','language':'en-GB','categories':'general','safesearch':1})
          with urllib.request.urlopen('http://atlas-searxng:8080/search?'+q,timeout=30) as r:
              d=json.load(r)
          results=d.get('results') or []
          assert results, d
          print('searxng_live_results=',len(results),'first=',str(results[0].get('title') or '')[:120])
          PY

          echo '--- Verify AtlasRouter provider-native web execution ---'
          curl -fsS --max-time 90 \
            -H 'Content-Type: application/json' \
            -d '{"prompt":"Use live web search. State the current UTC date and cite at least one retrieved current source. Do not answer from model memory.","primaryProvider":"grok","useWebSearch":true,"intelligenceMode":"balanced","maxTokens":500}' \
            http://172.19.0.1:3014/api/ai/call >/tmp/atlas-research-web-smoke.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/atlas-research-web-smoke.json'))
          text=str(d.get('result') or '')
          assert d.get('service') == 'AtlasRouter', d
          assert d.get('provider') in ('grok','gemini','venice'), d
          assert text, d
          print('atlas_router_web_provider=',d.get('provider'))
          print('atlas_router_web_model=',d.get('model'))
          print('atlas_router_web_result=',text[:1200].replace('\n',' '))
          PY
          rm -f /tmp/repair-atlas-research-web-execution.py /tmp/atlas-research-web-smoke.json
          REMOTE
