name: Diagnose Atlas Auto Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-atlas-auto-runtime.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: Select SSH key
        shell: bash
        run: |
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect exact live research invocation
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== OPENWEBUI LOGS AROUND FAILED CHAT ==='
          docker logs atlas-openwebui --since '2026-08-12T19:20:00Z' --until '2026-08-12T19:35:00Z' 2>&1 | tail -n 1200 || true
          echo '=== ATLASROUTER LOGS AROUND FAILED CHAT ==='
          pm2 logs AtlasRouter --nostream --lines 500 2>&1 || true
          echo '=== CHAT RECORD SUMMARY ==='
          docker exec -i atlas-openwebui python3 - <<'PY'
          import sqlite3,json
          con=sqlite3.connect('/app/backend/data/webui.db'); con.row_factory=sqlite3.Row
          print('chat_schema',[r['name'] for r in con.execute('pragma table_info(chat)').fetchall()])
          cid='648fb510-63cd-4f88-819c-fb2d4a41b741'
          rows=con.execute('select * from chat where id=?',(cid,)).fetchall()
          print('chat_rows',len(rows))
          for r in rows:
              d=dict(r)
              for k,v in list(d.items()):
                  if isinstance(v,str) and len(v)>24000: d[k]=v[:24000]+'...[truncated]'
              print(json.dumps(d,ensure_ascii=False,default=str))
          print('=== LIVE FUNCTION CONTRACTS ===')
          for fid in ('atlas-auto','atlas-frontier-failover','atlas-public-source-research'):
              r=con.execute('select content,meta,is_active from function where id=?',(fid,)).fetchone()
              print('##',fid,'active=',r['is_active'] if r else None,'meta=',r['meta'] if r else None)
              if r:
                  for i,line in enumerate(str(r['content'] or '').splitlines(),1):
                      if any(x in line for x in ('generate_chat_completion','forwarded["model"]','web_search','provider_web','useWebSearch','bypass_filter','bypass_system_prompt','toolIds','tools')):
                          print(f'{i}: {line[:700]}')
          print('=== RESEARCH MODEL ===')
          r=con.execute("select id,base_model_id,params,meta,is_active from model where id='atlas-research'").fetchone()
          print(json.dumps(dict(r),ensure_ascii=False,default=str) if r else 'missing')
          PY
          echo '=== DIRECT ATLASROUTER EXACT-PROMPT SMOKE ==='
          curl -fsS --max-time 120 -H 'Content-Type: application/json' \
            -d '{"prompt":"OSINT search and create a background story with current info for Stuart A Hardman previously of Nottingham, previous partner of Scott Millard and now living in Walsall with Adam Walsh. Search current public web sources, cite retrieved URLs and distinguish identity matches from collisions.","primaryProvider":"grok","useWebSearch":true,"intelligenceMode":"balanced","maxTokens":1400}' \
            http://172.19.0.1:3014/api/ai/call | python3 -m json.tool | head -n 220 || true
          REMOTE
