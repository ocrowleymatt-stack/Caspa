name: Diagnose Atlas Research Tools

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-atlas-research-tools.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: Select SSH key
        shell: bash
        run: |
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect live model and tool bindings
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'docker exec -i atlas-openwebui python3 -' <<'PY'
          import sqlite3, json
          db='/app/backend/data/webui.db'
          con=sqlite3.connect(db)
          con.row_factory=sqlite3.Row
          def rows(q,args=()):
              try: return con.execute(q,args).fetchall()
              except Exception as e:
                  print('QUERY_ERROR',q,repr(e)); return []
          print('=== TABLES ===')
          for r in rows("select name from sqlite_master where type='table' order by name"):
              if any(k in r['name'].lower() for k in ('model','tool','function')): print(r['name'])
          print('\n=== MODEL SCHEMA ===')
          for t in ('model','models','tool','tools','function'):
              info=rows(f'pragma table_info({t})')
              if info:
                  print(t,[x['name'] for x in info])
          print('\n=== ATLAS RESEARCH MODEL ROWS ===')
          for t in ('model','models'):
              info=rows(f'pragma table_info({t})')
              cols=[x['name'] for x in info]
              if not cols: continue
              idcol='id' if 'id' in cols else None
              if not idcol: continue
              rr=rows(f"select * from {t} where id like 'atlas-research%' or id like 'atlas-deep-research%' order by id")
              for r in rr:
                  d=dict(r)
                  for k,v in list(d.items()):
                      if isinstance(v,str) and len(v)>4000: d[k]=v[:4000]+'...[truncated]'
                  print(t, json.dumps(d,ensure_ascii=False,default=str))
          print('\n=== ACTIVE FUNCTIONS SUMMARY ===')
          for r in rows("select id,name,is_active,meta from function where is_active=1 order by id"):
              print(json.dumps(dict(r),ensure_ascii=False,default=str))
          print('\n=== TOOLS ===')
          for t in ('tool','tools'):
              info=rows(f'pragma table_info({t})')
              if not info: continue
              rr=rows(f'select * from {t}')
              for r in rr:
                  d=dict(r)
                  for k,v in list(d.items()):
                      if isinstance(v,str) and len(v)>2500: d[k]=v[:2500]+'...[truncated]'
                  print(t,json.dumps(d,ensure_ascii=False,default=str))
          print('\n=== RESEARCH FUNCTION HEAD ===')
          for fid in ('atlas-frontier-failover','atlas-public-source-research','atlas-auto','atlas-deep-research-v21'):
              rr=rows('select id,name,is_active,content from function where id=?',(fid,))
              if rr:
                  code=str(rr[0]['content'] or '')
                  needles=('tools','web_search','generate_chat_completion','features','ROUTER_URL')
                  print('##',fid)
                  for i,line in enumerate(code.splitlines(),1):
                      if any(n in line for n in needles): print(f'{i}: {line[:500]}')
          PY
