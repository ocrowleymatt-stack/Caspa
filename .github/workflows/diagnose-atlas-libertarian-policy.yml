name: Diagnose Atlas Minimal-Intervention Policy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-atlas-libertarian-policy.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: Select SSH key
        shell: bash
        run: |
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect live policy text
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'docker exec -i atlas-openwebui python3 -' <<'PY'
          import sqlite3,re
          con=sqlite3.connect('/app/backend/data/webui.db')
          ids=['atlas-public-source-research','atlas-auto','atlas-deep-research-v21','atlas-frontier-failover']
          pat=re.compile(r'privacy|gdpr|private|refus|safety|safe|legal|lawful|boundary|policy|warning|harm',re.I)
          for fid in ids:
              row=con.execute('select content,is_active from function where id=?',(fid,)).fetchone()
              print('\n###',fid,'active=',row[1] if row else None)
              if not row: continue
              for i,line in enumerate(str(row[0] or '').splitlines(),1):
                  if pat.search(line): print(f'{i}: {line}')
          PY
