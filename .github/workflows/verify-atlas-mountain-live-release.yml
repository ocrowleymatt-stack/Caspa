name: Verify Atlas Mountain live release

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      ATLAS_HOST: 116.202.24.63
      EXPECTED_SHA: b87379ae8b74202cf183edddb3a887c2ef93612c
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
    steps:
      - name: Select live server identity
        shell: bash
        run: |
          set -euo pipefail
          key=''
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY DEPLOY_SSH_KEY SERVER_SSH_KEY; do
            if [ -n "${!name:-}" ]; then key="${!name}"; echo "identity=$name"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Wait for and verify deployed Mountain release
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 root@"$ATLAS_HOST" "EXPECTED_SHA='$EXPECTED_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          for _ in $(seq 1 90); do
            current=''
            if [ -L /opt/atlas-mountain/current ]; then
              current="$(basename "$(readlink -f /opt/atlas-mountain/current)")"
            fi
            if [ "$current" = "$EXPECTED_SHA" ] && systemctl is-active --quiet atlas-mountain-nexus.service; then
              break
            fi
            sleep 2
          done

          current="$(basename "$(readlink -f /opt/atlas-mountain/current 2>/dev/null || true)")"
          test "$current" = "$EXPECTED_SHA" || { echo "deployed_sha=$current"; exit 2; }
          systemctl is-active --quiet atlas-mountain-deploy-receiver.service
          systemctl is-active --quiet atlas-mountain-nexus.service
          nginx -t >/dev/null
          curl -fsS --max-time 5 http://127.0.0.1:3016/health >/dev/null
          curl -fsS --max-time 5 http://127.0.0.1:43101/health >/dev/null
          curl -fsS --max-time 5 http://127.0.0.1:3002/health >/dev/null
          test -s /var/www/atlas-mountain/v12/index.html
          echo "deployed_sha=$current"
          echo 'receiver_service=active'
          echo 'nexus_service=active'
          echo 'nexus_local_health=ok'
          echo 'nginx=valid'
          echo 'openwebui=healthy'
          REMOTE

      - name: Verify public Atlas Mountain and coexistence
        shell: bash
        run: |
          set -euo pipefail
          ui_status="$(curl -ksS -o /tmp/mountain-ui.html -w '%{http_code}' --max-time 10 https://atlas.ocrowley.com/v12/)"
          test "$ui_status" = 200
          grep -qi '<!doctype html' /tmp/mountain-ui.html
          api_status="$(curl -ksS -o /dev/null -w '%{http_code}' --max-time 10 https://atlas.ocrowley.com/v12/api/models)"
          case "$api_status" in 401|403) ;; *) echo "unexpected_api_status=$api_status"; exit 2 ;; esac
          curl -fsS --max-time 10 https://atlas.ocrowley.com/health >/dev/null
          echo "mountain_ui_status=$ui_status"
          echo "mountain_api_unauthenticated=$api_status"
          echo 'existing_atlas_public_health=ok'

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519 /tmp/mountain-ui.html
