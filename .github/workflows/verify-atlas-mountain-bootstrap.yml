name: Verify Atlas Mountain bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ATLAS_HOST: 116.202.24.63
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
    steps:
      - name: Select live server identity
        shell: bash
        run: |
          set -euo pipefail
          key=''
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY DEPLOY_SSH_KEY SERVER_SSH_KEY; do
            if [ -n "${!name:-}" ]; then key="${!name}"; echo "identity=$name"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Verify live receiver read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 root@"$ATLAS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          systemctl is-active --quiet atlas-mountain-deploy-receiver.service
          nginx -t >/dev/null
          curl -fsS --max-time 3 http://127.0.0.1:3016/health >/dev/null
          test -s /root/AtlasMountainDeploy/receiver.mjs
          test -x /root/AtlasMountainDeploy/deploy.sh
          test -s /etc/nginx/snippets/atlas-mountain-deploy-receiver.conf
          curl -fsS --max-time 5 http://127.0.0.1:3002/health >/dev/null
          echo 'receiver_service=active'
          echo 'receiver_local_health=ok'
          echo 'nginx=valid'
          echo 'openwebui=healthy'
          REMOTE

          status="$(curl -ksS -o /dev/null -w '%{http_code}' --max-time 8 -X POST -H 'Content-Type: application/json' --data '{}' https://atlas.ocrowley.com/__atlas_mountain_deploy/v1 || true)"
          test "$status" = 401
          curl -fsS --max-time 8 https://atlas.ocrowley.com/health >/dev/null
          echo "receiver_public_unauthenticated=$status"
          echo 'existing_atlas_public_health=ok'

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
