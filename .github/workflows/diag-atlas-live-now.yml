name: Check Atlas Live Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-atlas-live-now.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: Select SSH key
        shell: bash
        run: |
          test -n "$PRIVATEKEY2"
          mkdir -p ~/.ssh
          printf '%s\n' "$PRIVATEKEY2" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
      - name: Check live Atlas
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'python3 -' <<'PY'
          import json, urllib.request, time, subprocess

          def get(url, timeout=8):
              with urllib.request.urlopen(url, timeout=timeout) as r:
                  return r.status, json.load(r)

          status, health = get('http://172.19.0.1:3014/health')
          print('ROUTER_HTTP', status)
          print('ROUTER_HEALTH', json.dumps(health, ensure_ascii=False))
          assert status == 200
          assert health.get('service') == 'AtlasRouter'
          pr = health.get('parallelRetrieval') or {}
          assert pr.get('enabled') is True and pr.get('version') == 'v1', health

          status2, ow = get('http://127.0.0.1:3002/health')
          print('OPENWEBUI_HTTP', status2)
          print('OPENWEBUI_HEALTH', json.dumps(ow, ensure_ascii=False))
          assert status2 == 200

          payload=json.dumps({
              'prompt':'Use live web research. What is today\'s UTC date? Return the date and one source URL.',
              'primaryProvider':'grok',
              'useWebSearch':True,
              'useXSearch':False,
              'intelligenceMode':'speed',
              'taskHint':'factual',
              'maxTokens':300,
          }).encode()
          req=urllib.request.Request('http://172.19.0.1:3014/api/ai/call', data=payload, headers={'Content-Type':'application/json'})
          t=time.monotonic()
          with urllib.request.urlopen(req, timeout=60) as r:
              d=json.load(r)
          elapsed=time.monotonic()-t
          print('LIVE_WEB_SECONDS', round(elapsed,3))
          print('LIVE_WEB_PROVIDER', d.get('provider'), d.get('model'))
          print('LIVE_WEB_RETRIEVAL', json.dumps(d.get('retrieval') or {}, ensure_ascii=False))
          print('LIVE_WEB_RESULT', str(d.get('result') or '')[:900].replace('\n',' '))
          assert d.get('service') == 'AtlasRouter'
          assert len(str(d.get('result') or '')) > 40
          assert (d.get('retrieval') or {}).get('mode') in {'parallel-tavily-prefetch','native-provider-web-fallback','native-provider-web-recovery'}

          ps=subprocess.run(['pm2','jlist'],capture_output=True,text=True,check=True)
          rows=json.loads(ps.stdout)
          atlas=[r for r in rows if r.get('name')=='atlas-router']
          assert atlas and (atlas[0].get('pm2_env') or {}).get('status')=='online', atlas
          print('PM2_ATLAS_ROUTER_ONLINE', True)
          print('ATLAS_LIVE_CHECK_PASS=true')
          PY
