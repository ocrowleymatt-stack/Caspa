name: Atlas Shell Identity V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atlas-shell-identity-v2.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply deterministic Atlas repair
        run: python3 scripts/atlas-shell-identity-v2.py
      - name: Test
        run: npm test
      - name: Production build
        run: npm run build
      - name: Assert Atlas identity and mobile ingest
        shell: bash
        run: |
          test -f public/atlas-logo.svg
          grep -q 'NEXUS STRATEGIST' public/atlas-logo.svg
          grep -q '/atlas-logo.svg' src/App.tsx
          test "$(grep -c 'className="atlas-mobile-upload"' src/App.tsx)" -eq 1
          ! grep -q 'fastUploadRef' src/App.tsx
          ! grep -q 'onFastUpload=' src/App.tsx
          grep -q '>ATLAS</div>' src/App.tsx
          grep -q '/api/atlas/knowledge' src/services/knowledgeClient.ts
          grep -q 'X-Atlas-Local-Scope' src/services/knowledgeClient.ts
          grep -q 'app.use("/api/atlas/knowledge"' server.ts
          grep -q "service: 'Atlas'" src/services/doctorService.ts
          grep -q 'ATLAS • Nexus Strategist' index.html
          grep -q '"service":"Atlas"' .github/workflows/deploy-atlas.yml
      - name: Commit verified Atlas repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name atlas-automation
          git config user.email atlas-automation@users.noreply.github.com
          git add src/App.tsx src/main.tsx index.html src/services/knowledgeClient.ts src/routes/caspa-knowledge-routes.ts server.ts src/services/doctorService.ts
          git commit -m 'Restore Atlas identity and one mobile upload control'
          git push origin HEAD:main
