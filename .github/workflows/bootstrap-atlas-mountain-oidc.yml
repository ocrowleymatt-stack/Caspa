name: Bootstrap Atlas Mountain OIDC deploy bridge

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'deployment/atlas-mountain-oidc/**'
      - '.github/workflows/bootstrap-atlas-mountain-oidc.yml'
  push:
    branches: [main]
    paths:
      - 'deployment/atlas-mountain-oidc/**'
      - '.github/workflows/bootstrap-atlas-mountain-oidc.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate fixed deployment bridge
        shell: bash
        run: |
          set -euo pipefail
          node --check deployment/atlas-mountain-oidc/receiver.mjs
          node --check deployment/atlas-mountain-oidc/portal-receiver.mjs
          python3 -m py_compile deployment/atlas-mountain-oidc/mount-music-runtime-receiver.py
          bash -n deployment/atlas-mountain-oidc/deploy.sh
          bash -n deployment/atlas-mountain-oidc/bootstrap.sh
          bash -n deployment/atlas-mountain-oidc/bootstrap-portal-receiver.sh
          bash -n deployment/atlas-mountain-oidc/portal-deploy-runner.sh
          grep -Fq "ocrowleymatt-stack/atlas-mountain" deployment/atlas-mountain-oidc/receiver.mjs
          grep -Fq "1343069841" deployment/atlas-mountain-oidc/receiver.mjs
          grep -Fq "atlas-mountain-music-runtime" deployment/atlas-mountain-oidc/receiver.mjs
          grep -Fq "provision-runpod-music.yml@refs/heads/main" deployment/atlas-mountain-oidc/receiver.mjs
          grep -Fq "/__atlas_mountain_music_runtime/v1" deployment/atlas-mountain-oidc/receiver.mjs
          grep -Fq "/__atlas_mountain_music_runtime/v1" deployment/atlas-mountain-oidc/nginx-music-runtime-receiver.conf
          grep -Fq "atlas-mountain-music-runtime-receiver.conf" deployment/atlas-mountain-oidc/mount-music-runtime-receiver.py
          grep -Fq "ocrowleymatt-stack/ocrowley-evidence-portal" deployment/atlas-mountain-oidc/portal-receiver.mjs
          grep -Fq "1261391891" deployment/atlas-mountain-oidc/portal-receiver.mjs
          grep -Fq "274130919" deployment/atlas-mountain-oidc/portal-receiver.mjs
          grep -Fq "127.0.0.1:43101" deployment/atlas-mountain-oidc/nginx-app.conf
          grep -Fq "127.0.0.1:3016" deployment/atlas-mountain-oidc/nginx-receiver.conf
          grep -Fq "127.0.0.1:3017" deployment/atlas-mountain-oidc/nginx-receiver.conf
          echo 'mountain_oidc_bridge_validation=true'
          echo 'mountain_music_runtime_oidc_bridge_validation=true'
          echo 'mountain_music_runtime_multi_vhost_mount_validation=true'
          echo 'portal_oidc_bridge_validation=true'

  bootstrap:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ATLAS_HOST: 116.202.24.63
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Select current live server identity
        shell: bash
        run: |
          set -euo pipefail
          key=''
          selected=''
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY DEPLOY_SSH_KEY SERVER_SSH_KEY; do
            if [ -n "${!name:-}" ]; then key="${!name}"; selected="$name"; break; fi
          done
          test -n "$key" || { echo 'No live server SSH credential is configured.' >&2; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
          echo "live_server_identity=$selected"

      - name: Install Atlas and Portal deployment receivers
        shell: bash
        run: |
          set -euo pipefail
          remote=/tmp/atlas-mountain-oidc-bootstrap
          ssh -i ~/.ssh/id_ed25519 root@"$ATLAS_HOST" "rm -rf '$remote' && mkdir -p '$remote'"
          scp -i ~/.ssh/id_ed25519 -r deployment/atlas-mountain-oidc/. root@"$ATLAS_HOST":"$remote/"
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 root@"$ATLAS_HOST" \
            "bash '$remote/bootstrap.sh' '$remote' && bash '$remote/bootstrap-portal-receiver.sh' '$remote' && rm -rf '$remote'"

      - name: Verify receivers without credentials
        shell: bash
        run: |
          set -euo pipefail
          mountain="$(curl -ksS -o /dev/null -w '%{http_code}' --max-time 10 -X POST -H 'Content-Type: application/json' --data '{}' https://atlas.ocrowley.com/__atlas_mountain_deploy/v1)"
          music="$(curl -ksS -o /dev/null -w '%{http_code}' --max-time 10 -X POST -H 'Content-Type: application/json' --data '{}' https://atlas.ocrowley.com/__atlas_mountain_music_runtime/v1)"
          portal="$(curl -ksS -o /dev/null -w '%{http_code}' --max-time 10 -X POST -H 'Content-Type: application/json' --data '{}' https://atlas.ocrowley.com/__portal_deploy/v1)"
          test "$mountain" = 401
          test "$music" = 401
          test "$portal" = 401
          curl -fsS --max-time 10 https://atlas.ocrowley.com/health >/dev/null
          echo "mountain_receiver_public_unauthenticated=$mountain"
          echo "mountain_music_runtime_receiver_public_unauthenticated=$music"
          echo "portal_receiver_public_unauthenticated=$portal"
          echo 'existing_atlas_still_healthy=true'

      - name: Inspect Mountain static edge
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 root@"$ATLAS_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo '=== STATIC PATH ==='
          namei -l /var/www/atlas-mountain/v12/index.html 2>&1 || true
          stat -c 'path=%n mode=%a owner=%U group=%G size=%s' /var/www/atlas-mountain/v12/index.html 2>&1 || true
          find /var/www/atlas-mountain/v12 -maxdepth 2 -printf '%M %u:%g %p\n' 2>/dev/null | head -40 || true
          echo '=== LOCAL HTTPS V12 ==='
          code="$(curl -ksS -o /tmp/atlas-v12-diagnostic.html -w '%{http_code}' --max-time 10 --resolve atlas.ocrowley.com:443:127.0.0.1 https://atlas.ocrowley.com/v12/ 2>/dev/null || true)"
          echo "local_v12_status=${code:-000}"
          head -c 240 /tmp/atlas-v12-diagnostic.html 2>/dev/null || true
          echo
          echo '=== MOUNTAIN NGINX INCLUDE ==='
          grep -RFn 'atlas-mountain-v12.conf\|atlas-mountain-music-runtime-receiver.conf' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null || true
          sed -n '1,220p' /etc/nginx/snippets/atlas-mountain-v12.conf 2>/dev/null || true
          echo '=== RECENT NGINX ERRORS ==='
          tail -n 120 /var/log/nginx/error.log 2>/dev/null | grep -E 'v12|atlas-mountain|permission|not found|open\(\)' || true
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
