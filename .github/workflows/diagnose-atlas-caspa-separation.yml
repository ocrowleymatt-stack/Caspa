name: Diagnose Atlas Caspa Separation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-atlas-caspa-separation.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: Select SSH key
        shell: bash
        run: |
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
      - name: Find active OpenWebUI Caspa dependencies
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'docker exec -i atlas-openwebui python3 -' <<'PY'
          import sqlite3
          con=sqlite3.connect('/app/backend/data/webui.db')
          rows=con.execute("select id,name,is_active,content from function where is_active=1 order by id").fetchall()
          hits=[]
          for fid,name,active,content in rows:
              text=str(content or '')
              if 'caspa.ocrowley.com' in text.lower() or '/root/Caspa' in text or 'CASPA' in text:
                  lines=[]
                  for i,line in enumerate(text.splitlines(),1):
                      if 'caspa' in line.lower():
                          lines.append(f'{i}: {line[:300]}')
                  hits.append((fid,name,lines[:20]))
          print('active_function_count=',len(rows))
          print('caspa_coupled_function_count=',len(hits))
          for fid,name,lines in hits:
              print('\n###',fid,'|',name)
              for line in lines: print(line)
          PY
