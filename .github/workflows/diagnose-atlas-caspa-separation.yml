name: Diagnose Atlas Caspa Separation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-atlas-caspa-separation.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: Select SSH key
        shell: bash
        run: |
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect live service boundaries
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'bash -s' <<'REMOTE'
          set -u
          echo '=== PM2 ==='
          pm2 jlist 2>/dev/null | python3 -c "import sys,json; a=json.load(sys.stdin); [print(x.get('name'), x.get('pm2_env',{}).get('status'), x.get('pm2_env',{}).get('pm_cwd'), x.get('pm2_env',{}).get('pm_exec_path')) for x in a]" || pm2 ls || true
          echo '=== DOCKER ==='
          docker ps --format '{{.Names}}|{{.Image}}|{{.Ports}}' || true
          echo '=== LISTENERS ==='
          ss -lntp | grep -E ':(80|443|3000|3001|3002|3003|8000|8080|11434)\b' || true
          echo '=== NGINX SERVER NAMES / PROXIES ==='
          nginx -T 2>/dev/null | grep -nE 'server_name|proxy_pass|listen 443|listen 80' | head -n 240 || true
          echo '=== CERTBOT ==='
          certbot certificates 2>/dev/null | grep -E 'Certificate Name:|Domains:' || true
          echo '=== ROOT DIRECTORIES ==='
          find /root -maxdepth 2 -type d \( -iname '*caspa*' -o -iname '*atlas*' \) -print 2>/dev/null | sort || true
          echo '=== CASPA REMOTE ==='
          if [ -d /root/Caspa/.git ]; then cd /root/Caspa && git remote -v && git branch --show-current && git rev-parse HEAD; fi
          echo '=== OPENWEBUI NETWORK ==='
          docker inspect atlas-openwebui --format '{{json .NetworkSettings.Networks}}' 2>/dev/null || true
          REMOTE
