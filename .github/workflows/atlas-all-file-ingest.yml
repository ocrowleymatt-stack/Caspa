name: Atlas All File Ingest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atlas-all-file-ingest.yml'
      - 'scripts/atlas-all-file-ingest.py'

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply unrestricted Atlas/Caspa file ingest
        run: python3 scripts/atlas-all-file-ingest.py
      - name: Test
        run: npm test
      - name: Production build
        run: npm run build
      - name: Assert unrestricted pickers and upload route
        shell: bash
        run: |
          if grep -R 'accept="' src/App.tsx src/components/SettingsStudio.tsx src/components/CommissionStudio.tsx; then
            echo 'A file picker is still restricted.' >&2
            exit 1
          fi
          grep -q "router.post('/ingest/file'" src/routes/caspa-knowledge-routes.ts
          grep -q 'ingestKnowledgeFile' src/App.tsx
          grep -q 'ingestKnowledgeFile' src/components/CommissionStudio.tsx
      - name: Commit verified patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No source change required.'
            exit 0
          fi
          git config user.name atlas-automation
          git config user.email atlas-automation@users.noreply.github.com
          git add src/App.tsx src/components/SettingsStudio.tsx src/components/CommissionStudio.tsx src/services/knowledgeClient.ts src/services/cloudKnowledgeIngestionService.ts src/routes/caspa-knowledge-routes.ts
          git commit -m 'Accept all file types across Atlas and Caspa ingest'
          git push origin HEAD:main
