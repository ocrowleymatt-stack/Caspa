name: Probe Hetzner Atlas runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atlas-private-repo-server-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ATLAS_HOST: 116.202.24.63
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
    steps:
      - name: Select server SSH identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PRIVATEKEY2:-}" || { echo 'PRIVATEKEY2 is unavailable' >&2; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$PRIVATEKEY2" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Probe Atlas Actions runner on Hetzner
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 root@"$ATLAS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          mapfile -t units < <(systemctl list-unit-files --type=service --no-legend 2>/dev/null \
            | awk '$1 ~ /^actions\.runner\./ {print $1}')
          echo "actions_runner_units=${#units[@]}"
          for unit in "${units[@]}"; do
            state="$(systemctl is-active "$unit" 2>/dev/null || true)"
            enabled="$(systemctl is-enabled "$unit" 2>/dev/null || true)"
            printf 'actions_runner_unit=%s state=%s enabled=%s\n' "$unit" "$state" "$enabled"
          done

          mapfile -t configs < <(find /root /home /opt /srv -maxdepth 5 -type f -name .runner -print 2>/dev/null | head -20)
          echo "actions_runner_configs=${#configs[@]}"
          for config in "${configs[@]}"; do
            python3 - "$config" <<'PY'
          import json,sys
          p=sys.argv[1]
          try:
              d=json.load(open(p))
          except Exception:
              print('actions_runner_config=unreadable')
              raise SystemExit
          # Only non-secret identity metadata; never emit tokens/credentials.
          print('actions_runner_config=' + p)
          print('actions_runner_name=' + str(d.get('agentName') or d.get('name') or 'unknown'))
          print('actions_runner_pool=' + str(d.get('poolName') or d.get('poolId') or 'unknown'))
          print('actions_runner_server=' + str(d.get('gitHubUrl') or d.get('serverUrl') or 'unknown'))
          PY
          done

          listeners="$(pgrep -af 'Runner.Listener|runsvc.sh' 2>/dev/null | wc -l | tr -d ' ')"
          echo "actions_runner_listener_processes=$listeners"
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
