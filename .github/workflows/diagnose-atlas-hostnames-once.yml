name: Apply Atlas hostname direct cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-atlas-hostnames-once.yml'

permissions:
  contents: read

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: SSH setup
        shell: bash
        run: |
          set -euo pipefail
          key="${PRIVATEKEY2:-${HETZNER_SSH_KEY:-}}"
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Cut atlas.ocrowley.com directly to new Atlas
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          file=/etc/nginx/conf.d/zzz-atlas-auth.conf
          cp "$file" "/var/backups/zzz-atlas-auth.$(date -u +%Y%m%dT%H%M%SZ).bak"
          python3 - <<'PY'
from pathlib import Path
p=Path('/etc/nginx/conf.d/zzz-atlas-auth.conf')
s=p.read_text()
start=s.index('server {', s.index('server_name atlas.ocrowley.com;')-200)
server_name_pos=s.index('server_name atlas.ocrowley.com;', start)
loc=s.index('    location / {', server_name_pos)
end=s.index('    }', loc)+5
new='''    location / {
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_redirect off;
    }'''
s=s[:loc]+new+s[end:]
p.write_text(s)
PY
          nginx -t
          systemctl reload nginx
          echo '--- atlas.ocrowley.com root after cutover ---'
          curl -k -sS -D - -o /tmp/root https://127.0.0.1/ -H 'Host: atlas.ocrowley.com' | sed -n '1,20p'
          echo '--- login after cutover ---'
          curl -k -sS -D - -o /tmp/login https://127.0.0.1/__atlas/login -H 'Host: atlas.ocrowley.com' | sed -n '1,20p'
          grep -q 'Sign in to private Atlas' /tmp/login
          if grep -q 'x-nextjs-cache' /tmp/root; then exit 1; fi
          REMOTE

      - name: Verify public old hostname is on new gateway
        shell: bash
        run: |
          set -euo pipefail
          h="$(curl -sS -I https://atlas.ocrowley.com/)"
          printf '%s\n' "$h"
          if printf '%s\n' "$h" | grep -qi 'x-nextjs-cache'; then
            echo "Old Next.js app is still serving" >&2
            exit 1
          fi
          printf '%s\n' "$h" | grep -qiE '^HTTP/.* (200|303)'
          curl -sS https://atlas.ocrowley.com/__atlas/login | grep -q 'Sign in to private Atlas'
