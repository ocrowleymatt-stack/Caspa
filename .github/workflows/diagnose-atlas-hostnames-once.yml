name: Cut over old Atlas hostname using proven runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-atlas-hostnames-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: Select SSH key
        shell: bash
        run: |
          set -euo pipefail
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY; do
            if [ -n "${!name:-}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Redirect atlas.ocrowley.com to Atlas2
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          file=/etc/nginx/conf.d/zzz-atlas-auth.conf
          cp "$file" "/var/backups/zzz-atlas-auth-before-atlas2-cutover.conf"
          python3 -c 'from pathlib import Path; p=Path("/etc/nginx/conf.d/zzz-atlas-auth.conf"); s=p.read_text(); old="    location / {\n        proxy_pass http://127.0.0.1:8790;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n        proxy_redirect off;\n    }"; new="    location / {\n        return 302 https://atlas2.ocrowley.com$request_uri;\n    }"; assert new in s or old in s, "expected old Atlas location block missing"; p.write_text(s if new in s else s.replace(old,new,1))'
          nginx -t
          systemctl reload nginx
          echo "--- atlas.ocrowley.com ---"
          curl -k -sSI https://127.0.0.1/ -H 'Host: atlas.ocrowley.com' | sed -n '1,15p'
          echo "--- agentic route still present ---"
          nginx -T 2>/dev/null | grep -n -A22 'server_name atlas.ocrowley.com' | head -55
          REMOTE

      - name: Verify public redirect
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl -sSI https://atlas.ocrowley.com/)"
          printf '%s\n' "$headers"
          printf '%s\n' "$headers" | grep -qi '^location: https://atlas2.ocrowley.com/'
