name: Audit Atlas Custom Models

on:
  push:
    paths:
      - '.github/workflows/audit-atlas-custom-models.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: Select SSH key
        shell: bash
        run: |
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Verify custom-model web activation and backend
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== OPENWEBUI SEARCH ENV NAMES ==='
          docker inspect atlas-openwebui --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | sed 's/=.*//' | sort | grep -Ei 'SEARCH|SEARX|RAG_WEB|WEB_LOADER' || true

          echo '=== OPENWEBUI SEARCH CONFIG KEYS ==='
          docker exec -i atlas-openwebui python3 - <<'PY'
          import sqlite3,json,re
          con=sqlite3.connect('/app/backend/data/webui.db'); con.row_factory=sqlite3.Row
          def parse(v):
              try:return json.loads(v) if isinstance(v,str) else v
              except:return None
          for row in con.execute('SELECT * FROM config'):
              d=dict(row); key=str(d.get('key') or '')
              if re.search(r'(search|searx|web|rag)',key,re.I):
                  val=d.get('value'); obj=parse(val)
                  if re.search(r'(key|token|secret|password)',key,re.I): out='<redacted>'
                  elif isinstance(obj,(dict,list)): out=f'<{type(obj).__name__}>'
                  else: out=val
                  print(json.dumps({'key':key,'value':out}))
          print('=== PUBLIC SOURCE FILTER ===')
          row=con.execute("SELECT content,is_global,is_active FROM function WHERE id='atlas-public-source-research'").fetchone()
          if row:
              print(json.dumps({'is_global':row['is_global'],'is_active':row['is_active']}))
              for i,line in enumerate(str(row['content'] or '').splitlines(),1):
                  if re.search(r'(body|feature|web|search|public.source|system|prompt|inlet|outlet)',line,re.I): print(f'{i:04d} {line[:500]}')
          con.close()
          PY

          echo '=== SEARXNG DIRECT QUERY FROM OPENWEBUI NETWORK ==='
          docker exec atlas-openwebui python3 -c "import urllib.request; u='http://atlas-searxng:8080/search?q=OpenAI%20August%202026&format=json'; r=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=10); d=r.read(); print('http='+str(r.status),'bytes='+str(len(d)),d[:260].decode('utf-8','replace').replace('\\n',' '))" || true

          echo '=== OPENWEBUI FEATURE PROCESSING LOCATIONS ==='
          docker exec atlas-openwebui sh -lc "grep -RIn --include='*.py' -E 'features.*web_search|web_search.*features' /app/backend/open_webui 2>/dev/null | head -30" || true
          REMOTE
