name: Audit Atlas Custom Models

on:
  push:
    paths:
      - '.github/workflows/audit-atlas-custom-models.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ATLAS_HOST: 116.202.24.63
      ATLAS_USER: root
    steps:
      - name: Select SSH key
        shell: bash
        run: |
          key=""
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then key="${!name}"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts

      - name: Audit live OpenWebUI custom models and functions
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 "${ATLAS_USER}@${ATLAS_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          docker exec -i atlas-openwebui python3 - <<'PY'
          import sqlite3, json, hashlib, re

          DB='/app/backend/data/webui.db'
          con=sqlite3.connect(DB)
          con.row_factory=sqlite3.Row

          def exists(name):
              return con.execute("SELECT 1 FROM sqlite_master WHERE type='table' AND name=?", (name,)).fetchone() is not None
          def parse(v):
              if isinstance(v,(dict,list)): return v
              if not isinstance(v,str) or not v.strip(): return None
              try: return json.loads(v)
              except Exception: return None

          print('=== LIVE CUSTOM MODEL AUDIT V2 ===')
          if exists('function'):
              rows=con.execute('SELECT * FROM "function" ORDER BY id').fetchall()
              print(json.dumps({'function_count':len(rows)}))
              for row in rows:
                  d=dict(row); code=str(d.get('content') or ''); low=code.lower()
                  hosts=[]
                  for u in re.findall(r'https?://[^\s\"\'<>]+',code):
                      m=re.match(r'https?://([^/]+)',u)
                      if m: hosts.append(m.group(1))
                  rec={
                    'id':d.get('id'),'name':d.get('name'),'type':d.get('type'),'active':d.get('is_active'),
                    'sha12':hashlib.sha256(code.encode()).hexdigest()[:12],'lines':len(code.splitlines()),
                    'canonical':('/api/ai/call' in code or 'routeAtlasPrompt' in code or 'callWithProviderFailover' in code),
                    'generate_chat_completion':('generate_chat_completion' in code),
                    'web_flag':('useWebSearch' in code or 'useSearch' in code or 'use_search' in low),
                    'web_tool':('web_search' in low or 'x_search' in low or 'googleSearch' in code or 'google_search' in low),
                    'self_search':any(x in low for x in ('searx','spiderfoot','bbot','intelowl','active_osint','perplexica')),
                    'ollama':('ollama' in low or '11434' in code),
                    'hosts':sorted(set(hosts))[:20],
                  }
                  print(json.dumps(rec,sort_keys=True))

              print('=== ROUTING SOURCE EXCERPTS ===')
              wanted={'atlas-auto','atlas-frontier-failover','atlas-deep-research-v2','atlas-deep-research-v21','atlas-council'}
              pattern=re.compile(r'(generate_chat_completion|model_id|model\b|ollama|11434|web_search|use.?search|google.?search|searx|spiderfoot|bbot|intelowl|perplexica|api/ai/call|httpx|requests\.|client\.(get|post)|taskhint|strictprovider|provider)',re.I)
              for row in rows:
                  d=dict(row)
                  if d.get('id') not in wanted: continue
                  print(f"--- {d.get('id')} ---")
                  lines=str(d.get('content') or '').splitlines()
                  shown=0
                  for i,line in enumerate(lines,1):
                      if pattern.search(line):
                          clean=re.sub(r'([A-Za-z0-9_]*(?:KEY|TOKEN|SECRET)[A-Za-z0-9_]*)\s*=\s*[\"\'][^\"\']+[\"\']',r'\1=<redacted>',line,flags=re.I)
                          print(f'{i:04d} {clean[:500]}')
                          shown+=1
                          if shown>=90: break

          if exists('model'):
              print('=== MODEL CAPABILITIES ===')
              rows=con.execute('SELECT * FROM "model" ORDER BY id').fetchall()
              print(json.dumps({'model_count':len(rows)}))
              for row in rows:
                  d=dict(row); meta=parse(d.get('meta')); params=parse(d.get('params'))
                  rec={
                    'id':d.get('id'),'name':d.get('name'),'base_model_id':d.get('base_model_id'),'active':d.get('is_active'),
                    'capabilities':meta.get('capabilities') if isinstance(meta,dict) else None,
                    'toolIds':meta.get('toolIds') if isinstance(meta,dict) else None,
                    'defaultFeatureIds':meta.get('defaultFeatureIds') if isinstance(meta,dict) else None,
                    'param_keys':sorted(params.keys()) if isinstance(params,dict) else [],
                  }
                  print(json.dumps(rec,sort_keys=True))
          con.close()
          PY
          REMOTE
