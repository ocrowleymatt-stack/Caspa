name: Apply deterministic Atlas v12 serving

on:
  push:
    branches: [chatgpt/apply-deterministic-v12]

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ATLAS_HOST: 116.202.24.63
      PRIVATEKEY2: ${{ secrets.PRIVATEKEY2 }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Select live server identity
        shell: bash
        run: |
          set -euo pipefail
          key=''
          for name in PRIVATEKEY2 HETZNER_SSH_KEY ATLAS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY DEPLOY_SSH_KEY SERVER_SSH_KEY; do
            if [ -n "${!name:-}" ]; then key="${!name}"; echo "identity=$name"; break; fi
          done
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ATLAS_HOST" >> ~/.ssh/known_hosts
      - name: Install merged Mountain bridge
        shell: bash
        run: |
          set -euo pipefail
          remote=/tmp/atlas-mountain-deterministic-v12
          ssh -i ~/.ssh/id_ed25519 root@"$ATLAS_HOST" "rm -rf '$remote' && mkdir -p '$remote'"
          scp -i ~/.ssh/id_ed25519 -r deployment/atlas-mountain-oidc/. root@"$ATLAS_HOST":"$remote/"
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 root@"$ATLAS_HOST" \
            "bash '$remote/bootstrap.sh' '$remote' && rm -rf '$remote'"
      - name: Verify serving rule
        shell: bash
        run: |
          set -euo pipefail
          ui="$(curl -ksS -o /tmp/v12.html -w '%{http_code}' --max-time 10 https://atlas.ocrowley.com/v12/)"
          api="$(curl -ksS -o /dev/null -w '%{http_code}' --max-time 10 https://atlas.ocrowley.com/v12/api/models || true)"
          test "$ui" = 200
          case "$api" in 401|403) ;; *) exit 1 ;; esac
          ssh -i ~/.ssh/id_ed25519 root@"$ATLAS_HOST" "grep -F 'alias /var/www/atlas-mountain/v12/index.html;' /etc/nginx/snippets/atlas-mountain-v12.conf >/dev/null"
          echo "v12_ui=$ui"
          echo "v12_api_anon=$api"
          echo 'deterministic_root_alias=installed'
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519 /tmp/v12.html
