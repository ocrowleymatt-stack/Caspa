server {
  listen 443 ssl;
  server_name caspa.example.test;

  location / {
    more_clear_input_headers X-Authentik-Uid X-Authentik-Email X-Authentik-Name X-Authentik-Groups X-Caspa-User-Id X-Caspa-Proxy-Secret;
    proxy_set_header X-Authentik-Uid "";
    proxy_set_header X-Caspa-Proxy-Secret "";
    proxy_set_header X-Authentik-Uid $authentik_uid;
    proxy_set_header X-Authentik-Email $authentik_email;
    proxy_set_header X-Authentik-Name $authentik_name;
    proxy_set_header X-Authentik-Groups $authentik_groups;
    proxy_set_header X-Caspa-Proxy-Secret $caspa_proxy_secret;
    proxy_pass http://127.0.0.1:3000;
  }
}
