server {
  listen 443 ssl;
  server_name caspa.example.test;

  location / {
    set $authentik_uid $http_x_authentik_uid;
    more_clear_input_headers X-Authentik-Uid X-Authentik-Email X-Authentik-Name X-Authentik-Username X-Authentik-Groups X-Caspa-User-Id X-Caspa-User-Email X-Caspa-User-Name X-Caspa-User-Groups X-Caspa-Proxy-Secret;
    proxy_set_header X-Authentik-Uid "";
    proxy_set_header X-Caspa-User-Id "";
    proxy_set_header X-Caspa-Proxy-Secret "";
    proxy_set_header X-Authentik-Uid $authentik_uid;
    proxy_set_header X-Caspa-Proxy-Secret $caspa_proxy_secret;
    proxy_pass http://127.0.0.1:3000;
  }
}
