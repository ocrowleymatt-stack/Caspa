# Included inside the existing atlas.ocrowley.com TLS server block.
location = /__atlas_mountain_deploy/v1 {
    client_max_body_size 20m;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 540s;
    proxy_send_timeout 540s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://127.0.0.1:3016/__atlas_mountain_deploy/v1;
}

# Narrow OIDC-only lane used by the guarded RunPod Music workflow. The receiver
# validates the exact workflow/ref/audience and can update only the two Music
# runtime variables before restarting Nexus.
location = /__atlas_mountain_music_runtime/v1 {
    client_max_body_size 16k;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://127.0.0.1:3016/__atlas_mountain_music_runtime/v1;
}

# Separate receiver, separately locked to the private Evidence Portal repository.
location = /__portal_deploy/v1 {
    client_max_body_size 20m;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 540s;
    proxy_send_timeout 540s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://127.0.0.1:3017/__portal_deploy/v1;
}
