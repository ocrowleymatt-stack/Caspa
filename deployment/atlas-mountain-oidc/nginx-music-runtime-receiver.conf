# Dedicated workflow-scoped Music runtime handoff. Mounted into every effective
# Atlas HTTPS vhost so duplicate/static Atlas edges cannot bypass the receiver.
location = /__atlas_mountain_music_runtime/v1 {
    client_max_body_size 16k;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://127.0.0.1:3016/__atlas_mountain_music_runtime/v1;
}
