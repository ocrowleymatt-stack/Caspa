# Hestor website-design preview.
# This location deliberately bypasses both Atlas/OpenWebUI auth and the Portal
# dev application. It is static-only, noindex, and rooted in Atlas workspace.
location = /hestor {
    return 308 /hestor/;
}

location ^~ /hestor/ {
    alias /var/lib/atlas-mountain/workspace/sites/hestor/;
    index index.html;

    # Never hand a missing Hestor asset/page to another SPA or upstream.
    # Static deep links may fall back only to Hestor's own index document.
    try_files $uri $uri/ /hestor/index.html =404;

    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Hestor-Preview "static" always;
}
