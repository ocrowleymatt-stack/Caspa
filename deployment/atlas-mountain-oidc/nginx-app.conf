# Included inside the existing atlas.ocrowley.com server block.
# Static application assets are safe to load without authentication; every
# Nexus API call is authenticated against the existing OpenWebUI bearer token.

location = /__atlas_mountain_auth {
    internal;
    proxy_pass http://127.0.0.1:3002/api/v1/auths/;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Host $host;
}

location = /v12 {
    return 308 /v12/;
}

location = /v12/api {
    auth_request /__atlas_mountain_auth;
    proxy_set_header Origin "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:43101/api;
}

location ^~ /v12/api/ {
    auth_request /__atlas_mountain_auth;
    proxy_set_header Origin "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_pass http://127.0.0.1:43101/api/;
}

location = /v12/health {
    auth_request /__atlas_mountain_auth;
    proxy_set_header Origin "";
    proxy_pass http://127.0.0.1:43101/health;
}

location ^~ /v12/ {
    root /var/www/atlas-mountain;
    try_files $uri $uri/ /v12/index.html;
    add_header Cache-Control "no-store" always;
}
