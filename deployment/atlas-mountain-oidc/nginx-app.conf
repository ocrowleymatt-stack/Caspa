# Included inside the existing atlas.ocrowley.com server block.
# Static application assets are safe to load without authentication; every
# Nexus API call requires an OpenWebUI session token and is then validated
# against OpenWebUI's current-session endpoint.

location = /__atlas_mountain_auth {
    internal;
    proxy_pass http://127.0.0.1:3002/api/v1/auths/;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Host $host;
}

location = /v12 {
    return 308 /v12/;
}

location = /v12/api {
    if ($cookie_token = "") { return 401; }
    auth_request /__atlas_mountain_auth;
    proxy_set_header Origin "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:43101/api;
}

location ^~ /v12/api/ {
    if ($cookie_token = "") { return 401; }
    auth_request /__atlas_mountain_auth;
    proxy_set_header Origin "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_pass http://127.0.0.1:43101/api/;
}

location = /v12/health {
    if ($cookie_token = "") { return 401; }
    auth_request /__atlas_mountain_auth;
    proxy_set_header Origin "";
    proxy_pass http://127.0.0.1:43101/health;
}

# Serve the SPA entry point as a file, not through try_files directory/URI
# resolution. This keeps the root deterministic while release trees are
# atomically exchanged by the deployer.
location = /v12/ {
    alias /var/www/atlas-mountain/v12/index.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
}

location ^~ /v12/ {
    root /var/www/atlas-mountain;
    try_files $uri /v12/index.html;
    add_header Cache-Control "no-store" always;
}
